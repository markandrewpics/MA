<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Campus signups | Mark Andrew</title><style>*{box-sizing:border-box}body{background:#0c1322;color:#eef0f5;font:17px system-ui;margin:0;padding:28px 20px}main{max-width:800px;margin:auto}h1{font-size:30px}label{display:block}input,button{font:inherit;border-radius:5px;padding:13px;margin-top:12px;min-height:48px}input{width:100%;max-width:420px}button{background:#f09a69;border:0;color:#101723;cursor:pointer}article{padding:18px 0;border-bottom:1px solid #49505f}article p{margin:4px 0}a{color:#f09a69}small{color:#bbc2cf}.actions{display:flex;gap:12px;flex-wrap:wrap}#status{min-height:24px}</style></head><body><main><h1>Campus signups</h1><form id="login"><label for="code">Your photo-critique review access code</label><input id="code" type="password" autocomplete="current-password" required><br><button>Sign in</button></form><section id="dashboard" hidden><p id="count"></p><div class="actions"><button id="refresh">Refresh</button><button id="export">Download CSV</button><button id="logout">Sign out</button></div><div id="list"></div></section><p id="status" role="status" aria-live="polite"></p></main><script>
let records=[];const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),statusEl=document.querySelector('#status');async function api(data){const r=await fetch('/api/campus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error||'Please try again.');return b;}
async function load(){statusEl.textContent='Loading…';try{let cursor=null,all=[];do{const r=await fetch('/api/campus'+(cursor?'?cursor='+encodeURIComponent(cursor):''));const b=await r.json();if(!r.ok){if(r.status===401){login.hidden=false;dashboard.hidden=true;}throw Error(b.error||'Could not load signups.');}all.push(...b.records);cursor=b.cursor;}while(cursor);records=all.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));login.hidden=true;dashboard.hidden=false;document.querySelector('#count').textContent=records.length+' signups';const list=document.querySelector('#list');list.replaceChildren();for(const record of records){const a=document.createElement('article'),name=document.createElement('p'),phone=document.createElement('p'),date=document.createElement('small');name.textContent=record.name;phone.textContent=record.phone;date.textContent=new Date(record.createdAt).toLocaleString();a.append(name,phone,date);list.append(a);}statusEl.textContent=records.length?'':'No signups yet.';}catch(e){statusEl.textContent=e.message;}}
login.addEventListener('submit',async e=>{e.preventDefault();const b=login.querySelector('button');b.disabled=true;try{await api({action:'login',code:document.querySelector('#code').value});document.querySelector('#code').value='';await load();}catch(err){statusEl.textContent=err.message;}finally{b.disabled=false;}});document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=async()=>{try{await api({action:'logout'});records=[];document.querySelector('#list').replaceChildren();dashboard.hidden=true;login.hidden=false;statusEl.textContent='Signed out.';}catch(e){statusEl.textContent=e.message;}};document.querySelector('#export').onclick=()=>{const cell=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const rows=[['Name','Phone','Submitted','Permission'],...records.map(r=>[r.name,r.phone,r.createdAt,r.permission])];const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='campus-signups.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};load();
</script></body></html>
