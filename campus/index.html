<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1322"><meta name="robots" content="noindex,nofollow"><title>Your pictures | Mark Andrew Photography</title><link rel="stylesheet" href="/fonts/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1322;color:#eef0f5;font-family:Jost,Arial,sans-serif;padding:28px 22px 40px}main{max-width:420px;margin:auto}header{text-align:center}.logo{width:240px;height:auto;max-width:80%;display:block;margin:0 auto 16px}.tagline{font-size:15px;color:#f09a69;margin:0 0 30px}h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:34px;line-height:1.12;text-align:center;margin:0 0 26px}label{display:block;font-size:16px;margin:18px 0 7px}input{width:100%;min-height:54px;background:#fff;border:2px solid #fff;border-radius:6px;color:#0c1322;padding:12px 14px;font:18px Jost,Arial,sans-serif}input:focus-visible,button:focus-visible{outline:3px solid #f09a69;outline-offset:4px}button{width:100%;min-height:55px;border:0;border-radius:6px;background:#f09a69;color:#101723;font:bold 17px Jost,Arial,sans-serif;margin:22px 0 0;padding:14px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.permission{font-size:12px;color:#bbc2cf;line-height:1.5;margin:15px 0}.permission a{color:inherit}.trap{position:absolute;left:-9999px}#status{font-size:16px;line-height:1.5;margin-top:20px}#status.error{color:#ffbea5}#status.success{text-align:center;padding:24px 18px;border:1px solid #f09a69;border-radius:8px}#status h2{font-size:28px;margin:0 0 8px}.small{font-size:12px;color:#bbc2cf;text-align:center;margin-top:28px}@media(min-width:650px){body{padding-top:48px}.logo{width:270px}}
</style></head><body><main><header><img class="logo" src="/car-show/assets/logo.png" alt="Mark Andrew Photography" width="2048" height="1128"><p class="tagline">michiana’s premier photographer</p></header><h1>let me know how to send you your pictures and interview</h1><form id="signup"><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="100" required><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" placeholder="(574) 555-0123" required><div class="trap" aria-hidden="true"><label for="website">Leave empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><button type="submit" id="submit">Send me my pictures</button><p class="permission">By submitting, you agree that Mark Andrew Photography may text you about your pictures and interview. No marketing signup. Message and data rates may apply. <a href="/privacy-policy/">Privacy policy</a>.</p></form><div id="status" role="status" aria-live="polite" tabindex="-1"></div><p class="small">Mark Andrew Photography</p></main><script>
const form=document.querySelector('#signup'),statusEl=document.querySelector('#status'),button=document.querySelector('#submit');let id=crypto.randomUUID();let busy=false;
form.addEventListener('submit',async event=>{event.preventDefault();if(busy)return;const name=form.elements.name.value.trim(),phone=form.elements.phone.value;const digits=phone.replace(/\D/g,'');if(!/^1?[2-9]\d{2}[2-9]\d{6}$/.test(digits)){statusEl.className='error';statusEl.textContent='Please enter a valid 10-digit US phone number.';form.elements.phone.focus();return;}busy=true;button.disabled=true;button.textContent='Saving…';statusEl.textContent='';try{const response=await fetch('/api/campus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,phone,website:form.elements.website.value,consent:true})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'Please try again.');form.hidden=true;statusEl.className='success';const heading=document.createElement('h2');heading.textContent='You’re all set!';const message=document.createElement('p');message.textContent='Your details are saved. I’ll text you about your pictures and interview. — Mark';statusEl.replaceChildren(heading,message);statusEl.focus();}catch(error){statusEl.className='error';statusEl.textContent=error.message||'Could not connect. Please try again.';statusEl.focus();}finally{busy=false;button.disabled=false;button.textContent='Send me my pictures';}});
</script></body></html>
