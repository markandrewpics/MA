<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Get your free car-show photo | Mark Andrew Photography</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../styles.css?v=20260924-vehicle"><script src="../funnel.js?v=20260924-vehicle" defer></script></head><body class="signup-page"><main class="signup-shell"><img class="logo" src="../assets/logo.png" alt="Mark Andrew Photography" width="2048" height="1128"><div class="entry-card"><h1>Get your free photo.</h1><p>Let me know how I can send you your picture when it’s ready.</p><form id="photo-signup"><fieldset><label for="name">Your name<input id="name" name="name" autocomplete="name" placeholder="First and last name" required></label><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label for="phone">Mobile phone number<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(574) 555-0123" required></label><div class="vehicle-details"><h2>Tell me about your car</h2><p class="fine">These details help me identify your picture and learn about the car you’d like photographed.</p><label for="carYear">Year<input id="carYear" name="carYear" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="1967" required></label><label for="carMakeModel">Make and model<input id="carMakeModel" name="carMakeModel" maxlength="120" placeholder="Ford Mustang GT" required></label><label for="carColor">Color<input id="carColor" name="carColor" maxlength="80" placeholder="Red with white stripes" required></label><label for="carCondition">Current condition<select id="carCondition" name="carCondition" required><option value="">Choose a condition</option><option>Show-ready / restored</option><option>Well-maintained original</option><option>Driver condition / visible wear</option><option>Restoration in progress</option><option>Project / not currently running</option></select></label><label for="carDetails">What makes your car special?<textarea id="carDetails" name="carDetails" rows="4" maxlength="1500" placeholder="Tell me about its history, restoration, custom work, modifications, or what it means to you." required></textarea></label></div><label class="consent"><input type="checkbox" name="consent" required> <span>I agree to receive texts and emails from Mark Andrew Photography about my photo and occasional offers. Message and data rates may apply. Reply STOP to opt out.</span></label><div class="honey" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="button" type="submit">Confirm</button></fieldset></form><p class="fine">Your photo is completely free.</p><p id="signup-status" class="fine" role="status" aria-live="polite"></p><p class="fine"><a href="/privacy-policy/">Privacy</a> · <a href="/terms-of-service/">Terms</a></p></div></main></body></html>
