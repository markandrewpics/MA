<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Tuesday, September 9, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"My prices are public", format:"Unpopular Opinion",
    cover:"covers/face-1.jpg",
    script:`Unpopular opinion: "investment starts at" is a phrase built to get you on a phone call before you find out you can't afford it. I'm not doing that to you. Here are my numbers. Four ninety-nine holds the date, and it's a retainer, not a fee, because I only shoot one woman a day and that day belongs to you. It covers the full day, three outfits, three sets, all your prep guides, a thirty-minute planning call, and your same-day reveal. It does not cover a single image. Most women spend between one thousand and twenty-five hundred on their photographs, and that decision happens after the shoot, at the reveal, once you have already seen them. Hair and makeup is booked straight with the artist, two to two-fifty, and that money never touches me. So you can decide in your own kitchen whether this is a thing you want. I would rather you decided there than found out in my studio at three o'clock.`,
    caption:`Unpopular opinion: "investment starts at" is a sentence designed to get you on a phone call before you find out you can't afford it.

So here are mine, in writing, where anybody can read them.

$499 holds the date. It's a retainer, not a fee — I shoot one woman a day, so that whole day is yours. It covers the full-day session, three outfits across three sets, every prep and styling guide, a 30-minute planning video call, and your same-day reveal.

It covers zero images. Those get chosen after the shoot, at the reveal, once you've already seen them. Most women land between $1,000 and $2,500. Pairs start at $590 and larger packages run around $150 an image.

Hair and makeup is booked directly with the artist, usually $200–$250, and that money never runs through me.

Affirm, Klarna and Afterpay are all on the table if you'd rather spread it out.

Now you can decide in your kitchen instead of finding out in my studio at three o'clock. If it's a yes, the form's in my bio.

#boudoirpricing #southbendphotographer #michianaphotographer #boudoirinvestment #indianaboudoir`
  },
  {
    n:"2", title:"There is no boudoir body", format:"The Waiting List",
    cover:"covers/face-2.jpg",
    script:`There is no boudoir body. There is only yours. Somewhere along the way somebody handed you a picture of who this is supposed to be for, and you have measured yourself against it every year since, come up short, and postponed. I have photographed the body you think disqualifies you. This year. In this room. Women from South Bend, from Mishawaka, from Granger, from Elkhart. And she is not the exception in my files, she is most of them. The woman who finally books at fifty-two is not braver than you are. She just stopped waiting on a version of herself that was never coming. In eight hundred and fifty sessions, nobody has ever sat down at the reveal and told me they wished they had waited longer. Not one. The photographs are not a reward for a body. They are a record of one. Yours, this year, exactly as it is right now.`,
    caption:`There is no boudoir body. There is only yours.

Somebody handed you a picture of who this is supposed to be for, and you've been measuring yourself against it every year since. Come up short. Postponed. Told yourself next year, after the fifteen pounds, after the summer, after something.

I have photographed the body you think disqualifies you. This year, in this room, women from South Bend and Mishawaka and Granger and Elkhart. She isn't the exception in my files. She's most of them.

The woman who finally books at fifty-two isn't braver than you. She just stopped waiting on a version of herself that was never coming.

Nobody has ever sat down at their reveal and told me they wished they'd waited longer. Not once.

These photographs are not a reward for a body. They're a record of one. Yours, this year, exactly as it is right now.

Form's in my bio when you're ready.

#everywomanisthetype #mishawakaindiana #bodyconfidence #grangerindiana #boudoirforeverybody`
  },
  {
    n:"3", title:"Consent is per photo \u2014 Studio Rule Ep. 47", format:"Studio Rule (Ep. 47)",
    cover:"covers/face-3.jpg",
    script:`Nothing you shoot with me goes anywhere unless you pointed at that exact photograph. Studio rule, episode forty-seven. Yes, there is a model release in your contract, and it does absolutely nothing until the reveal. Because at the reveal we sit down and go through them together and you point. This one is fine. Not that one. That one only if you crop my face out. Per image, on the day, in your own words, and I write it down. A blanket yes signed in January by a woman who has not seen a single frame is not consent, it is paperwork. And if you say yes in June and change your mind in October, you text me and they come down. Every time, no questions, no explaining yourself to me. Ask any photographer you are considering what their release actually lets them do with your pictures. Then watch how long it takes them to answer.`,
    caption:`Nothing you shoot with me goes anywhere unless you pointed at that exact photograph. Studio rule, episode 47.

Yes, there's a model release in your contract. And it does nothing at all until the reveal.

Because at the reveal we sit down and go through your images together and you point. This one's fine. Not that one. That one only if you crop my face out. Per image, on the day, in your own words, and I write it down.

A blanket yes signed in January by a woman who hasn't seen a single frame isn't consent. It's paperwork.

Say yes in June, change your mind in October — you text me and they come down. Every time. No questions, no explaining yourself.

Your images live in a password-protected encrypted gallery. The link, the password and the download code go to you and nobody else. My own copies never leave local drives.

Ask any photographer you're considering what their release actually lets them do with your pictures. Then watch how long it takes them to answer.

#studiorules #boudoirprivacy #elkhartindiana #boudoirphotographer #nilesmichigan`
  },
  {
    n:"4", title:"Wait, who is that?", format:"Overheard in the Studio",
    cover:"covers/face-4.jpg",
    script:`The most common thing a woman says at her reveal is not "I love it." It is "wait, who is that?" Six hours earlier she walked into my studio apologizing for her arms. Now there are a hundred and forty edited photographs of her on a sixty-five inch screen and she cannot place the woman in them. She says it out loud, half laughing, like she has caught a stranger standing in her own house. Then she goes quiet. Here is what is actually happening. She has only ever seen herself in a bathroom mirror at seven in the morning, in a phone held too close, and in pictures where she was the one holding the camera. She has never once seen herself lit, directed, and looking back. That is not a filter and it is not a new face. That is the first time anybody photographed her properly, and she cannot place it because nobody ever has.`,
    caption:`The most common sentence at a reveal isn't "I love it." It's "wait, who is that?"

Six hours earlier she walked in apologizing for her arms. Now there are 140 edited, retouched photographs of her on a 65-inch screen and she can't place the woman in them. She says it out loud, half laughing, like she's caught a stranger standing in her own house. Then she goes quiet.

Here's what's actually happening.

She has only ever seen herself three ways: a bathroom mirror at seven in the morning, a phone held too close, and pictures where she was the one holding the camera. Never lit. Never directed. Never looking back.

That's not a filter and it's not a new face. It's the first time anyone photographed her properly, and she can't place it because nobody ever has.

Every one of those images is finished the same afternoon — shot print-ready in camera, edited over lunch, on the screen before she goes home.

Form's in my bio.

#samedayreveal #southbendindiana #boudoirreveal #michianamoms #glamourphotography`
  },
  {
    n:"★", title:"Send six pictures, not four adjectives", format:"BTS Overlay \u00b7 Prep List \u00b7 text over you working", bts:true,
    cover:"covers/reel-5.jpg",
    screenTrial:`There are six photographs I make every client send me before her shoot, and two of them she'd never admit to her sister that she saved. The whole list is in the description.`,
    screenGrid:`Nine out of ten planning calls go sideways over one single word, and it's a word you think is being helpful. I put the rest in the caption.`,
    caption:`The word is "classy."

Along with "timeless," "elegant," and the big one — "nothing too much." On your 30-minute planning call those four words mean one thing in your head and something completely different in mine, and we find that out on the day, in the studio, with the wardrobe already hanging.

So stop sending me adjectives. Send me pictures. Six of them:

1. Two you love and would happily hand your best friend.
2. Two that scare you a little — too bold, too bare, not-me.
3. Two you'd never admit to your sister that you saved.

That's it. Thirty minutes on a video call with those six images in front of us is worth more than every adjective in the English language. Two you love tells me your taste. Two that scare you tells me your ceiling, and where to stop. Two you secretly saved tells me what you actually came here for.

That call is included the moment you book, and it's where the whole day gets built — sets, colors, wardrobe, props, all of it.

Screenshot the list. Bring it to your call.

#boudoirprep #whattowearboudoir #michiana #southbendboudoir #boudoirplanning`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
