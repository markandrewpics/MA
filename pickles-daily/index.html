<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Tuesday, July 28, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"You Sit In That Chair Anyway", format:"Studio Rule \u2014 Ep. 17", cover:"covers/face-1.jpg",
    script:`Even if you do your own makeup every single day, you still sit in my makeup chair.
Even if you ARE a makeup artist. Even if you are better at it than most people I know. You sit down anyway.
And women push back on that. They tell me they'll come camera-ready, they'll save me the time, they've got it handled.
Here's what they don't know yet.
It was never about the makeup.
It's ninety minutes where somebody is tending to you. Nobody is asking you for anything. Nobody needs a ride, a signature, a decision. Aletheia is working, you're in the chair, and for the first time in probably years the whole room is organized around one person, and that person is you.
That's not prep. That's where the shoot actually starts.
By the time you stand up, you're not a woman who's nervous about a camera anymore. You're already the point of the day.
That's why the chair isn't optional.
Studio rule.`,
    caption:`Every woman asks if she can just come camera-ready.

The answer is no, and it has nothing to do with your makeup skills.

Ninety minutes in that chair is ninety minutes where nobody needs anything from you. No one asking for a ride, a decision, a signature. Aletheia works, you sit, and the entire room is organized around one person for the first time in years.

You don't walk into my studio and start shooting. You walk in and start being the point of the day.

The camera part is easy after that.

Form's in my bio when you're ready.

#southbendboudoir #michianaphotographer #boudoirphotography #mishawakaindiana #boudoirexperience`
  },
  {
    n:"2", title:"AI Can't Generate Your Scar", format:"Unpopular Opinion", cover:"covers/face-2.jpg",
    script:`In 2026, the most radical image on the internet is an unretouched photograph of a real woman over forty.
Think about how strange that is. A machine can build you a flawless stranger in four seconds. Perfect skin, perfect symmetry, perfect light. Free. Infinite.
So flawless just stopped being worth anything.
Here's what a machine cannot do.
It cannot generate the scar. It cannot generate the crooked smile your husband fell for. It cannot generate the laugh your daughter can pick out of a crowded room with her back turned.
It can't make those, because those aren't design choices. Those are receipts. That's a life that actually happened to a specific person.
For twenty years we ran everything through a filter to look more like a machine's idea of a woman. And the machines caught up and passed us and now they can out-perfect us forever.
So the flex flipped.
Real is the luxury now.
And you already own the only thing that can't be generated.`,
    caption:`A machine can make a flawless woman in four seconds. It cannot make you.

It can't generate the scar. Or the crooked smile. Or the laugh your daughter can find in a crowded room without looking.

Those aren't features. They're receipts — proof a specific life actually happened to a specific person. And that's the one thing no model can produce, at any resolution, ever.

We spent twenty years filtering ourselves toward a machine's idea of a woman. The machines won that race. So the flex flipped.

Real is the luxury now, and you already own it.

Form's in my bio.

#realwomenrealbeauty #boudoirphotography #southbendindiana #michianaboudoir #unretouched`
  },
  {
    n:"3", title:"Stop Rehearsing Brave", format:"The Waiting List", cover:"covers/face-3.jpg",
    script:`You think you have to become a bolder version of yourself before you're allowed to do this.
It's backwards.
Every woman who books tells me the same plan. She's going to get more confident first. Lose the weight, get the hair right, feel more like herself — and THEN she'll be the kind of woman who does a shoot like this.
So she waits to feel brave. And bravery, it turns out, does not show up on a schedule.
Here's what I've actually watched happen eight hundred and fifty times.
The women who walk out with the images that stop them cold in the hallway are never the ones performing confidence for my camera. Performed confidence photographs like a costume. You can see the effort in it.
It's the ones who finally let the armor drop. The softness is what the lens loves. That's not a nice thing I'm saying to you — that is a technical fact about light and faces.
You don't need to get brave enough first.
You need to stop rehearsing brave.`,
    caption:`"I'll do it once I feel more confident."

I've heard it a few hundred times, and it's backwards.

The women who walk out with the images that stop them cold are never the ones performing confidence for the camera. Performed confidence photographs like a costume — you can see the effort in it.

It's the ones who let the armor drop. Softness is what a lens actually loves. That's not encouragement, that's a technical fact about light and faces.

Bravery doesn't arrive on a schedule. You don't need to get brave enough first. You need to stop rehearsing it.

The form's in my bio whenever you're done waiting on it.

#boudoirphotography #michianawomen #southbendboudoir #confidenceisachoice #grangerindiana`
  },
  {
    n:"4", title:"She Called Herself The Oldest", format:"Overheard in the Studio", cover:"covers/face-4.jpg",
    script:`She spent our entire consult calling herself the oldest woman I'd ever photographed.
She said it three separate times. Like a joke she needed to make first, before I could.
She was sixty-one.
And here's the part I couldn't say without it sounding like a line — she wasn't even the oldest woman I photographed that month.
She almost cancelled twice. Both times the reason was some version of "I should have done this twenty years ago."
Shoot day, she was fine. Nervous the normal amount. Aletheia did her hair, she got through her three sets, we broke for lunch.
Then the reveal.
A hundred and forty images come up on that screen and she goes completely quiet. Not crying. Just quiet, for a long time.
And then she said the thing I've thought about every week since.
"I'm going to be ninety someday. And I'll be so glad I was sixty-one when I did this."
She wasn't too late.
She was just the earliest she'll ever be again.`,
    caption:`She called herself "the oldest woman you've ever photographed" three times in one consult. She was 61. She wasn't even the oldest woman I photographed that month.

She almost cancelled twice, both times for the same reason: "I should have done this twenty years ago."

At her reveal, 140 images came up on the screen and she went completely quiet. Then she said the line I've thought about every week since:

"I'm going to be ninety someday. And I'll be so glad I was sixty-one when I did this."

She wasn't too late. She was just the earliest she'll ever be again.

That's true for you today, too.

#boudoirover50 #southbendphotographer #michianaboudoir #ageisjustanumber #boudoirphotography`
  },
  {
    n:"5", title:"The Safest Thing You Packed", format:"Prep List (BTS overlay)", cover:"covers/reel-5.jpg", bts:true,
    screenTrial:`There's one fabric almost every woman packs first — and it's the hardest thing in the room to photograph. The full list is in the description.`,
    screenGrid:`I can tell you the exact fabric sitting on top of your suitcase right now. I put the whole list — and what to bring instead — in the caption.`,
    caption:`It's satin.

Almost every woman packs the smooth satin slip first, because it feels like the safe choice. It's the hardest thing in the room to photograph. Satin grabs every highlight and shows every single wrinkle — including the ones that happened in your bag on the drive over from Mishawaka.

Texture is what loves light.

Bring these instead:
— Lace, anything with real pattern in it
— Velvet, especially in a jewel tone
— Structured pieces: corsets, underwire, anything boned
— One thing with straps, buckles or detail that catches an edge of light
— Something you already own that fits you today

Screenshot that list. It's the difference between a photo that reads flat and one that reads expensive — and it costs you nothing.

#boudoirprep #whattowearboudoir #southbendboudoir #michianaphotographer #boudoirtips`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body></html>
