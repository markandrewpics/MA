<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Sunday, August 2, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": 1,
    "title": "The Christmas Math",
    "cover": "covers/face-1.jpg",
    "format": "Prep List",
    "script": "If you want these in your hands by Christmas, the deadline isn't December. It's the last week of October, and here's the math.\nEverywhere else, your clock starts two to four weeks after you shoot. That's editing time, and you pay for it in calendar days.\nHere it starts the same afternoon. You shoot in the morning, you eat lunch, and by one o'clock you're choosing.\nSo the only clock left is production. My albums are handmade in Portugal — six to eight weeks. Wall art and prints, three to four. Digitals you walk out with that day.\nNow count backwards from the twenty-fifth. Album: book by the last week of October. Wall art: book by the middle of November. Digitals only: you could book in December and still make it.\nMost women read that and think they have plenty of time. Most women read it in August and book in November.\nPick your date before the print lab picks it for you.",
    "caption": "Christmas is not the deadline. Production is.\n\nEverywhere else you shoot, then wait two to four weeks for editing, and only then does anything get ordered. Here you see 130–160 finished images the same afternoon, so ordering starts on day one.\n\nThat leaves only the makers. Handcrafted albums come from Portugal — six to eight weeks. Wall art and prints, three to four. Digitals you leave with that day.\n\nCount back from the 25th:\n· Album → book by the last week of October\n· Wall art or prints → book by mid-November\n· Digitals only → December still works\n\nIf you've been telling yourself you'll do it \"sometime this year,\" this is the sometime. The booking form is in my bio — grab your date while October is still a choice.\n\n#boudoirphotography #southbendindiana #michianaboudoir #luxuryboudoir #grangerindiana"
  },
  {
    "n": 2,
    "title": "You See Every Single Image",
    "cover": "covers/face-2.jpg",
    "format": "Studio Rule — Ep. 20",
    "script": "You see every single image I take of you. Not a curated twenty, not \"my favourites\" — all of them.\nOne hundred and thirty to one hundred and sixty finished photographs, on a sixty-five-inch screen, the same afternoon you shot them. Studio rule.\nHere's why that matters more than it sounds. Every other studio in this business disappears for two to four weeks and comes back with a selection. Somebody you met once decided which version of you was good enough for you to see.\nI don't get that job. I don't want that job.\nBecause the photo I would have cut is almost always the one you stop on. It's rarely the most flattering one. It's the one where you look like the person your kids would recognise from across a room.\nYou have had enough people editing you down to their favourite parts.\nNot here. You get all of it, and you get to be the one who decides.",
    "caption": "A curated gallery is a decision somebody else made about your face.\n\nTwo to four weeks after your session, most studios hand you a selection. Someone who met you once went through your images and chose which ones you were allowed to see. That's normal in this industry. It has never once sat right with me.\n\nSo here's the rule: you see everything. 130 to 160 finished photographs on a 65-inch screen, the same afternoon you shot them. No pre-approval, no gatekeeping, no \"trust me, that one wasn't working.\"\n\nThe picture I'd have cut is almost always the one she stops on. Not the most flattering — the most *her*. I'm not qualified to make that call, and neither is anyone else.\n\nOne woman a day, all the images, your decision. Booking form's in my bio.\n\n#boudoirphotographer #southbendphotographer #indianaboudoir #samedayreveal #mishawakaindiana"
  },
  {
    "n": 3,
    "title": "The Invented Occasion",
    "cover": "covers/face-3.jpg",
    "format": "Unpopular Opinion",
    "script": "Unpopular opinion: the photography industry sells you occasions because a milestone is easier to sell than a Tuesday.\nBridal. Anniversary. Post-divorce. Turning fifty. Down forty pounds. I've photographed every one of those, and I'll tell you the thing the marketing never does.\nThe women who walk out of here most changed are almost never the ones who came in with a reason.\nThey're the ones who got tired of waiting for a reason to show up.\nBecause the occasion isn't what makes it work. The occasion is a permission slip you wrote yourself so the day wouldn't feel selfish. And if you're waiting on the wedding, the birthday, the divorce, the goal weight — you're not waiting on a milestone. You're waiting for something external to sign off on you.\nEight hundred and fifty women through this studio. The best days in here were ordinary Tuesdays.\nYou don't need an occasion. You need a date.",
    "caption": "You don't need an occasion. You need a date.\n\nThe industry sells milestones because a milestone is easier to sell than a Tuesday. Bridal, anniversary, post-divorce, turning fifty, down forty pounds. I've photographed all of them and they're all real — but they aren't the reason it works.\n\nThe women who leave here most changed are almost never the ones who arrived with a reason. They're the ones who got tired of waiting for one.\n\nBecause the occasion is really a permission slip you wrote yourself so the day wouldn't feel selfish. If you're waiting on the wedding or the goal weight, you're not waiting on a milestone — you're waiting for something outside you to sign off.\n\n850 sessions in, and the best days in this studio were ordinary Tuesdays.\n\nPick one. Form's in my bio.\n\n#boudoirphotography #michianaboudoir #southbendindiana #boudoirphotographer #elkhartindiana"
  },
  {
    "n": 4,
    "title": "Send It To Her",
    "cover": "covers/face-4.jpg",
    "format": "The Waiting List",
    "script": "This one isn't for you. Send it to her.\nYou already know which friend. She's the one who takes every photo — every birthday, every graduation, every first day of school — and she is in none of them. Twelve years of your family's memories and she's behind the camera in all of them.\nHere's what won't work: telling her she's beautiful. She has heard that from you a hundred times and she filed it under nice things my friend says.\nWhat actually moves her is smaller than that. Somebody has to tell her she's allowed to be the subject. Not the one holding the camera. Not the one making sure everyone else is fed and dressed and in the frame. The subject.\nShe is not going to give herself that. She isn't built that way.\nThat's the sentence, and you're the one who has to say it.\nSo don't just watch this. Send it.",
    "caption": "This one isn't for you. Send it to her.\n\nShe's the one who takes every photo. Birthdays, graduations, first days of school. Twelve years of your family's history and she's behind the camera in all of it.\n\nTelling her she's beautiful won't do it. She's heard that from you a hundred times and filed it under nice things my friend says.\n\nWhat moves her is smaller: somebody telling her she's allowed to be the subject. Not the one holding the camera, not the one making sure everyone else is fed and dressed and in frame. The subject.\n\nShe won't hand herself that. She isn't built that way — which is exactly why it has to come from you.\n\nSend it. That's all this post is asking. If she wants to know what a day here looks like, the form's in my bio and I'll take it from there.\n\n#boudoirphotography #southbendphotographer #michianaboudoir #indianaboudoir #grangerindiana"
  },
  {
    "n": 5,
    "title": "She Said She Wasn't a Print Person",
    "cover": "covers/reel-5.jpg",
    "format": "Overheard in the Studio (BTS overlay)",
    "bts": true,
    "screenTrial": "She told me at her consultation that she didn't want anything printed. Not a wall-art person, she said. Then she picked something up in this room and did not put it down for the rest of the appointment. What she said when she finally did is in the description.",
    "screenGrid": "One sentence was said in this room that I have thought about nearly every week since, and it was not about a photograph. I put the whole thing in the caption.",
    "caption": "At her consultation she told me she only wanted the digital files. \"I'm not really a wall-art person.\" I hear it often enough that I stopped arguing with it years ago.\n\nShe came back for her reveal. While I was setting up she picked up one of the sample albums off the table — just to look — and she didn't put it down. Not through the coffee. Not through the first set. She held it for the better part of an hour with her thumb in the same page.\n\nWhen she finally set it down she said, almost as an apology: \"There's nothing else in my house that's mine.\"\n\nThat's it. That's the whole reason people print things. Not decor, not vanity. Everything in that house had somebody else's name on it — the kids' schedules on the fridge, her husband's shows on the TV, the good chair nobody sits in. She wanted one object in one thousand square feet that was hers.\n\nShe took the album. It lives in her nightstand.\n\nIf the file-versus-print thing is the piece you keep going back and forth on — this is the answer. You're not buying a picture. You're buying the one thing in that house with your name on it. Form's in my bio.\n\n#boudoirphotography #luxuryboudoir #southbendindiana #michianaboudoir #mishawakaindiana"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body></html>
