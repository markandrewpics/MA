<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Friday, August 28, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Leave That Friend At Home", cover:"covers/face-1.jpg", format:"Studio Rule \u00b7 Ep. 37",
    script:`If the friend you're bringing has even a small problem with this, she doesn't come. Studio rule, episode thirty-seven.
You're allowed a support person. She can sit through hair and makeup, hold your coffee, talk you down at nine in the morning. Once I start shooting, anyone who isn't being photographed leaves — that part everybody already knows.
It's the part before it that costs women the day. I've watched someone get quieter and quieter in the makeup chair because the person she brought kept making little jokes. Not cruel ones. Small ones. That is all it takes. She spends the rest of the day performing for the one person in the room she's trying to prove something to, and I can see it in every single frame.
Bring the friend who's been telling you to do this for two years. Not the one who says good for you with her eyebrows up.
This room only holds people who are already on your side.`,
    caption:`Studio rule 37: the person you bring has to be all the way on your side.

You get a support person. She's welcome through hair and makeup — that's a good ninety minutes and nobody should sit in it alone. Once we start shooting, anyone who isn't being photographed steps out. That rule is old news.

The one nobody expects is the one before it. If there's even a small inkling she doesn't agree with you doing this, leave her at home. It never shows up as an argument. It shows up as a joke in the makeup chair, and then a woman who spends the whole day photographing herself through somebody else's face.

I'd rather you came alone than came with her.

Am I being too hard on that? Tell me — I'll argue it either way. If you're ready, the form's in my bio.

#boudoirphotography #southbendphotographer #michianaboudoir #boudoirsouthbend #mishawakaphotographer`
  },
  {
    n:"2", title:"Wash It Tonight, Not Tomorrow", cover:"covers/face-2.jpg", format:"The Prep List",
    script:`Do not wash your hair the morning of your shoot. If your hair runs oily, wash it the night before, blow it dry before bed, and arrive dry.
That's the whole instruction, and nobody believes it until they've done it once. Freshly washed hair is slippery. It won't hold a curl, it won't hold a pin, and your artist burns forty minutes fighting it instead of building the thing you actually asked for. Day-old hair has grip. It sets in half the time and it still looks right at three in the afternoon, three outfits later, which is the only moment that really matters.
Same rule for your face. Come in with nothing on it. No primer, no tinted moisturiser, no just-a-little-something because you didn't want to be seen without it. She's working on your skin, not on this morning's leftovers.
Show up boring. You'll leave looking like the best version of yourself.`,
    caption:`Wash your hair the night before. Not the morning of.

Blow it dry before bed and arrive dry. If that feels wrong, it's because every other appointment in your life rewards you for showing up freshly washed and this one doesn't.

Clean hair is slippery. It drops a curl, it spits out a pin, and your artist spends forty minutes fighting physics instead of building the look you asked for. Day-old hair holds. It sets faster and it's still holding at three in the afternoon on your third outfit — which is the only test that counts.

Face: nothing on it. No primer, no tinted moisturiser, no small something. She's building on skin.

Show up boring. That's the entire prep.

What's the one piece of advice you've been given about getting your hair done that you've never actually believed? The form's in my bio if you want the rest of the list.

#boudoirprep #southbendphotographer #michianaboudoir #boudoirphotography #elkhartindiana`
  },
  {
    n:"3", title:"Ninety Minutes Buys You Nothing", cover:"covers/face-3.jpg", format:"Unpopular Opinion",
    script:`Unpopular opinion — the ninety-minute mini session is why half the women I meet think they're not photogenic. I don't offer them and I'm not going to.
Here's what actually happens in ninety minutes. You walk in cold, you get twenty minutes in a chair, and you're in front of a camera before your shoulders have come down from your ears. Nobody looks like themselves in the first hour. Nobody. That's roughly how long it takes to stop watching yourself from the outside.
The photographs I take at nine forty in the morning and the ones I take at one in the afternoon are of the same woman, and only one of them is actually her.
So you get the whole day. Arrive at nine, done before four, one client on my calendar and nobody after you. It costs more and it takes more of your time.
A mini session doesn't buy you photographs. It buys you proof that you were nervous.`,
    caption:`Unpopular opinion: the mini session is why so many women are convinced they're not photogenic.

Ninety minutes goes like this. You arrive cold. Twenty minutes in a chair. Then a camera, while your shoulders are still up around your ears. Nobody — nobody — looks like themselves in the first hour. It takes about that long to stop watching yourself from the outside.

I've got frames of the same woman at 9:40am and at 1pm and only one of them is her.

So I don't sell minis. You get the day: arrive at nine, out before four, one client on the calendar and nobody booked after you. It costs more and it takes more of your time and I'd make more money the other way.

A mini doesn't get you photographs. It gets you proof you were nervous.

Tell me I'm wrong — has a short session ever given you a picture you actually kept?

#boudoirphotography #southbendphotographer #michianaboudoir #luxuryboudoir #nilesmichigan`
  },
  {
    n:"4", title:"The Tags Are Still On It", cover:"covers/face-4.jpg", format:"The Waiting List",
    script:`There is something in your drawer right now with the tags still on it. You bought it for an occasion. The occasion never came, because occasions don't send invitations — somebody has to decide one is happening.
So it sits there folded in tissue paper getting a year older every year, and you tell yourself you're saving it.
You're not saving it. You're waiting to become the kind of woman who'd wear it, and she was never going to arrive from the outside. She gets decided on. On an ordinary Tuesday. By you.
Women bring those things here. They put on something they've owned for four years and never worn, at ten in the morning on a weekday, and stand in front of my camera in it. Not one of them has ever told me she wished she'd waited longer.
Cut the tags off. Or bring it here with the tags still on, and let me be the occasion.`,
    caption:`There's something in your drawer with the tags still on it.

You bought it for an occasion. The occasion never came — because occasions don't send invitations. Somebody decides one is happening. That's the whole mechanism, and it's why the thing is still folded in tissue paper getting a year older every year.

You're not saving it. You're waiting to become the woman who'd wear it, and she doesn't arrive from the outside. She gets decided on, usually on a completely ordinary weekday.

Women bring those things to me. Owned four years, never worn, on at ten in the morning on a Tuesday. Not one has ever told me she wished she'd waited longer.

So: what's in your drawer, and what year did you buy it? I'll go first — mine's a jacket, 2019.

Form's in my bio if you want the Tuesday.

#boudoirphotography #southbendphotographer #michianaboudoir #womenover40 #grangerindiana`
  },
  {
    n:"★", title:"I'll Be Your Worst Client", cover:"covers/reel-5.jpg", format:"Overheard In The Studio \u00b7 BTS overlay", bts:true,
    screenTrial:`Almost every woman says the same sentence to me before her shoot, and every one of them is wrong about it. It's in the description.`,
    screenGrid:`The sentence I hear most in this studio isn't about posing. It's a warning — and I put the rest in the caption.`,
    caption:`The sentence is: “I'm going to be your worst client.”

I hear it on planning calls. I hear it in the makeup chair. I've heard it in a parking lot before someone had made it through the door. It's always delivered like a warning, and it's always delivered by a woman who's convinced everybody else walks in already knowing how to do this.

Nobody walks in knowing how to do this. Most of my clients have never been photographed by a professional in their life. That's the normal condition, not the exception, and it's exactly what the direction is for — where to look, where your hands go, where your weight sits, what your face is doing. Head to toe, all day.

You're not being asked to perform. You play Simon Says for a couple of hours and then find out what you look like when you weren't trying.

And the women who say it are usually the ones who sit longest at the reveal.

So what would you warn me about before you booked? Say it here — I'll tell you honestly whether it matters.

#boudoirphotography #southbendphotographer #michianaboudoir #boudoirsouthbend #elkhartindiana`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
