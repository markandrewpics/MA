<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Saturday, August 29, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Nothing Is In The Cloud", format:"Studio Rule · Ep. 38", cover:"covers/face-1.jpg",
    script:`Your photographs never touch the internet. Studio rule, and it's the one nobody thinks to ask about.
Everything I shoot of you lives on hard drives in my building. Not Google, not Dropbox, not some gallery company's server in a state neither of us has ever been to. Your own gallery is encrypted and password protected, and the link, the password and the download code go to exactly one person. You.
Here's why I'm strict about it. The standard in this industry is to upload a woman's most private pictures to whatever storage is cheapest that year, and then that company gets bought, or breached, or quietly rewrites its terms, and she finds out from a news story. That is not a risk I get to take on your behalf. It's your body. It isn't my convenience.
And anything you don't buy on the day is deleted that afternoon. Not archived somewhere. Deleted.
The internet never gets a copy of you. Only you do.`,
    caption:`Nobody asks me where their pictures are stored. They ask about lighting, about posing, about what to wear — and in hundreds of sessions not one woman has ever asked me which server her most private images sit on.

Mine sit on hard drives in my own building. Your gallery is encrypted and password protected, and the link, the password and the download code go to you and nobody else. Anything you don't buy on the day is deleted that afternoon.

I think our whole industry has this backwards. We all advertise our lighting and none of us advertise where your file sleeps at night. Am I wrong to treat that as a rule instead of a selling point?

#boudoirphotography #southbendphotographer #michianaphotographer #boudoirsouthbend #mishawakaindiana`
  },
  {
    n:"2", title:"Never Buy A Photo Sight Unseen", format:"Unpopular Opinion", cover:"covers/face-2.jpg",
    script:`Unpopular opinion: you should never pay a photographer for pictures you haven't seen yet.
Most of this industry sells you a package before the shutter has fired once. You pick a tier off a PDF — twenty images, forty images — and you are buying a number, sight unseen, from somebody whose work you have only ever seen at its absolute best.
I don't do it that way. You book the date and that is the end of the money conversation. You come in, we shoot three sets, you eat lunch while I edit, and then you sit down in front of a sixty-five inch screen with a hundred and forty finished photographs of yourself on it. Only then do you choose.
Some women take two. Some take all of them. Both are correct, because both are decisions made with the evidence sitting right there in front of her.
Paying first is comfortable for the photographer. It should never be comfortable for you.`,
    caption:`You book a photographer, you pay for a package, and then weeks later you find out what you actually bought. That is the normal way to do this and I think it's indefensible.

Here, the only thing you commit to is the date. We shoot, I edit over lunch, and that same afternoon you sit down with around a hundred and forty finished images of yourself on a sixty-five inch screen and choose from what actually exists — not from a tier on a price sheet.

Some women take two images. Some take the lot. Both are right, because both are choices made with the evidence in front of them.

Tell me why paying up front is better for her rather than better for him. I genuinely want to hear the argument.

#boudoirphotography #southbendphotographer #boudoirmichiana #glamourphotography #elkhartindiana`
  },
  {
    n:"3", title:"You Can Delete That One", format:"Overheard in the Studio", cover:"covers/face-3.jpg",
    script:`“You can delete that one.” She always says it about the photograph I would have picked.
It happens at the reveal, four hours after she got here, with about a hundred and forty pictures of her going by on the screen. She's fine — enjoying herself, even — and then one comes up and she goes quiet and says, delete that one.
It is almost never an unflattering photograph. I've been doing this long enough to know the pattern. The ones she wants gone are the ones where she wasn't performing. No chin trick, no practised angle, no bracing for the shutter. Just her face doing something honest for a twentieth of a second.
Those are the ones her husband stops on. Those are the ones her sister cries at.
So no. I don't pull it. I leave it up on the screen, I say nothing for a minute, and about nine times out of ten it's the one she buys.`,
    caption:`Four hours in, a hundred and forty pictures of herself going by on the screen, and she stops on one and says “delete that one.”

It is almost never the unflattering one. It's the frame where she forgot to hold the pose — no chin trick, no practised angle, just her face being honest for a twentieth of a second. That is exactly why it makes her flinch, and exactly why it's the one her husband stops on and her sister cries at.

So I don't pull it. I leave it on the screen and say nothing, and nine times out of ten it's the one she buys.

Be honest with me: is there a photo of you that everyone else loves and you'd delete tomorrow if you could?

#boudoirphotography #southbendphotographer #boudoirsouthbend #michianaphotographer #grangerindiana`
  },
  {
    n:"4", title:"A Photograph Of Your Mother", format:"The Waiting List", cover:"covers/face-4.jpg",
    script:`There is no good photograph of your mother at the age you are right now.
Go and look tonight. There's a wedding picture. There's one of her holding you as a baby. And then there is a forty-year gap where she is half-turned away from a camera at somebody's birthday, holding a paper plate, saying not now.
She was the one taking the pictures. She was the one who said she'd do something about it next year, after the holidays, once a few things settled down.
So you don't have a single frame of her looking the way she actually looked at thirty-eight. Not because she wasn't beautiful. Because nobody ever sat her down and made it happen, and that includes her.
Your daughter is going to go looking for you one day. Same drawer. Same gap.
That's the whole reason. Not confidence, not lingerie, not waiting for a good week.
Proof that you were here, and that you looked like this.`,
    caption:`Go and look tonight. Find a photograph of your mother at the exact age you are right now — not her wedding, not her holding you as a baby. Her, at thirty-eight, looking the way she actually looked.

Most women can't find one. She was the one holding the camera. She was the one who said next year, after the holidays, once things settled down. So there's a forty-year gap where she's half-turned away at somebody's birthday holding a paper plate.

Your daughter is going to go looking for you one day, in the same drawer.

Go and look, then tell me what year the last good photograph of your mom is from. I want to know whether I'm wrong about this.

#boudoirphotography #southbendphotographer #womenover40 #boudoirmichiana #mishawakaindiana`
  },
  {
    n:"★", title:"Tan Lines Are Forever", format:"BTS Overlay · The Prep List", cover:"covers/reel-5.jpg", bts:true,
    screenTrial:`There's one thing you can do this weekend that I can't undo on Monday. It's all in the description.`,
    screenGrid:`Every woman who books September walks in apologising for the same thing. I put the rest in the caption.`,
    caption:`It's your tan lines.

One Labor Day afternoon on a boat, one lake day nobody thought about, and then you're standing in front of my camera with two white straps across your shoulders and a line across your back — in every frame, on every set, all day long.

I can retouch a great deal. Skin texture, a bruise, a stray hair, even a little warmth added back into your colour. What I cannot do quickly is rebuild the tone across a whole shoulder in a hundred and forty images. It's the same reason I ask for no spray tan and no new tattoo in the weeks before you come: anything that changes the surface of your skin ends up in the file permanently.

So for the next few weeks — sunscreen, shade, and save the lake for the day after your reveal.

What's the prep rule you'd never have guessed actually mattered? I'll tell you the one that surprises people most.

#boudoirphotography #southbendphotographer #michianaphotographer #boudoirsouthbend #nilesmichigan`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
