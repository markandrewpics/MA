<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Wednesday, September 3, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"This One Doesn't Have A Job", format:"The Waiting List", cover:"covers/face-1.jpg",
    script:`Everything you have bought this year had a job. This is the first thing that doesn't.
Look at the last ten things you spent real money on. School shoes. Tires. Somebody's braces. The dishwasher that finally died in February. Every one of them was useful, and not one of them was for you.
This is for nothing. It feeds nobody. It fixes nothing. It helps exactly one person in your entire house, and that is the thing you have not allowed yourself in about fifteen years.
I know what happens next, because it happens on every call. You do the arithmetic out loud and you land on "that's a lot for photos." It is a real number. There are payment plans, and I will walk you through them without flinching.
But you already own free photographs of yourself. Taken badly, in bad light, by somebody who wasn't looking. You have hundreds of those.
This is the other kind.`,
    caption:`Every single thing you bought this year had a job to do. School shoes. Tires. Braces. The dishwasher that died in February.

This one doesn't. It feeds nobody, fixes nothing, and helps exactly one person in the house — which is precisely why it has been sitting at the bottom of your list for fifteen years.

Yes, it's a real number. Yes, there are payment plans, and I'll walk you through them without flinching. And yes, you already own free photographs of yourself — taken badly, in bad light, by somebody who wasn't looking.

When was the last time you bought something that had no job except being yours?

#southbendboudoir #michianaphotographer #boudoirphotography #womenover40 #grangerindiana`
  },
  {
    n:"2", title:"I Won't Retouch You Into Somebody Else", format:"The Unpopular Opinion", cover:"covers/face-2.jpg",
    script:`Unpopular opinion: airbrushing a woman into a different woman is not editing. It is lying, and it is most of the reason you don't trust photographs of yourself.
Here is exactly what I take out. A light stand that crept into the corner of the frame. A stray hair across your mouth. I will extend a backdrop if the set ran out before the picture did.
Here is what I do not touch. The lines around your eyes. The scar. The stretch marks. The softness of your stomach that you have already apologized for twice today.
And if you ask me to — women do ask, quietly, usually at the reveal — I will tell you exactly what I am telling you now. The version of you that gets erased is the version your daughter would recognize.
An unrecognizable photograph is not a compliment. It is a stranger wearing your jewelry.`,
    caption:`Unpopular opinion: airbrushing a woman into a different woman isn't editing. It's lying.

I'll take out a light stand and a stray hair. I'll extend a backdrop. I will not take out the lines around your eyes, the scar, the stretch marks, or the stomach you've already apologized for twice today.

Half this industry sells the erasing as the service, and that's a large part of why women flinch at pictures of themselves — not because of how they look, but because they've been taught the photograph is supposed to be somebody else.

The version of you that gets edited out is the version your daughter would recognize. I'd rather hand you a photograph you can be recognized in than one you can be complimented on.

#boudoirphotographer #southbendindiana #unretouched #michianaboudoir #glamourphotography`
  },
  {
    n:"3", title:"The One Rule I Bend \u2014 Studio Rules Ep. 43", format:"The Studio Rule \u00b7 Ep. 43", cover:"covers/face-3.jpg",
    script:`If you wake up sick on your session day, call me. That is the one rule I bend, and it is the only one.
Studio rules, episode forty-three. I am rigid about nearly all of this. Move your date inside thirty days and the retainer is gone. Don't show up and it's gone. I do not negotiate either of those, and every woman who books with me knows it before she pays a dollar.
But genuinely ill — actually sick, not nervous — you call me. If we can get you back on the calendar inside a couple of weeks, we move it. No argument, no lecture, no fee.
Not because the policy is soft. Because a woman who drags herself in on antibiotics to protect five hundred dollars gets photographs of a woman who feels terrible, and there is no light in this building that fixes that.
The rules exist to protect the day. So does this one.`,
    caption:`Studio Rules, Episode 43: if you wake up sick, call me.

I'm rigid about almost everything else. Move your date inside thirty days and the retainer is gone. No-show and it's gone. Nobody who books with me finds that out late — it's said out loud, on a call, before any money changes hands.

This is the one place I bend. Genuinely ill, and if we can get you back on the calendar within a couple of weeks, we move it. No argument, no fee.

It isn't softness. A woman who drags herself in on antibiotics to protect a retainer gets photographs of a woman who feels terrible, and there's no light in South Bend that fixes that.

Which rule would you want your photographer to hold — and which would you want them to bend?

#studiorules #boudoirphotography #southbendphotographer #michiana #mishawakaindiana`
  },
  {
    n:"4", title:"Don't Buy Jewelry For This", format:"The Prep List", cover:"covers/face-4.jpg",
    script:`Don't go out and buy jewelry for your session. I already own more of it than you could wear in a day.
There is a wall of it here, and every piece on it was chosen for exactly one thing: how it reads on camera. Most of what photographs well is far bigger than anything you would wear to dinner in Granger. A lens shrinks scale. The necklace that feels theatrical in your hand looks like nothing at all on the screen.
So save the money. What I actually want you to bring is the piece that means something.
Your grandmother's ring. The necklace he gave you the year everything was hard. The thing that has sat in the box for a decade because it felt like too much for a Tuesday.
That is the frame you end up hanging on a wall. And it is the only thing in this room I cannot provide.`,
    caption:`Don't buy jewelry for your session. I have a wall of it.

Statement pieces, all chosen for one reason — how they read on camera. Nearly everything that photographs well is bigger than what you'd wear to dinner in Granger, because a lens shrinks scale. The piece that feels theatrical in your hand looks like nothing on screen.

Bring the one that means something instead. Your grandmother's ring. The necklace from the year everything was hard. The thing that's been in the box for ten years because it felt like too much for a Tuesday.

That's the frame that ends up on a wall. And it's the only thing in this studio I can't provide for you.

What's the one piece you own that you never wear and would never sell?

#boudoirprep #southbendboudoir #michianaphotographer #whattobring #boudoirphotography`
  },
  {
    n:"5", title:"\u201cDon't Make Me Look Sexy.\u201d", format:"Overheard in the Studio \u00b7 BTS overlay", cover:"covers/reel-5.jpg", bts:true,
    screenTrial:`There's a sentence almost every woman says to me in her first ten minutes — and it's the one request I genuinely can't honor. The reason is in the description.`,
    screenGrid:`She apologized before she asked me for it, and I still had to tell her no. The whole thing's in the caption.`,
    caption:`“Don't make me look sexy.”

She says it in the first ten minutes, almost apologizing, like she's asking me to switch something off. And I know exactly what she means — don't make me look like a photograph I've scrolled past and cringed at.

It's the one request I can't honor, because it isn't a setting on my camera. It's what happens to a woman's face around the second set, when she's stopped checking the back of the screen and started standing like she owns the room.

That isn't sexy. That's her, uninterrupted. And everybody who sees the picture reads it exactly the way she does — which is the part nobody warns you about.

So what do you actually want a photograph of yourself to say?

#overheardinthestudio #boudoirphotography #southbendindiana #michianaboudoir #confidence`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
