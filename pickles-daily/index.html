<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Monday, August 4, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": 1,
    "title": "You get the first opinion",
    "cover": "covers/face-1.jpg",
    "format": "Studio Rule — Ep. 21",
    "script": "Your phone stays face down in my reveal room. Studio rule twenty-one.\nNot because your friends have bad taste. Because of what happens to you the second you send that first screenshot.\nHere’s what I’ve watched happen. She’s sitting in front of a sixty-five-inch screen looking at a hundred and thirty finished images of herself, and she finds one — the one that stops her. Then she photographs the screen, sends it to the group chat, and waits.\nAnd right there, she stopped choosing and started polling.\nThree friends send a heart, one sends the other one, and the picture they land on is almost never the picture she stopped on. Theirs is the one that photographs best. Hers is the one that felt like her. Those are two different photographs and only one of them is you.\nSo the phone stays down until you’ve told me which images are yours.\nYou get to have an opinion about yourself before anybody else gets a vote. Then text whoever you want. I’ll hold the door.",
    "caption": "Studio rule twenty-one, and it’s the one people push back on hardest.\n\nYour phone stays face down in the reveal room until you’ve told me which images are yours.\n\nNot because your friends have bad taste — because of what the group chat does to you. The second that first screenshot goes out, you stop choosing and start polling. And the photo four people vote for is almost never the photo you stopped on. Theirs is the one that photographs best. Yours is the one that felt like you.\n\nYou get one afternoon in your whole life where you look at a hundred and thirty pictures of yourself and get to have the first opinion. I’m not letting anybody take that off you.\n\nThen text whoever you want. I’ll hold the door.\n\nThe studio is in South Bend — the booking form is in my bio when you’re ready.\n\n#boudoirphotography #southbendphotographer #michianaphotographer #boudoirphotographer #indianaboudoir"
  },
  {
    "n": 2,
    "title": "The cloud is not an album",
    "cover": "covers/face-2.jpg",
    "format": "Unpopular Opinion",
    "script": "Unpopular opinion: a digital file is not a photograph.\nYour grandmother’s photograph survived three house moves, a basement flood and forty years in a shoebox. Your twenty-eighteen phone did not survive a parking lot.\nWe are raising the most photographed generation in human history with the least to show for it. Thousands of images. Not one you can hold.\nAnd I can tell you exactly how it goes, because I hear it every year. The gallery link expired. The laptop died. The cloud account belongs to an email address you stopped using in twenty-nineteen.\nNobody loses a photograph on purpose. They just never move it out of the phone — and then the phone is gone.\nAn album on a nightstand doesn’t need a password.\nSo print something. A four-by-six on a fridge counts. Print your kids, print your parents, print the one of you that you almost deleted.\nEven if it’s not mine. Especially if it’s not mine.",
    "caption": "Unpopular opinion: a digital file is not a photograph.\n\nYour grandmother’s photograph survived three house moves, a basement flood and forty years in a shoebox. Your 2018 phone did not survive a parking lot.\n\nWe are raising the most photographed generation in history with the least to show for it. Thousands of images. Not one you can hold.\n\nAnd nobody loses them on purpose. The gallery link expires. The laptop dies. The cloud account belongs to an email address you stopped using in 2019. An album on a nightstand doesn’t need a password.\n\nSo print something this month. A 4x6 on the fridge counts. Print your kids, print your parents, print the one of yourself you almost deleted.\n\nEven if it’s not mine. Especially if it’s not mine.\n\n#boudoirphotographer #southbendboudoir #michianaphotographer #glamourphotography #indianaphotographer"
  },
  {
    "n": 3,
    "title": "Nobody says this out loud",
    "cover": "covers/face-3.jpg",
    "format": "The Waiting List",
    "script": "It isn’t going back.\nThat’s the sentence nobody in my industry will say out loud, so I’ll say it. You’re waiting for your body to go back to a shape it had in two thousand and nine. It isn’t going back. Mine isn’t either.\nSo here’s what’s actually on the table. Not a before and after. A decision about what this version of you gets remembered as — while it’s still this version.\nAnd you already know how this ends, because you’ve done it before.\nYou’ve pulled up a photo from four years ago and thought, I looked good. I had no idea. On the day that photo was taken you were certain you were too much, or not enough, and you were wrong. You have now been wrong about this same thing for twenty years.\nThat’s not a coincidence. That’s a pattern.\nThe only way to break it is to stop waiting for the woman in the photograph to arrive. She’s the one reading this.",
    "caption": "It isn’t going back.\n\nThat’s the sentence nobody in my industry will say out loud, so I’ll say it. Your body is not returning to the shape it had in 2009. Mine isn’t either.\n\nWhat’s actually on the table isn’t a before and after. It’s a decision about what this version of you gets remembered as — while it’s still this version.\n\nAnd you already know how it ends. You’ve pulled up a photo from four years ago and thought, I looked good, I had no idea. On the day that photo was taken you were certain you were too much or not enough. You were wrong. You’ve been wrong about this same thing for twenty years.\n\nThat’s not a coincidence. That’s a pattern.\n\nStop waiting for the woman in the photograph to show up. She’s the one reading this.\n\nSouth Bend studio — the form’s in my bio, whenever you’re ready.\n\n#boudoirphotography #southbendboudoir #michianawomen #boudoirphotographer #mishawakaindiana"
  },
  {
    "n": 4,
    "title": "She said nothing for forty minutes",
    "cover": "covers/face-4.jpg",
    "format": "Overheard in the Studio (story)",
    "script": "She didn’t say one full sentence for the first forty minutes of her session.\nYes. No. That’s fine. That was the whole vocabulary. Hair and makeup came and went, we started shooting, and I got nothing back.\nForty minutes in, I put the camera down. Because at that point I’m not photographing anybody — I’m just making a stranger stand in the light.\nSo I asked her straight out if she wanted to stop. Go home, sort it out another day, no hard feelings and no charge.\nAnd she said: “No. I’m sorry. I’m just not used to being in a room where nobody needs anything from me.”\nForty minutes of silence, and it wasn’t nerves. It wasn’t regret. It was the first quiet she’d had in years and she was sitting in it on purpose.\nWe shot for two more hours after that and I could not get her to stop talking.\nSome women arrive shy and some women arrive tired. From behind a camera those look identical, and they are not the same thing at all.",
    "caption": "She didn’t say one full sentence for the first forty minutes of her session.\n\nYes. No. That’s fine. That was the whole vocabulary. Forty minutes in I put the camera down, because at that point I’m not photographing anybody — I’m just making a stranger stand in the light.\n\nSo I asked if she wanted to stop. Go home, another day, no hard feelings.\n\nAnd she said: “No. I’m sorry. I’m just not used to being in a room where nobody needs anything from me.”\n\nIt wasn’t nerves. It wasn’t regret. It was the first quiet she’d had in years and she was sitting in it on purpose. We shot for two more hours after that and I couldn’t get her to stop talking.\n\nSome women arrive shy. Some women arrive tired. From behind a camera those look identical, and they are not the same thing at all.\n\n#boudoirphotographer #southbendphotographer #michianaphotographer #boudoirphotography #grangerindiana"
  },
  {
    "n": 5,
    "title": "Where these actually live",
    "cover": "covers/reel-5.jpg",
    "format": "The Prep List (BTS overlay)",
    "bts": true,
    "screenTrial": "There’s one question almost every woman is too embarrassed to ask me, and it has nothing to do with her body. It’s about what happens to these once they’re in her house. Eight hundred and fifty women have answered it — and the most common answer is not the one you’d guess. The whole list is in the description.",
    "screenGrid": "Nobody tells you where you’re actually supposed to put these once you get them home. There are four places, and one of them is a room you probably didn’t think of. I put all four in the caption.",
    "caption": "Nobody tells you where you’re supposed to put these, so here’s what 850 women actually did.\n\n1. The album goes in the nightstand. That’s the most common answer by a mile — not a coffee table, not a shelf. Arm’s reach of the bed.\n\n2. The wall art goes in the walk-in closet, not the bedroom. That’s the room nobody guesses, and the reason is simple: the closet is the one room in the house that’s already only yours. Nobody’s asking you about it.\n\n3. The folio box goes in a drawer you open on bad days. Not on display. On purpose.\n\n4. Exactly one framed print goes somewhere you’ll catch it by accident — a hallway, a stairwell, the wall you pass at 6am. That one does more work than the other three combined.\n\nScreenshot that. It’s the question you were too embarrassed to ask, and it stops more women from booking than the price does.\n\n#boudoirphotography #southbendboudoir #michianaphotographer #boudoirphotographer #elkhartindiana"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body></html>
