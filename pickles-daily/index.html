<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Thursday, August 27, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Nobody Under Eighteen", cover:"covers/face-1.jpg", format:"Studio Rule · Ep. 36",
    script:`Nobody under eighteen comes into this building.
Not for the shoot. Not for the reveal. Not to sit quietly in the corner while you're in the makeup chair.
Women ask me all the time. She'll be no trouble. She'll just keep me company. She's seventeen, she's practically an adult.
The answer has been no every single time, and I have never once regretted it.
Here's why. The second there is somebody in that room you are a mother in front of, you stop being the woman we came here to photograph. You sit differently. You laugh at half volume. You start apologising with your shoulders for things you have no business apologising for.
For this one day, in this one building, you are nobody's mom. You're not somebody's wife either. You are the woman who existed before all of that — and she's still in there, and she is extremely photogenic.
It is the most loving rule I have.
Studio rule.`,
    caption:`Nobody under eighteen comes into my studio. Not for the shoot, not for the reveal, not to keep you company in the makeup chair. I've been asked a hundred times and the answer has never changed — because the second there's someone in the room you're a mother in front of, you stop being the woman we came here to photograph. One day a year where you're nobody's mom. That's the whole point. Booking form's in my bio.
Am I wrong for holding that line?

#southbendboudoir #michianaboudoir #boudoirphotographer #mishawakaindiana #boudoirsouthbend`
  },
  {
    n:"2", title:"The Worst Surprise Gift There Is", cover:"covers/face-2.jpg", format:"Unpopular Opinion",
    script:`Unpopular opinion, and it costs me money every December: a boudoir session is the worst surprise gift there is.
I don't sell gift cards. I've been asked for them a hundred times and the answer hasn't moved.
Think about what the surprise actually does to her. You hand her an envelope, usually in front of people, and now she has to decide right there, with an audience, whether she is grateful or terrified.
She'll say grateful. She'll mean terrified.
If you want to give her this, get on the phone call with me first — the same free call she'd have had anyway. Then she picks her date. Her outfits. How far she wants to take it. Whether her hair is up or down at four in the afternoon.
A surprise removes the one thing that makes this work, which is that the decision was hers.
Gift her the decision. Not the ambush.`,
    caption:`I don't sell gift cards and I'm not going to. A boudoir session is the worst surprise gift there is — hand her an envelope in front of people and she has to decide, with an audience watching, whether she's grateful or terrified. She'll say grateful. If you want to give her this, get on the phone with me first, then let her pick the date, the outfits, the comfort level. Gift her the decision, not the ambush. Form's in my bio.
Tell me I'm wrong on this one.

#boudoirgift #southbendboudoir #michianaboudoir #grangerindiana #boudoirphotographer`
  },
  {
    n:"3", title:"Can I Come Back For These Later?", cover:"covers/face-3.jpg", format:"Overheard In The Studio",
    script:`“Can I come back for these later?”
She always asks it quietly, right at the end, like she's asking me for an extension on something.
The answer is yes. For a year.
Whatever you buy on the day, I keep on file for twelve months. So if the album ends up on the coffee table and in October you decide your mother should have the print, it's still there. Same file, same edit. No re-shoot. No starting over.
But here's what she's actually telling me when she asks.
She isn't hedging. She already knows exactly which photograph she'll want again. She saw it at three o'clock on the big screen, she walked past it twice, and some part of her is already deciding where it goes.
Nobody asks for a year on something they're unsure about.
They ask for a year on the one they're certain about.`,
    caption:`“Can I come back for these later?” — asked quietly, at the end, like it's a favour. It isn't. Whatever you buy on the day stays on file with me for twelve months, so the print for your mother at Christmas is still there in October. Same file, same edit, no re-shoot. And when a woman asks for a year, she isn't hedging — she already knows which photograph she'll want again. Booking form's in my bio.
Which one would you already know?

#boudoiralbum #southbendboudoir #michianaboudoir #elkhartindiana #boudoirphotographer`
  },
  {
    n:"4", title:"The One Appointment You Can't Move", cover:"covers/face-4.jpg", format:"The Waiting List",
    script:`Your retainer holds one date. Not a credit. Not a voucher. Not a floating thing you'll use sometime.
That date.
Move it inside thirty days and it's gone. I don't make exceptions, and I know exactly how that sounds coming out of my mouth.
So here is why I keep it.
You have never once moved your daughter's dentist appointment. You've never rescheduled a parent-teacher conference because you were tired. You have moved your own hair appointment four times this year and you couldn't tell me why.
For one day, something of yours is as fixed as everything you do for everybody else.
That's not a penalty I invented to protect my calendar. That is the entire point of the rule.
The women who actually show up aren't the ones with more free time.
They're the ones who finally put something of their own in ink.`,
    caption:`Your retainer holds one date — and if you move it inside thirty days, it's gone. I know how that sounds. Here's why it stays: you have never once moved your daughter's dentist appointment, and you've moved your own hair appointment four times this year. For one day, something of yours gets to be as fixed as everything you do for everyone else. That's not a penalty. That's the point. Free twenty-minute call in my bio.
How many times have you moved something that was just for you?

#boudoirsession #southbendboudoir #michianaboudoir #nilesmichigan #boudoirphotographer`
  },
  {
    n:"★", title:"Photograph Your Wall", cover:"covers/reel-5.jpg", format:"The Prep List · BTS overlay", bts:true,
    screenTrial:`There's one photo you need to take before your shoot — and it isn't of you. It's all in the description.`,
    screenGrid:`Almost every woman guesses at this part, and almost every woman guesses small. I put the fix in the caption.`,
    caption:`Here's the one photo to take before your session, and it isn't of you.
Photograph the wall you'd actually hang something on. Then measure how wide it is and keep the number in your phone.
At three o'clock that afternoon you're choosing wall art with me, and every woman guesses. She guesses small, she buys small, and it ends up looking like a postcard on a wall that wanted a metre. With the photo and the measurement in front of us we drop the piece straight onto your real wall and you can see it before you spend anything.
If it's an album you're after instead, you'll watch the layout get designed in front of you the same afternoon.
Come with the wall in your phone. That's the whole prep list. Booking form's in my bio.
What wall are you picturing right now?

#boudoirwallart #southbendboudoir #michianaboudoir #goshenindiana #boudoirphotographer`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
