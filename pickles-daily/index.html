<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Wednesday, August 26, 2026 \u2014 film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": 1,
    "title": "One Woman A Day",
    "cover": "covers/face-1.jpg",
    "format": "Studio Rule \u00b7 Ep. 35",
    "script": "I photograph one woman a day. Not one in the morning and one at two. One.\nYour retainer doesn't buy a slot on a schedule. It buys the day, and it buys it exclusively.\nNobody is waiting in the hallway. Nobody is sitting in my lobby watching the clock while you're still in the makeup chair. Nothing gets cut short because the next client turned up early.\nIf your hair takes an extra forty minutes, it takes an extra forty minutes, and the only thing that changes is what time we break for lunch.\nHere's what that actually buys you. About an hour in, you stop asking me if we're running behind. You stop apologising for taking up time. And the woman who shows up after that is the one every single person books me for.\nIt is the most expensive rule I have, and I have never broken it once.\nOne woman. One day. Studio rule.",
    "caption": "I photograph one woman a day. One.\n\nYour retainer doesn't buy a slot on a schedule, it buys the day \u2014 and it buys it exclusively. Nobody waiting in the hallway. Nobody watching the clock while you're still in the makeup chair. If your hair takes an extra forty minutes, it takes an extra forty minutes.\n\nIt costs me money every single week and I'd never run it any other way, because about an hour in you stop asking if we're running behind \u2014 and that's the woman everybody books me for.\n\nEvery other studio in this business runs two, sometimes three sessions a day. I think that's the wrong call and I'll argue it with anyone.\n\n#southbendphotographer #boudoirphotography #michiana #luxuryboudoir #womenover40"
  },
  {
    "n": 2,
    "title": "Don't Bring Your Own Makeup Artist",
    "cover": "covers/face-2.jpg",
    "format": "The Prep List",
    "script": "Don't bring your own makeup artist. I know she's good. That genuinely isn't the problem.\nEveryday makeup and camera-ready makeup are two different jobs. Studio strobes find every single one of the differences \u2014 the line where the foundation stops, the powder that photographs grey, the lash that lifts at the corner under a modelling light nobody has ever pointed at her work before.\nAnd if you do bring your own, three things are true. She has to have you completely finished before you arrive. She can't stay for the shoot. And my team won't touch up somebody else's work.\nMine stays the whole day. She's watching your lip line between outfits. She's fixing what the robe just took off. She's standing behind me while you're being photographed.\nAnd she isn't my assistant once you're in front of that camera. She's yours.",
    "caption": "Don't bring your own makeup artist. I know she's good. That isn't the problem.\n\nEveryday makeup and camera makeup are two different jobs. Studio strobes find every difference \u2014 the line where the foundation stops, the powder that photographs grey, the lash that lifts under a modelling light nobody's ever pointed at her work before.\n\nIf you do bring your own: she finishes you before you arrive, she can't stay for the shoot, and my team won't touch up somebody else's work. Mine stays the whole day, watching your lip line between outfits \u2014 and once you're in front of the camera she isn't my assistant, she's yours.\n\nHas a photographer ever let you bring your own artist? I'm genuinely curious how that went.\n\n#boudoirphotographer #southbendindiana #glamourphotography #mishawaka #hairandmakeup"
  },
  {
    "n": 3,
    "title": "I Don't Have A Studio. I Have Four.",
    "cover": "covers/face-3.jpg",
    "format": "The Unpopular Opinion",
    "script": "Unpopular opinion: your photographer's studio is the wrong room. Not because it's a bad room. Because it's the room they signed a lease on, so every woman who walks through that door gets photographed in it.\nSame wall. Same window. Same sofa in the corner of four hundred different women's photographs.\nI don't have a studio. I have four. Niles, South Bend, Mishawaka and Elkhart \u2014 and we pick the room on your planning call, after I know what you want your pictures to look like. Not before.\nIf you want the old-Hollywood thing with the painted backdrop, I know exactly which room does that. If you want daylight and a big empty floor, that's a different building entirely. And if none of the four fit what's in your head, I book one that does.\nThe set gets chosen for the photograph. Not for the rent.",
    "caption": "Unpopular opinion: your photographer's studio is the wrong room.\n\nNot because it's a bad room. Because it's the room they signed a lease on \u2014 so every woman who walks through that door gets photographed in it. Same wall, same window, same sofa in the corner of four hundred different women's pictures.\n\nI don't have a studio. I have four: Niles, South Bend, Mishawaka and Elkhart. We pick the room on your planning call, after I know what you want your photos to look like. Old-Hollywood painted backdrop? I know the room. Daylight and a big empty floor? Different building. None of the four fit what's in your head? I book one that does.\n\nThe set gets chosen for the photograph. Not for the rent. Tell me I'm wrong.\n\n#boudoirstudio #michiana #elkhartindiana #nilesmichigan #boudoirphotography"
  },
  {
    "n": 4,
    "title": "You're Allowed To Hang Up",
    "cover": "covers/face-4.jpg",
    "format": "The Waiting List",
    "script": "You can't book me online, and that is completely deliberate.\nEveryone starts with a phone call. Free, with me, twenty minutes, nothing attached to it. And you are entirely allowed to get to the end of that call and say no thank you. Women do. I would rather that than a woman who booked at midnight because a button was easier than a conversation.\nHere's what I actually see, though. Women spend a year deciding whether to make that call. A year of opening my page, reading the whole thing, closing it again. Opening it in the car. Closing it again.\nA year of deliberating over twenty minutes that commit you to nothing at all.\nIt is the cheapest thing you will ever do that you have been putting off the longest.\nYou're allowed to hang up. You just don't get that year back.",
    "caption": "You can't book me online. That's deliberate.\n\nEveryone starts with a phone call. Free, with me, twenty minutes, nothing attached to it \u2014 and you're entirely allowed to get to the end of it and say no thank you. Women do. I'd rather that than someone who booked at midnight because a button was easier than a conversation.\n\nHere's what I actually see, though. Women spend a year deciding whether to make the call. A year of opening my page, reading the whole thing, closing it again. Opening it in the car. Closing it again. A year of deliberating over twenty minutes that commit you to nothing.\n\nHow long have you been circling something that would take twenty minutes to find out about?\n\n#boudoir #southbendindiana #michiana #selfworth #womensupportingwomen"
  },
  {
    "n": "\u2605",
    "title": "I Don't Know What My Vision Is",
    "cover": "covers/reel-5.jpg",
    "format": "Overheard in the Studio \u00b7 BTS overlay",
    "bts": true,
    "screenTrial": "Nearly every woman apologises for the same thing on her planning call. She has nothing to apologise for \u2014 the whole reason is in the description.",
    "screenGrid": "The women who walk out with the strongest photos almost never bring a mood board. What they bring instead is in the caption.",
    "caption": "\u201cI don't know what my vision is.\u201d\n\nSaid on nearly every planning call I've ever been on. Usually as an apology. Usually by a woman who thinks she was supposed to turn up with a Pinterest board and a colour palette and a plan.\n\nNobody knows. That's what the thirty minutes is for. That call is inside your retainer and it exists precisely because you don't know yet \u2014 we work it out together, out loud, before a single date goes on the calendar.\n\nAnd here's the part nobody expects: the women who walk out with the strongest-looking pictures almost never bring a mood board. They bring one object. His shirt. The coat. The earrings she's never had a reason to wear.\n\nSo what's your one object? Tell me \u2014 I'll tell you what I'd build around it.\n\n#boudoirphotography #southbendphotographer #grangerindiana #michiana #boudoirinspiration"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
