<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Monday, September 7, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"No Machine Touched Your Face", format:"Unpopular Opinion", cover:"covers/face-1.jpg",
    script:`Unpopular opinion: there is no AI anywhere near your photographs, and you are allowed to ask every photographer that question before you hand them a dollar.
So here is my answer before you have to ask it.
No generated skin. No generated background. No generated body.
Here is the entire list of what my retoucher is allowed to do. She extends a backdrop that ran out at the edge of the frame. She takes a light stand out of a corner. She moves one stray hair off your cheek.
That is the list. All of it.
Every curve in your photograph is a curve you walked into this building with. The light is real light. The room is a real room in South Bend. The woman is you, on a Tuesday, wearing your own skin.
I shoot print-ready in camera, which means there is nowhere in my process for a machine to hide even if I wanted one there.
If somebody hands you a file and cannot tell you what touched it, that is the whole answer.`,
    caption:`Ask me. Seriously — ask me, and ask the next photographer you talk to.

No generated skin. No generated background. No generated body. My retoucher extends a backdrop that ran out, pulls a light stand out of a corner, and moves a stray hair. That is the complete list, and it has not changed in 850 sessions.

I shoot print-ready in camera, which is also why you see 130 finished images the same afternoon — there is no room in that timeline for a machine to invent anything.

Every curve in your photograph is a curve you walked in here with. If a photographer can't tell you exactly what touched your file, you already have your answer.

What would you want to know about your own photos before you booked? Form's in my bio.

#boudoirphotography #southbendphotographer #realwomenrealbodies #michianaphotographer #unretouched`
  },
  {
    n:"2", title:"The Hardest Part Is The First Message", format:"The Waiting List", cover:"covers/face-2.jpg",
    script:`There is a message to somebody like me sitting in your drafts right now.
You typed it out. You read it back. You decided it sounded ridiculous coming from you, and you closed the app.
That was months ago and you still know it is there.
Here is what nobody tells you. The hardest part of this whole thing is that first message. Not the camera. Not the lingerie. Not standing in a studio in South Bend with the lights on.
Everything after the message is my job. The wardrobe, the hair and makeup, the posing — I will literally tell you where to put your hands. You have never had to know any of that, and you are not supposed to.
You already did the part that takes actual nerve. You wrote it. You just did not press send.
So where is yours right now — still in your drafts, or still in your head?`,
    caption:`I get the half-written ones. Women tell me later that they typed something out in March and sent it in September.

The wardrobe, the posing, the hair and makeup, what happens when you get nervous at 9am — all of that is my job, and I have done it 850 times. None of it requires anything from you in advance.

The only part that takes nerve is the sentence you already wrote and didn't send.

So be honest with me: is yours still sitting in your drafts, or still sitting in your head?

#boudoirphotographer #grangerindiana #selflovejourney #womenover40 #boudoirinspiration`
  },
  {
    n:"3", title:"Before I Forget What It Looked Like", format:"Overheard in the Studio", cover:"covers/face-3.jpg",
    script:`I want to see it before I forget what it looked like.
She said that to me in the first ten minutes, and then she apologized for saying it.
She had booked six days before her surgery.
I have photographed women before treatment, in the middle of it, and a year out the other side of it, and not one of them booked me to look sick. Not one of them booked me to look brave, either.
She booked because a body she had lived in her entire life was about to change, and nobody had ever photographed it properly. Not once. Four decades, and the only pictures of her were her holding somebody else's kid at a birthday party.
We did not talk about the surgery. We did hair and makeup and three sets, and she picked her favorites over lunch.
She has them now. That was the entire point.
If your reason is sitting on a calendar, the form is in my bio.`,
    caption:`She apologized for saying it. Women apologize in my studio constantly, and almost never for anything that needs an apology.

I have photographed women before treatment, during it, and a year out the other side. Not one of them booked to look sick, and not one booked to look brave. They booked because a body they had lived in their whole life was about to change and nobody had ever photographed it properly.

We didn't talk about the surgery. We did hair and makeup, three sets, and she picked her favorites over lunch. She has them.

If you're waiting for a reason: what is the thing you'd want a photograph of before it changes?

#boudoirsession #mishawakaindiana #womenempoweringwomen #bodypositivity #portraitsofwomen`
  },
  {
    n:"4", title:"The Person Who Sells It Shoots It", format:"Studio Rule \u00b7 Ep. 46", cover:"covers/face-4.jpg",
    script:`Studio rule: the person who sells you this is the person who shoots it.
There is no studio manager here. No sales team. No associate shooter. No assistant who takes over the second your card clears.
The man on your consult call is the man behind the camera, and he is the man sitting next to you at the reveal at two o'clock that same afternoon.
That is not a staffing accident. It is a rule, and it exists because whoever promised you something should be standing in the room when it is time to deliver it.
It also means I cannot oversell you in July and hand you to somebody else in September. If I promise you old Hollywood light, three sets, and your finished images on a sixty-five inch screen before you drive home, I am the one standing there when you find out whether that was true.
Ask any studio you are considering who actually shows up. Studio rule.`,
    caption:`Every promise made about your session is made by the person who has to keep it. That is the whole rule.

No studio manager. No sales team. No associate shooter. The man on your consult call is behind the camera at 10am and sitting next to you at the reveal at 2pm the same day.

It's a boring-sounding rule until you've been handed off by a studio that sold you one thing and delivered another. Then it's the only question worth asking.

So ask it — of me, and of anyone else you're considering: who is actually going to be in the room?

#luxuryboudoir #elkhartindiana #boudoirstudio #oldhollywoodglam #samedayreveal`
  },
  {
    n:"\u2605", title:"Nothing Is New That Week", format:"The Prep List \u00b7 BTS overlay", cover:"covers/reel-5.jpg", bts:true,
    screenTrial:`There is one week where you should change absolutely nothing about your body, and most women pick that exact week to change five things. The rule is in the description.`,
    screenGrid:`Every prep mistake I see comes down to one rule nobody ever told her, and it is not about weight. I wrote the whole thing out in the caption.`,
    caption:`One rule covers almost every prep mistake I see: nothing on your body is new in the seven days before your session.

Not the spray tan. Not the tattoo. Not the drastic cut or colour. Not first-time filler or botox. Not a wax you have never had before.

New things swell, peel, settle wrong, or turn a colour — and unlike a wardrobe mistake, you cannot take it off between sets. It is in every frame, all day, in all three outfits.

Do the new thing three weeks out so it settles, or do it after your session. The week before is for boring maintenance and nothing else: sleep, water, the moisturiser you already own, and the mani you have had a hundred times.

The one thing you should change that week is nothing. Which of those five were you about to book?

#boudoirprep #nilesmichigan #whattoweartoyourshoot #glamourphotography #boudoirtips`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
