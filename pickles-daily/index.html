<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Friday, September 11, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"The List I Keep in a Notebook", cover:"covers/face-1.jpg", format:"Overheard in the Studio",
    script:`These are real things people have asked me to photograph them with, and the answer has been no every single time.
A live snake. Not a fake one. A snake with a name and a travel case.
A firearm. Her exact words were "it's registered," like that was the part I was worried about.
A car. Not one in the studio. One that was never going to fit through the door, and she asked anyway.
And someone else's husband. I asked her to repeat it. She repeated it. Slower.
I'm not judging anybody. I keep the list. It's in a notebook. It gets longer every year.
But here's the thing about eight hundred sessions. The thing that photographs best has never been the snake. It's never been the car. It's her. Every time. Fur coat, painted backdrop, statement jewelry, and a woman who finally stopped apologizing.
So bring yourself. We'll negotiate the rest.
If you've got something for the list, the form's in my bio. I need it in writing.`,
    caption:`Real inquiries. A live snake. A registered firearm. A car that was never going to fit through my studio door. Someone else's husband. The answer was no all four times, and the list keeps growing. Eight hundred sessions later, the thing that photographs best is still the woman standing in front of the backdrop — no props required. South Bend, Granger, Mishawaka: the form's in my bio when you're ready. What's the wildest thing you'd bring to a photoshoot?

#boudoirphotography #southbendboudoir #michianaphotographer #boudoirstudio #grangerindiana`
  },
  {
    n:"2", title:"Not Your Emotional Support Squirrel", cover:"covers/face-2.jpg", format:"Studio Rule \u00b7 Ep. 49",
    script:`If you're not being photographed, you're not staying. Studio rule number one, episode forty-nine, still undefeated.
Not your best friend. Not your mom. Not your sister who's "just going to read in the corner."
Not your emotional support squirrel.
Not your husband who "won't say anything." He will say something. With his face. Every four minutes.
Not your coworker who did one in Chicago and has notes.
Not your dog. I love your dog. Your dog sheds on the fur coat.
Not your teenager who's "basically an adult." Basically is doing a lot of work in that sentence.
Not the friend who's "thinking about booking" and wants to see how it goes. She can book. Then she can see.
One woman. One room. One day. Hair and makeup at nine, three outfits, lunch, and a reveal at one o'clock with nobody's face to check but your own.
Whoever drove you can wait at the coffee shop. They get the surprise at the reveal.
The form's in my bio. Episode fifty next. Bring nobody.`,
    caption:`Episode 49 and the rule hasn't moved: if you're not being photographed, you're not staying. Not your best friend, not your mom, not your sister with a book, not the emotional support squirrel. It isn't attitude — the woman I'm here to photograph only shows up when the audience leaves. Hair and makeup at nine, three outfits across three sets, lunch, and 130-plus finished images on the 65-inch screen by one o'clock, with nobody's reaction to manage but your own. Michiana, the form's in my bio. Who were you going to try to sneak in?

#southbendphotographer #boudoirsession #michianaboudoir #studiorules #mishawakaindiana`
  },
  {
    n:"3", title:"Leave Him at Home", cover:"covers/face-3.jpg", format:"The Waiting List",
    script:`If your husband can't jump on the couch about this, leave him at home.
Husbands aren't always supportive. Some are. Some are Tom Cruise on Oprah's couch about it, and those women walk in ten feet tall.
And some get "sure, if that's what you want." Said to the TV. Without looking up.
He's not the villain. He's just lukewarm, and here's the problem with lukewarm.
You get one day this year where the only opinion in the room is yours. One. Not the kids'. Not your mother's. Not the group chat's. Yours.
A lukewarm opinion is still an opinion. It still takes up a chair. It still sits in the back of your head while you're standing in a fur coat trying to decide whether you're allowed to enjoy this.
So he doesn't come. He sees the pictures at the reveal, if you decide he does, after you've already decided how you feel about them.
This was never his day to approve. It was yours to take.`,
    caption:`Husbands aren't always supportive, and I've stopped being surprised by it. If he can't be Tom Cruise on the couch about it — if the best he's got is "sure, if that's what you want" — then he doesn't come. Not because he's the bad guy. Because you get exactly one day this year where the only opinion in the room is yours, and a lukewarm one still takes up a chair. He sees the photos at the reveal, on your terms. South Bend and Michiana, when you're ready, the form's in my bio. What did he say when you brought it up?

#boudoirphotographer #southbendindiana #selfworth #womenover40 #elkhartindiana`
  },
  {
    n:"4", title:"Soft Isn't a Style", cover:"covers/face-4.jpg", format:"Unpopular Opinion",
    script:`Unpopular opinion: the blurry-photo trend isn't artistic vision. It's "I forgot my contacts."
I know. It's everywhere right now. Soft, dreamy, everything slightly out of focus, and the caption says "a feeling, not a photo."
Here's what I actually think. Blur is a choice you make once. On purpose. For one frame. Because that one frame needed it.
When the whole gallery is soft, that's not a style. That's a photographer who didn't nail focus and found a word for it. And you paid for the word.
I shoot print-ready in camera. Every frame. That's how the gallery is finished over lunch and on the 65-inch screen at one o'clock. You can't do that with "mood." You do that with focus, light, and eight hundred sessions of practice.
Your grandkids are going to hold this print. They should be able to see your face.
Timeless, not trendy. I said what I said.
If you want a photographer who can find your eyes, the form's in my bio.`,
    caption:`Unpopular opinion: the blurry-photo trend isn't a vision, it's a miss with a nice caption. Blur is a decision you make once, on purpose, for one frame. When the whole gallery is soft, somebody didn't nail focus and found a word for it. I shoot print-ready in camera — that's the only reason 130-plus finished images are on the 65-inch screen the same afternoon. Your grandkids should be able to see your face. Michiana, the form's in my bio. Am I wrong about this one?

#glamourphotography #michiana #boudoirphotos #photographyopinions #nilesmichigan`
  },
  {
    n:"5", title:"Two Different Purchases", cover:"covers/reel-5.jpg", format:"The Prep List (BTS overlay)", bts:true,
    screenTrial:`What looks good in a fitting-room mirror and what looks good under studio light are two different garments, and almost every woman buys the wrong one the first time. The one thing to check before you buy is in the description.`,
    screenGrid:`Nobody is born knowing how to buy lingerie for a camera. That's why my styling guide lands in your inbox before you ever set foot in a store. The three things it tells you first are in the caption.`,
    caption:`Most women have never bought lingerie for a camera before, and the two are not the same purchase. What flatters you in a fitting-room mirror and what flatters you under studio light are different garments, and nobody is born knowing which is which. So the guide goes out the moment you book, before you shop.

The one thing to check before you buy: does it skim you, or does it hide you? If it hides you, put it back. Babydolls are the devil — I'm here to show off your body, not cover it up.

The three things the guide tells you first:
1. If you only bring one item, make it a bodysuit. It skims instead of adding bulk, and trim or piping draws an hourglass line on every shape.
2. Fit beats fabric. Not too tight, not too loose. Tight leaves marks under studio light and takes time to fade.
3. Layer for drama. A robe, his button-up, a faux fur — coverage when you want it, and it photographs like a second outfit.

And lingerie isn't required. Gowns, fur, an oversized shirt, jeans — plenty of women start covered and spice it up as the day goes. Three outfits, three sets, and you're never guessing at nine at night in a store. South Bend and Michiana, the form's in my bio. What's the one piece you've been staring at and not buying?

#whattowearboudoir #lingerieguide #southbend #boudoirprep #indianaboudoir`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
