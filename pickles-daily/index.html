<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Friday, August 7, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": "1",
    "title": "The third outfit isn't yours",
    "format": "Studio Rule — Ep. 23",
    "cover": "covers/face-1.jpg",
    "script": "The third outfit isn't yours. Studio rule.\nYou bring three. Two of them are entirely your call — whatever makes you feel like the version of yourself you want hanging on a wall. I don't get a vote on those.\nThe third one, I pick out of what you brought. And it is always the one you almost left at home. The one you packed last, with an apology attached. \"This one's probably stupid.\"\nThat's the one. Eight hundred and fifty sessions, and it has never once failed.\nHere's why it works. The two you chose, you chose with the picture already in your head. You know how you'll stand. You've rehearsed it in the mirror. The third one you have no plan for — so you stop performing and you just react. And reacting is the only thing a camera can't fake.\nBring the stupid one. It isn't stupid. It's the set you'll end up buying.",
    "caption": "You bring three outfits. Two are yours — I don't get a vote.\n\nThe third one I pick out of your bag, and after 850 sessions I can tell you it is always the one you packed last with an apology attached. “This one's probably stupid.”\n\nIt's never stupid. It's the one you didn't rehearse, and the camera can tell the difference.\n\nBring the whole bag. South Bend studio, one woman a day — form's in my bio.\n\n#boudoirphotography #southbendphotographer #michianaboudoir #whattowear #mishawakaindiana"
  },
  {
    "n": "2",
    "title": "It's the boring one",
    "format": "Unpopular Opinion",
    "cover": "covers/face-2.jpg",
    "script": "The outfit that photographs best is the most boring thing in your suitcase. Unpopular opinion, and nobody wants to hear it.\nLeopard. Florals. Anything with a print. A print stamps a date on the picture. In eleven years, the print is the only thing you'll see — you'll look at that photograph and think 2026 instead of thinking, look at me.\nGo find a photograph of your grandmother that still works. I'll wait. Plain fabric. Strong face. Nothing in the frame competing with her.\nThat's not luck and it's not nostalgia. That's the entire reason it survived. A print is a trend wearing a costume, and a trend is the fastest way to date a photograph.\nSo bring the leopard if you love the leopard. I'll shoot it and you'll like it.\nBut the plain black one with nothing going on? That's the one still on your wall when your daughter's the one looking at it.",
    "caption": "Unpopular opinion: the most boring thing in your bag is the thing that photographs best.\n\nPrints date a picture. In eleven years the leopard is the only thing you'll see in it. Go look at any photograph of your grandmother that still works — plain fabric, strong face, nothing competing with her. That's not luck. That's why it survived.\n\nTimeless, not trendy. Bring the leopard anyway, I'll shoot it. But the plain one is the one your daughter ends up looking at.\n\nMichiana studio — form's in my bio.\n\n#boudoirphotography #glamourphotography #southbendindiana #whattowearboudoir #grangerindiana"
  },
  {
    "n": "3",
    "title": "Don't post any of them",
    "format": "Overheard in the Studio",
    "cover": "covers/face-3.jpg",
    "script": "“Don't post any of them.” I hear that before almost every session — usually in the first ten minutes, usually while she's still holding her coffee.\nAnd I say yes. Immediately. No negotiation, no “well, maybe just one.” They're your images, not my portfolio. It is a hundred percent your call, and it stays your call forever.\nWhat I don't say out loud is what happens next.\nBecause the text usually turns up about four days later. And it's one word.\nPost.\nThen a second text: actually, the black one. Then: actually, all of them.\nThat's not her changing her mind about privacy. That's her catching up to herself, and it takes about four days. She sees them once with me, she goes home, she opens them again at eleven at night when the house is finally quiet — and something rearranges.\nSo don't post any of them. I mean that. And I'll be here in four days.",
    "caption": "“Don't post any of them.” I hear it before almost every session, and the answer is always yes. No negotiation. They're your images, not my portfolio — 100% your call, forever.\n\nWhat I don't say out loud is that the text usually turns up about four days later, and it's one word. Post.\n\nThen: actually, the black one. Then: actually, all of them.\n\nNothing about her privacy changed. She just caught up to herself. Takes about four days.\n\nSouth Bend studio — form's in my bio when you're ready.\n\n#boudoirphotography #southbendboudoir #boudoirphotographer #michianawomen #elkhartindiana"
  },
  {
    "n": "4",
    "title": "You're not busy. You're last.",
    "format": "The Waiting List",
    "cover": "covers/face-4.jpg",
    "script": "You are not a woman without time. You're a woman who has never been the appointment.\nYou found time for the dentist. Twice this year, and one of those was a filling you didn't want.\nYou found time for the dog's teeth. The dog. His teeth.\nYou drove two hours on a Tuesday for your mother's cardiologist, you didn't complain once, and you brought her a coffee for the ride home.\nYou have never in your life been too busy. That was never the problem.\nThe problem is that every one of those went on the calendar the second somebody asked. No debate. No let-me-see-how-things-look. They got a yes before you'd finished hearing the question.\nSo when you tell me you'll do this once things calm down — I believe that you believe it. But things don't calm down. They never have.\nYou're not busy. You're last on a list you wrote yourself.\nAnd you're allowed to move your own name.",
    "caption": "You're not a woman without time.\n\nYou found time for the dentist. You found time for the dog's teeth. You drove two hours on a Tuesday for your mother's cardiologist and never complained once.\n\nEvery one of those went on the calendar the second somebody asked. No debate.\n\nYou're not busy. You're last on a list you wrote yourself — and you're allowed to move your own name.\n\nOne woman a day, South Bend. Form's in my bio for whenever that day is.\n\n#boudoirphotography #womenover40 #southbendindiana #selfworth #michiana"
  },
  {
    "n": "★",
    "title": "Four things to leave at home",
    "format": "BTS Overlay · The Prep List",
    "bts": true,
    "cover": "covers/reel-5.jpg",
    "screenTrial": "There are four things I'd quietly take back out of your bag before a shoot like this. Three of them you'd never guess. The fourth one you packed on purpose, for a reason you'd never say out loud. All four are in the description.",
    "screenGrid": "I've watched eight hundred and fifty women pack for this, and there are four things I'd take straight back out of the bag — including the one thing you'd swear was the safest thing in there. I put the whole list in the caption.",
    "caption": "Four things to leave at home.\n\n1. The costume. If you'd have to explain it, it's a costume — and you'll spend the whole session inside somebody else's idea instead of your own.\n\n2. Anything with a logo. A brand name in the frame dates the picture, and it isn't yours anyway.\n\n3. Anything you have to hold in place. If it only works while you're standing still, it does not survive you laughing. And you are going to laugh.\n\n4. The thing you bought to hide one specific part of you. That's the one that photographs as hiding. Every time. It's the only item in that bag doing a job you didn't hire it for.\n\nScreenshot this and send it to whoever's shooting next month. South Bend studio — form's in my bio.\n\n#boudoirphotography #boudoirprep #southbendphotographer #whattobring #nilesmichigan"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>

</body></html>
