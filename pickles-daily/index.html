<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Sunday, August 23, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Nobody Ever Has To Know", format:"The Studio Rule — Ep. 33", cover:"covers/face-1.jpg",
    script:`I will not tell anyone you were here. Not your name, not a hint. Studio rule number thirty-three.
If another client asks me who else has shot with me, I change the subject. The only exception is a woman who has already said it publicly herself, and even then I would rather she say it than me.
Here is the part almost nobody knows about.
There is a fully private option. If you take it, the only two people on earth who ever see your finished images are me and my retoucher. Not the makeup artist. Not my website. Not one story, ever.
Most women don’t take it. They walk in nervous, they hear that it exists, and by the second outfit they have forgotten they were ever worried.
That is the whole point. You don’t have to use the door. You just have to know it is there.
If that is the part you needed to hear, the form is in my bio.`,
    caption:`Studio rule number thirty-three: I will not tell people you were here.

Not your name. Not a hint. Not to another client asking who else has been in front of my camera. The only time your name ever comes out of my mouth is if you have already said it publicly yourself.

And there is a fully private option most women don’t know exists. Take it and the only two people on earth who ever see your finished images are me and my retoucher. Not the hair and makeup artist. Not my website. Not a single story.

Most women don’t end up taking it. That has never been the point. Knowing the door is there is what lets them relax enough to actually be photographed.

South Bend, Mishawaka, Granger, Elkhart, Niles — wherever you are driving in from, this rule travels with you.

Ready when you are. The form is in my bio.

#boudoirphotography #southbendboudoir #michianaphotographer #boudoirstudio #indianaboudoir`
  },
  {
    n:"2", title:"Nobody Scrolls A Hard Drive", format:"The Unpopular Opinion", cover:"covers/face-2.jpg",
    script:`Unpopular opinion: the digital files are the least valuable thing you will buy from me. And I sell them.
A file lives on a phone you are going to replace in three years. Then it lives in an account somebody needs a password to get into. Then it lives nowhere, because nobody scrolls a hard drive.
The album is a different object entirely. It is made by hand in Portugal. It sits on a shelf in your living room and people pick it up without asking, because that is what people do with a book.
Here is the test I use.
Thirty years from now, one of those two things gets found by somebody in your family. A granddaughter. A kid cleaning out a closet. Somebody who never knew you at this age.
It is not going to be the folder.
Buy the digitals. Post them, love them. Just don’t confuse the copy with the thing.
The form is in my bio.`,
    caption:`Unpopular opinion, and I sell the thing I’m about to talk down: your digital files are the least valuable part of this.

A file lives on a phone you’ll replace in three years. Then in a cloud account somebody needs a password for. Then nowhere, because nobody has ever sat down and scrolled a hard drive.

The album is made by hand in Portugal. It sits on a shelf. People pick it up without asking permission, because that is what people do with a book.

Thirty years from now one of those two things gets found by somebody in your family — a granddaughter, a kid clearing out a closet, somebody who never knew you at this age.

It is not going to be the folder.

Buy the digitals. Post them. Love them. Just don’t mistake the copy for the thing.

Booking form is in my bio.

#luxuryboudoir #southbendphotographer #boudoiralbum #michianaboudoir #timelessportraits`
  },
  {
    n:"3", title:"Not The One She Planned", format:"Overheard In The Studio", cover:"covers/face-3.jpg",
    script:`Which one should I pick. She asks me that at the reveal, sitting in front of a hundred and forty pictures of herself on a sixty-five inch television.
And she is not asking for my taste. I learned that a long time ago.
She walked in at nine that morning with one specific photograph already in her head. The one she had been picturing for weeks. Black lingerie, the big fur, the serious face. That is the one she came for.
By three o’clock she wants a completely different one, and she doesn’t quite trust herself for wanting it.
It is usually the one where she is laughing. Or the one where she is not doing anything at all.
The photograph she planned is almost never the photograph she takes home.
That is not indecision. That is her taste catching up to a version of herself she had not met yet at nine in the morning.
So I tell her the truth. Pick the one you cannot stop looking at.
Form is in my bio.`,
    caption:`“Which one should I pick?”

She asks me that at the reveal, sitting in front of a hundred and forty finished pictures of herself on a sixty-five inch screen, four hours after we started.

She is not asking for my taste. She walked in at nine that morning with one specific photograph already in her head — the one she’d been picturing for weeks. Black lingerie, the big fur, the serious face.

By three o’clock she wants a completely different one and doesn’t quite trust herself for wanting it. It’s usually the one where she’s laughing. Or the one where she isn’t doing anything at all.

The photograph she planned is almost never the photograph she takes home. That isn’t indecision — that’s her taste catching up to a version of herself she hadn’t met yet at nine in the morning.

Same day. Fully edited. On the screen before she leaves.

Form’s in my bio.

#samedayreveal #boudoirphotographer #mishawakaphotographer #boudoirsession #southbendindiana`
  },
  {
    n:"4", title:"It’s Never The Oldest One", format:"The Waiting List", cover:"covers/face-4.jpg",
    script:`The most nervous woman in my studio is never the oldest one.
She is thirty-four. She apologises before she takes her coat off. She tells me what she used to look like.
The woman who walks in at sixty puts her handbag down, asks me where she should stand, and gets on with it.
Somewhere along the way she stopped negotiating with herself about whether she had earned this. And the pictures are better for it. Every single time. That is not a nice thing to say to make you feel better, that is eight hundred and fifty sessions of the same result.
So whatever version of you you are waiting to become before you will allow yourself this. The one who is ten pounds lighter, or less tired, or further along.
I need you to hear this.
She is not coming.
The woman who books is not the one who finally feels ready. She is the one who got tired of arguing.
If that is today, the form is in my bio.`,
    caption:`The most nervous woman in my studio is never the oldest one.

She’s thirty-four. She apologises before she takes her coat off. She tells me what she used to look like, as if I asked.

The woman who walks in at sixty puts her handbag down, asks me where she should stand, and gets on with it. Somewhere along the way she stopped negotiating with herself about whether she’d earned this — and the pictures are better for it. Every single time. That’s not a kind thing to say, it’s 850 sessions of the same result.

So whatever version of you you’re waiting to become before you’ll allow yourself this — ten pounds lighter, less tired, further along —

she isn’t coming.

The woman who books is not the one who finally feels ready. She’s the one who got tired of arguing with herself.

Right now, today. Not fifteen pounds from now. Form’s in my bio.

#boudoirconfidence #womenover40 #grangerindiana #boudoirphotography #michiana`
  },
  {
    n:"★", title:"One Thing I Can’t Fix", format:"The Prep List · BTS overlay, text over you working", bts:true, cover:"covers/reel-5.jpg",
    screenTrial:`There is one thing on your body I cannot fix afterwards. The whole list is in the description.`,
    screenGrid:`Four things I need you to NOT do the week of your shoot. I put all four in the caption.`,
    caption:`Do not get a spray tan for this.

That’s the one. It photographs orange under studio light, it goes patchy at your ankles and your knuckles first, and it is genuinely the only thing on your body I can’t fully fix afterwards.

Same week, same list:

No sunburn. Lines show up under every single light I own.
No brand-new tattoo. It’s still healing and it photographs shiny.
Nothing drastic — not the haircut, not the colour, not the brows. The week before a shoot is the worst possible week to find out you hate it.

And if you want warmth in your skin, we add it in the retouch. Takes about four seconds and it still looks like skin, because it is your skin.

Turn up the colour you already are.

Booking for South Bend, Mishawaka, Granger and Elkhart — form’s in my bio.

#boudoirprep #photoshootprep #elkhartindiana #southbendboudoir #boudoirphotographer`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
