<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Thursday, September 4, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Nobody Knew She Booked It", format:"Overheard in the Studio",
    cover:"covers/face-1.jpg",
    script:`"I didn't tell anybody I was coming today."

I hear that about once a week, usually twenty minutes in, and it's always said like a confession.

No husband. No sister. No group chat. She booked it, drove here, and told nobody.

And I understand exactly why. The second you tell people, you've handed out votes. Somebody asks what it costs. Somebody asks why. Somebody makes a face and doesn't say anything, which is worse.

So she keeps it to herself, and that turns out to be the most protective thing she could have done — because for one entire day the only opinion in this building is hers.

Here's the part nobody sees coming. The women who told nobody are the loudest ones at three o'clock. Every single time. She sits down in front of a sixty-five inch screen with nothing to defend and no face to check, and she just reacts.

You don't owe anyone a heads-up. This one gets to be yours.

Form's on my site whenever you want it.`,
    caption:`"I didn't tell anybody I was coming today."

I hear it about once a week, and it's always said like a confession. No husband, no sister, no group chat — she booked it, drove to South Bend, and told nobody.

I used to think that was fear. It isn't. Telling people hands out votes, and she'd already made the decision. The women who tell nobody are the loudest ones at the reveal, every single time — nothing to defend, no face in the room to check.

Do you think keeping it to yourself is hiding, or is it the one time a woman is allowed to make a decision without a committee?

#boudoirphotography #southbendphotographer #michiana #womenover40 #boudoirsouthbend`
  },
  {
    n:"2", title:"I Turned Down Next Tuesday", format:"Studio Rule \u00b7 Ep. 44",
    cover:"covers/face-2.jpg",
    script:`You can't book me for next week. Even when the calendar's wide open. Studio rule forty-four, and it costs me money every single month.

Most women are on my calendar one to two months out. That's not scarcity and it's not a waiting list I invented to look busy. It's how long this actually takes to do properly.

Between the day you book and the day you shoot, there's a thirty-minute planning call where we build the whole thing — colors, sets, wardrobe, what we're not doing. Then a styling guide. Then you have to order things, have them arrive, and try them on before they matter.

Squeeze all of that into six days and you shoot in whatever was already in the drawer. Which is exactly the shoot you've been avoiding for six years.

The rush is never the emergency. Being underprepared for the one day that's entirely about you — that's the emergency.

Form's on my site when you're ready to pick a date.`,
    caption:`Studio rule forty-four: you can't book me for next week, even when my calendar is wide open.

Most women shoot one to two months out. Not scarcity — logistics. There's a planning call, a styling guide, and things you have to order and actually try on. Compress that into six days and you shoot in whatever was already in the drawer, which is the exact shoot you've been avoiding for six years.

Every photographer I know would take the last-minute money. I think turning it down is the whole job.

Would you rather have the date you want, or the shoot you want?

#boudoirphotography #southbendphotographer #mishawaka #michianaphotographer #boudoirstudio`
  },
  {
    n:"3", title:"Designed In Front Of You", format:"Unpopular Opinion",
    cover:"covers/face-3.jpg",
    script:`Unpopular opinion: you should never let a photographer design your album without you in the room.

It's standard in this industry. You shoot, you wait, and weeks later a PDF lands in your inbox with somebody else's version of your day in it. Then you spend three polite emails asking to move image fourteen.

I design your book in front of you, the same afternoon you shoot it. You're sitting right there while the spreads go together — that one, not that one, that one bigger, she goes on the left. It takes as long as it takes, and you leave having actually seen your own album.

Photographers will tell you they need the distance to make good design choices. I think they need the distance because they're guessing at what mattered to you, and you were standing right there when it happened.

It's your book. Your face. Your call, in the room, that day.

Form's on my site if you want that afternoon.`,
    caption:`Unpopular opinion: you should never let a photographer design your album without you in the room.

The industry standard is a PDF that lands weeks later with somebody else's version of your day in it, and then three polite emails asking to move image fourteen.

I design the book in front of you the same afternoon you shoot — that one, not that one, that one bigger. It takes as long as it takes. You leave having seen your own album instead of approving it later like a work email.

Photographers, come argue with me on this one: is the distance craft, or is it just guessing at what mattered to her?

#boudoirphotography #southbendphotographer #samedayreveal #michiana #luxuryboudoir`
  },
  {
    n:"4", title:"Nobody Walks In Confident", format:"The Waiting List",
    cover:"covers/face-4.jpg",
    script:`You think this is for confident women. Eight hundred and fifty sessions, and almost nobody walks through that door confident.

They walk in apologizing. For their arms. For not knowing how to pose. For taking up my morning, as though I had somewhere better to be.

The confident woman you're picturing — the one you've decided you'd have to become first — she doesn't exist in my studio at nine in the morning. She shows up around one o'clock. And she's the same person who was apologizing four hours earlier.

That's the part you have backwards. Confidence isn't the ticket in. It's what the day hands you on the way out.

You're not waiting until you're ready. You're waiting to become a woman who never needed this in the first place, and she isn't coming.

The form on my site is there whenever.

Come as the woman who's nervous. That one photographs beautifully.`,
    caption:`You think this is for confident women.

Eight hundred and fifty sessions and almost nobody walks in confident. They walk in apologizing — for their arms, for not knowing how to pose, for taking up my morning.

The confident woman you've decided you'd have to become first doesn't exist in my studio at nine in the morning. She shows up around one. Same person, four hours later.

Confidence isn't the ticket in. It's what the day hands you on the way out. You're not waiting until you're ready — you're waiting to become someone who never needed this, and she isn't coming.

What are you actually waiting for? I'd genuinely like to know, because I've heard about six answers and they're all the same one.

#boudoirphotography #southbendphotographer #michiana #selfworth #womenover40`
  },
  {
    n:"★", title:"Three Outfits Is Not Enough", format:"BTS Overlay \u00b7 The Prep List", bts:true,
    cover:"covers/reel-5.jpg",
    screenTrial:`Every woman brings exactly three outfits to her shoot. That's the mistake, and it's the one thing I can't fix on the day. The whole reason is in the description.`,
    screenGrid:`The outfit she's most sure about is almost never the one she buys. There's a reason that happens every single time — I put the whole thing in the caption.`,
    caption:`You shoot three sets. That does not mean you pack three outfits.

Here's what happens when you bring exactly three: the one you were most sure about is the one that doesn't work. Not because it's wrong — because you bought it for a mirror, and a mirror doesn't have a strobe in it. Something reads flat on camera, or the color fights the set, or it's beautiful and it does nothing for the light we're standing in.

With three, that's it. We shoot it anyway. With six or seven, we lay everything out at nine in the morning, put it against the actual sets, and choose in the room instead of in your bedroom three weeks ago.

Bring more than you need. Bring the gown you've never worn, his shirt, the thing that means something. Robes, furs and statement jewelry are already here — that part's covered.

Nine times out of ten, the favorite image of the day comes off the outfit she almost left at home.

What's the one thing in your closet you'd never have the nerve to bring? That's usually the one.

#boudoirphotography #southbendphotographer #michiana #whattowear #boudoirsouthbend`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
