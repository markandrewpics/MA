<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Wednesday, July 29, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"You See Them First", format:"Studio Rule · Ep. 18",
    cover:"covers/face-1.jpg",
    script:`Nobody sees your photos before you do. Not my website, not my Instagram, not your husband. Studio rule eighteen.

There is no sneak peek in my studio. No quick one for the story while you're still sitting in the makeup chair. The first human being on earth to see a single frame from your session is you — in front of a sixty-five inch screen, between one and three that same afternoon.

Most photographers post a sneak peek because it fills their feed while they've still got three weeks of editing ahead of them. I don't have three weeks of editing. I finish yours over lunch. So there is nothing to tease and nobody to tease it to.

You get the whole thing, finished, first. A hundred and thirty to a hundred and sixty images, and not one of them has been seen by anybody except me and the woman standing in them.

Order matters more than people think. You go first. Every single time.`,
    caption:`Every photographer you follow posts sneak peeks. I don't post one single frame of your session before you've seen all of it — and the reason is boring and practical: I finish your editing over lunch, so there's nothing to tease you with. You sit down between one and three the same afternoon and watch 130 to 160 finished images come up in 4K. Nobody on earth has seen them but me. What happens after that is entirely your call, and it always has been. Form's in my bio.

#southbendboudoir #boudoirphotography #michianaphotographer #studiorules #indianaboudoir`
  },
  {
    n:"2", title:"It Was Never the Camera", format:"Unpopular Opinion",
    cover:"covers/face-2.jpg",
    script:`Unpopular opinion: nobody on earth is camera-shy. A camera is a box with a piece of glass in it. You are not afraid of that.

What you're afraid of is the judgment you assume is standing behind it. Somebody deciding. Somebody comparing. Somebody thinking the exact thing you've been thinking about yourself since you were fourteen.

Eight hundred and fifty women have stood in front of my camera, and most of them said some version of I'm not photogenic inside the first ten minutes. Then they watched their own reveal and went completely quiet.

Here's what nobody tells you. I don't have an opinion about your body. I have an opinion about where the light goes. That's the entire job. I look at a jawline the way a carpenter looks at a board — is it square, is it lit, is it working.

The camera has no opinion. And after eight hundred and fifty women, neither do I. Just a very long wall of proof.`,
    caption:`"I'm not photogenic" is the most common sentence in my studio and it has never once been true. Nobody is afraid of a camera — it's a box with glass in it. What you're afraid of is the judgment you assume is standing behind it, and I promise you it isn't. I'm not looking at your stomach. I'm looking at where the light lands. That's the whole job, and it's mine, not yours. You just have to show up in South Bend and let me do it. Form's in my bio.

#boudoirphotographer #southbendindiana #michianawomen #confidenceboost #indianaphotographer`
  },
  {
    n:"3", title:"Open Your Calendar", format:"The Waiting List",
    cover:"covers/face-3.jpg",
    script:`You call it someday because a promise without a date on it can't be broken. That's the whole trick.

Someday I'll do the shoot. Someday I'll feel ready. Someday, once things settle down. Someday is the only appointment you can miss forever and never once feel like you missed it.

So do this with me right now. Open the calendar on your phone. I'm not asking you to book anything — I'm not asking you for a thing. Scroll forward three months and look at what is actually sitting there. Two dentist appointments and somebody else's game.

There is room. There has always been room. What there isn't is a date, and that is on purpose, because the second it has a date it can be broken, and broken feels worse than never scheduled at all.

So pick a day. Write anything on it. The thing I keep putting off. Whatever you want.

You don't owe me a booking. You owe yourself a date.`,
    caption:`Someday isn't a plan. It's the one promise you can keep breaking without ever feeling like you broke it — because there's no date on it. So open your calendar, scroll out three months, and look at what's genuinely there. Two dentist appointments and somebody else's game. There's room. There's always been room. Put a day on it and write whatever you want on that square — you don't owe me a booking, you owe yourself a date. When there's a real one on the calendar, my form is in my bio and I'm in South Bend.

#michianaboudoir #southbendphotographer #womenover40 #selfworth #boudoirphotography`
  },
  {
    n:"4", title:"In By Nine, Done By Three", format:"The Prep List",
    cover:"covers/face-4.jpg",
    script:`Here is your entire day with me, hour by hour, so you can stop imagining it.

Nine a.m. — you walk in. Nobody is rushing you, because you are the only woman on my calendar today.

Nine fifteen to about eleven — you're in the chair with Aletheia for hair and makeup. Most women tell me afterward this was the part they didn't know they needed. You sit. Somebody takes care of you. That's it.

Eleven to about twelve thirty — we shoot. Three outfits, three sets, roughly ninety minutes. I will tell you where to put every finger. You will never once have to work out what to do with your hands.

Twelve thirty — lunch. And while you're eating, I'm finishing your images. That is not a typo.

Between one and three — you sit down in front of a sixty-five inch screen and watch a hundred and thirty to a hundred and sixty finished photos of yourself come up in 4K.

That's the day. Screenshot it.`,
    caption:`The whole day, hour by hour, so you can stop guessing. 9:00 you walk in — one woman a day, nobody rushing. 9:15 to 11:00 hair and makeup with Aletheia. 11:00 to 12:30 we shoot: three outfits, three sets, about 90 minutes, and I direct every finger so you never have to wonder what to do with your hands. 12:30 lunch — and while you eat, I finish your editing. Between 1:00 and 3:00 you sit down and watch 130 to 160 finished images come up on a 65-inch screen in 4K, and you take them home the same day. In by nine, done by three. Screenshot it. South Bend studio, form in my bio.

#boudoirphotography #grangerindiana #southbendboudoir #samedayreveal #michianaphotographer`
  },
  {
    n:"5", title:"She Told Nobody", format:"Overheard in the Studio · BTS overlay", bts:true,
    cover:"covers/reel-5.jpg",
    screenTrial:`She booked this in secret and told nobody in her family. Six weeks later somebody in that family called me — and it isn't who you'd guess. The whole story is in the description.`,
    screenGrid:`She made me promise not to tell her family she'd been here. Six weeks later one of them booked the exact same session, for the exact same reason. I put the whole story in the caption.`,
    caption:`Here's the story I promised you.

She booked in secret. Paid on her own card, told her husband she had a work thing, and asked me twice — twice — to make sure nothing ever went online. She was fifty-two. She said she wanted to see herself one time before she stopped recognizing the woman in the mirror.

At the reveal she cried for about ten minutes and then said the line I still think about: "I wish somebody had told my mom she was allowed to do this."

Six weeks later my form came through with a name I recognized. Her daughter. Twenty-six. In the notes she wrote that her mom had shown her the album at the kitchen table and she'd never in her life seen her mother sit up that straight.

That's what nobody warns you about. You think you're booking a photoshoot for yourself, in secret, for one afternoon. What actually happens is somebody younger than you watches you decide you're worth it — and quietly gives herself permission to do the same. It skips a generation forward instead of backward.

If you're the woman who's been putting it off, the form is in my bio. Somebody is watching how you treat yourself.

#mishawakaindiana #boudoirphotographer #michianaboudoir #motherdaughter #southbendindiana`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body></html>
