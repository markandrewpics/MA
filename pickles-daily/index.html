<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Thursday, August 6, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": 1,
    "title": "There is no mini session",
    "cover": "covers/face-1.jpg",
    "format": "Studio Rule — Ep. 22",
    "script": "There is no mini session. There never will be.\nFor the first hour, you’re performing. Checking my face to see if you did it right, holding your stomach, apologising for things nobody noticed.\nThen somewhere around minute sixty-five, you forget I’m there.\nThat’s the woman I’m hired to photograph, and she has never once arrived early.\nSo no, there’s no thirty-minute option, and it isn’t because I’m precious about it. It’s arithmetic.\nThirty minutes buys you the half hour you were still pretending — printed, framed, and hung in your hallway.\nThe full day exists for exactly one reason: to outlast your own self-consciousness. Hair and makeup in the morning, three sets, lunch, and every finished image on the screen the same afternoon.\nNobody in this industry will tell you that the expensive part is the waiting.\nIt is.\nStudio rule twenty-two.",
    "caption": "Studio rule twenty-two: there is no mini session, and there never will be.\n\nNo thirty-minute option. No “quick” version. And it isn’t because I’m precious about it — it’s arithmetic.\n\nFor the first hour of a session, you are performing. Not on purpose. Everybody does it. You check my face to see whether you did it right, you hold your stomach, you apologise for things nobody noticed.\n\nThen somewhere around minute sixty-five, you forget I’m there.\n\nThat’s the woman I’m actually hired to photograph, and in eight years she has never once arrived early. Thirty minutes buys you the half hour you were still pretending, printed and framed.\n\nSo the day is long on purpose — hair and makeup, three sets, lunch, and every finished image on the screen that same afternoon. The expensive part isn’t the shooting. It’s the waiting.\n\nSouth Bend studio. The booking form is in my bio when you’re ready.\n\n#boudoirphotography #southbendphotographer #michianaphotographer #boudoirphotographer #indianaboudoir"
  },
  {
    "n": 2,
    "title": "The quiet is the point",
    "cover": "covers/face-2.jpg",
    "format": "Unpopular Opinion",
    "script": "Unpopular opinion — “empowering” is a dead word, and my own industry killed it.\nHere’s the honest version, and I’ll warn you now, it’s smaller than the marketing.\nIt’s the only two hours this year where nobody needs anything from you. Nobody’s asking where their shoes are.\nThat’s it. That’s the whole thing.\nEvery boudoir photographer on this app has “empowering” on their website. It was on mine. Say a word that many times and it stops carrying anything at all.\nAnd I know “nobody needs anything from you” sounds like less than empowering. It isn’t.\nAsk a woman who runs a house, a job, and everybody else’s calendar what two uninterrupted hours are actually worth, and watch her do the maths in her head.\nThe photographs are what you leave with.\nThe quiet is what you came for.\nNobody’s putting that on a website. It doesn’t sell as well as the big word.",
    "caption": "Unpopular opinion: “empowering” is a dead word, and my own industry killed it.\n\nEvery boudoir photographer on this app has it on their website. It was on mine. Say a word that many times and it stops carrying anything at all.\n\nSo here’s the honest version, and it’s smaller than the marketing:\n\nIt’s the only two hours this year where nobody needs anything from you. Nobody’s asking where their shoes are. Nobody needs a form signed, a ride, a decision, or dinner.\n\nThat’s it. That’s the whole thing.\n\nAnd I know that sounds like less. It isn’t. Ask any woman who runs a house, a job and everybody else’s calendar what two uninterrupted hours are worth, then watch her do the maths in her head.\n\nThe photographs are what you leave with. The quiet is what you came for. Nobody puts that on a website — it doesn’t sell as well as the big word.\n\n#boudoirphotographer #southbendboudoir #michianaphotographer #glamourphotography #mishawakaindiana"
  },
  {
    "n": 3,
    "title": "Don’t put it to a vote",
    "cover": "covers/face-3.jpg",
    "format": "The Prep List (after-care)",
    "script": "Four things nobody tells you about the forty-eight hours after a shoot like this.\nOne. You will come down. It’s a lot of attention in one day, and the quiet afterwards can feel strange. That’s not regret. That’s your nervous system putting the furniture back.\nTwo. Do not put the images to a vote. The group chat did not spend the day becoming this person.\nThree. Pick your favourite before you show a single soul, and write down one sentence about why. You will want that sentence in about a year.\nFour. The photograph you are least sure about on day one is the one you’ll want biggest by day thirty. Every single time. I have watched it happen for eight years and I have stopped being surprised by it.\nThat’s the list.\nScreenshot it — or send it to whoever’s shooting next month. She’s going to need number two more than she thinks.",
    "caption": "Four things nobody tells you about the 48 hours AFTER a shoot like this.\n\n1. You will come down. It’s a lot of attention in one day, and the quiet afterwards can feel strange. That is not regret. That’s your nervous system putting the furniture back.\n\n2. Do not put the images to a vote. The group chat did not spend the day becoming this person, and four people who love you will still pick the photo that photographs best instead of the one that felt like you.\n\n3. Pick your favourite before you show a single soul, and write down one sentence about why. You will want that sentence in about a year.\n\n4. The photograph you’re least sure about on day one is the one you’ll want biggest by day thirty. Every single time. Eight years in, I’ve stopped being surprised by it.\n\nScreenshot this — or send it to whoever’s shooting next month. She’s going to need number two more than she thinks.\n\n#boudoirphotography #southbendboudoir #boudoirphotographer #michianaphotographer #grangerindiana"
  },
  {
    "n": 4,
    "title": "Twenty years, handed back",
    "cover": "covers/face-4.jpg",
    "format": "The Waiting List",
    "script": "The last one’s bedroom has been clean for four months.\nYou’ve walked past that door maybe two hundred times and thought, I should really do something with that space.\nSo you did. New paint. A desk nobody sits at. A guest room for guests who come twice a year.\nYou got twenty years of your life handed back to you, and the first thing you did with it was redecorate a room nobody sleeps in.\nThere is nothing wrong with that. I mean that. It is a kind thing to do with grief.\nBut it isn’t the only thing on the table, and I think you already know that.\nHere’s what I’ve noticed, and I’ve noticed it a lot. Women come to me the year after the house goes quiet — and almost none of them say that’s why. They say it’s a birthday. An anniversary. A promise they made themselves once.\nIt’s the quiet. It’s always the quiet.\nYou spent twenty years being needed.\nYou’re allowed to spend one afternoon being seen.",
    "caption": "The last one’s bedroom has been clean for four months.\n\nYou’ve walked past that door maybe two hundred times and thought, I should really do something with that space. So you did. New paint. A desk nobody sits at. A guest room for guests who come twice a year.\n\nYou got twenty years of your life handed back to you, and the first thing you did with it was redecorate a room nobody sleeps in.\n\nThere is nothing wrong with that. I mean it — it’s a kind thing to do with grief. It just isn’t the only thing on the table, and I think you know that.\n\nHere’s what I’ve noticed, and I’ve noticed it a lot: women come to me the year after the house goes quiet, and almost none of them say that’s why. They say it’s a birthday. An anniversary. A promise they made themselves once.\n\nIt’s the quiet. It’s always the quiet.\n\nYou spent twenty years being needed. You’re allowed to spend one afternoon being seen.\n\nSouth Bend studio — the form’s in my bio whenever you’re ready.\n\n#boudoirphotography #michianawomen #southbendboudoir #boudoirphotographer #elkhartindiana"
  },
  {
    "n": 5,
    "title": "She booked the exact same shoot again",
    "cover": "covers/reel-5.jpg",
    "format": "Overheard in the Studio (story) — BTS overlay",
    "bts": true,
    "screenTrial": "She booked the exact same session again eleven months later. Same three outfits, same lighting, same order, same everything. I assumed she hated her first set of photographs — I was completely wrong, and the reason she actually gave me is in the description.",
    "screenGrid": "A client asked me to recreate her session from last year down to the lighting. I thought I was fixing something. I wasn’t — she was running a test, and I was the equipment. The whole story’s in the caption.",
    "caption": "She booked again eleven months to the week after her first session. Same three outfits. Same lighting. Same order, same lunch, same everything.\n\nI assumed it was a re-do — that she hadn’t liked her images and had been too polite to say so at the time. I offered to change the sets, bring in something new, shoot her somewhere else in the studio.\n\nShe said no. She said she needed it identical.\n\nAnd then she told me why: “I want to know if she’s still in there. If you change anything, I won’t know whether it was me or the lighting.”\n\nShe’d spent a year quietly wondering whether the woman in those photographs was real, or whether I’d just caught her on a good day and made her look like someone she isn’t. So she ran it again as a controlled experiment, and I was the equipment.\n\nShe was still in there. She was more in there.\n\nI’ve thought about that one all year. Most people assume a photoshoot is a record of how you look. She used hers as a way of checking on herself — and I don’t think she was wrong to.\n\nSouth Bend studio. The booking form’s in my bio.\n\n#boudoirphotographer #southbendboudoir #michianaphotographer #boudoirphotography #nilesmichigan"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body></html>
