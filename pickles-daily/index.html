<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Friday, August 21, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"The Sock Line", cover:"covers/face-1.jpg", format:"The Prep List",
    script:`Whatever you wear to my studio, you end up wearing in the photographs.
Not the clothes. The marks they leave.
You’re in the makeup chair for ninety minutes before I pick up a camera. A waistband, a bra band, the seam of a sock — any one of those presses a line into your skin that is still sitting there an hour later. And now it’s in the first set.
So come in something soft with nothing tight on it. Sweats. Pyjamas. Athleisure. Nobody in this building is grading you on it, and you’re changing out of it in twenty minutes anyway.
One more thing, and it’s the part people miss. Make the top one you can get off without dragging it over your face. Button-down. Zip-up. Wide neck. Because everything you arrive in has to come back off past finished hair and a full face of makeup, and that is not a thing we get to redo at ten-fifteen in the morning.
The clothes you weren’t going to be photographed in are still part of the shoot.`,
    caption:`Whatever you wear here, you wear in the photographs.

Not the clothes — the marks. You’re in the hair and makeup chair for about ninety minutes before I take a single frame, and a waistband or a bra band or the top of a sock will still be pressed into your skin when we start. It’s the one prep detail nobody thinks of, because it’s the outfit you weren’t planning to be photographed in.

So: something soft, nothing tight. Sweats, pyjamas, leggings — I genuinely do not care. And make the top one you can get out of without pulling it over your face. Button-down, zip-up, wide neck. Finished hair and makeup don’t survive a jumper.

Screenshot it for the morning of. There’s a full prep list in the booking form.

#boudoirphotography #southbendphotographer #michianawomen #boudoirprep #indianaboudoir`
  },
  {
    n:"2", title:"Simon Says", cover:"covers/face-2.jpg", format:"The Unpopular Opinion",
    script:`Unpopular opinion: if you’re trying to feel sexy in here, you’re going to hate the pictures.
Nobody in my studio is feeling sexy while I’m shooting. Nobody.
I run the room almost clinically. Chin down an inch. Weight onto the back foot. Shoulder toward me. Breathe all the way out — hold it — don’t move.
It’s Simon Says for ninety minutes, and that is the entire trick. You never have to perform anything, because you are far too busy following instructions to have a single thought about how you look doing it. The self-consciousness doesn’t get talked out of you. It just doesn’t get a turn.
Then at three o’clock you sit down in front of a sixty-five inch screen and find out how you looked the whole time.
And I’ll tell you what happens next, because it happens nearly every session. The pose that felt the most ridiculous is the one you buy.`,
    caption:`Unpopular opinion: nobody in my studio is feeling sexy while I’m shooting. That’s not the job.

The room runs almost clinically. Chin down an inch, weight to the back foot, shoulder toward me, breathe out, hold. Ninety minutes of Simon Says. And that’s the whole trick — you never have to perform anything, because you’re too busy following instructions to have a thought about how you look doing it.

The nerves don’t get talked out of you. They just don’t get a turn.

Then at three o’clock you sit down in front of the screen and find out how you actually looked. Every time, the pose that felt the most ridiculous is the one she takes home.

You do not have to arrive feeling like anything. You just have to follow directions.

#boudoirphotographer #southbendindiana #glamourphotography #mishawakaindiana #boudoirsession`
  },
  {
    n:"3", title:"It Comes Down", cover:"covers/face-3.jpg", format:"Studio Rule · Ep. 32",
    script:`You can have any photograph of you taken down. Any day. Forever. Studio rule number thirty-two.
If you ever change your mind about an image of yours that’s on my website, you tell me and it comes down that day. No reason required. No conversation about why. It does not matter if it’s been up four years.
Nothing goes up in the first place without your written consent. Your gallery is password-protected and encrypted. My own copies live on hard drives in this building — not in somebody else’s cloud.
Here’s why the rule exists. The biggest thing women don’t say out loud about booking a shoot like this isn’t the money, and it isn’t the outfits. It’s permanence. These exist now, and they exist forever, and I can’t take it back.
You can take it back. That’s the rule.
You are allowed to change your mind about this for the rest of your life.`,
    caption:`Studio rule 32: you can have it taken down. Any day. Forever.

If you ever change your mind about a photograph of yours on my site, you tell me and it’s gone that day. No reason required, no conversation about why, and it doesn’t matter if it’s been up four years.

For the record, that’s the last line of defence, not the first. Nothing goes up without your written consent. Your gallery is password protected and encrypted. My own copies sit on hard drives in this building, not in someone else’s cloud.

The objection nobody says out loud isn’t the money or the outfits. It’s permanence — these exist now, and they exist forever, and I can’t take it back.

You can take it back. That’s the whole point of the rule.

#boudoirstudio #southbendboudoir #michianaphotographer #womensportraits #grangerindiana`
  },
  {
    n:"4", title:"Ask My Husband First", cover:"covers/face-4.jpg", format:"The Waiting List",
    script:`“I have to ask my husband first.” Nobody says that about the dentist.
Nobody says it about a haircut. Nobody says it about a work trip, or the brakes on the car, or four hundred dollars of groceries on a Tuesday.
It comes out about exactly one thing in the whole year — the one thing that is entirely for her.
And I’ve stopped believing it’s about the money, because the same woman signed off on the last three things without asking anybody.
It’s about needing somebody else to say out loud that she’s allowed. That’s the actual permission being requested. And he isn’t going to say it — not because he’d object, but because in fifteen years he has never once been asked to approve anything else, so he has no idea he’s being handed something that big.
Here’s the part I didn’t expect. More often than not, she’s the one who ends up putting the album in his hands.`,
    caption:`“I have to ask my husband first.”

Nobody says that about the dentist. Or a haircut, or a work trip, or four hundred dollars of groceries on a Tuesday. It only ever comes out about the one thing in the year that’s entirely for her.

I stopped believing it was about the money a long time ago — the same woman signed off on the last three things without asking anyone. It’s about needing somebody else to say out loud that she’s allowed.

He isn’t going to say it. Not because he’d object. Because he’s never once been asked to approve anything else, so he has no idea he’s being handed something that big.

And more often than not, she’s the one who ends up putting the album in his hands.

#boudoirphotography #michianamoms #southbendindiana #womenover40 #elkhartindiana`
  },
  {
    n:"★", title:"The Makeup Chair", cover:"covers/reel-5.jpg", format:"Overheard in the Studio · BTS overlay", bts:true,
    screenTrial:`A woman said seven words in my makeup chair this week and then went quiet for the rest of it. I’m not going to say them here — they’re in the description.`,
    screenGrid:`The shoot hasn’t started. I haven’t picked up a camera yet. She’s already somewhere different — and I put the reason in the caption.`,
    caption:`The seven words: “Nobody’s done my hair since my wedding.”

She said it about twenty minutes into the makeup chair, almost to herself, and then she went quiet for the rest of it.

That chair is ninety minutes of somebody doing something to her instead of for somebody else. No one asking her a question. Nothing to organise. And most women genuinely have not sat still for that since the last time they got married — which for a lot of them was a decade and two kids ago.

The shoot hasn’t started. I haven’t picked up a camera. She’s already somewhere different by the time she walks to the first set, and you can see it in the frames.

People book this for the photographs. Half of what they actually remember is the chair.

#behindthescenes #boudoirphotographer #southbendphotographer #hairandmakeup #michianawomen`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
