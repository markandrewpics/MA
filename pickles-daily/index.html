<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Thursday, August 6, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": 1,
    "title": "There Is No Short Version",
    "cover": "covers/face-1.jpg",
    "format": "Studio Rule — Ep. 22",
    "script": "There is no mini session here, and there never will be.\nNo thirty-minute option. No quick version. I get asked for it most weeks and the answer has never moved.\nIt isn't because I'm precious about my calendar. It's because of what actually happens in the first hour.\nFor that first hour, you're performing. You're doing the face you do in photographs. You're apologising for your arms. You're asking me whether this looks stupid.\nThat's not a criticism — everybody does it. I do it when someone else points a camera at me.\nAnd then somewhere after that, you forget the camera is there. Your face goes quiet.\nThat is the part worth photographing. That's the whole job.\nYou cannot buy your way to it in thirty minutes. There's no version of this where you skip the part where you stop performing.\nSo it's the full day or it's nothing. Hair and makeup, three sets, lunch, and every finished image on the screen that same afternoon.\nStudio rule.",
    "caption": "There is no mini session. There never will be.\n\nI get asked for a thirty-minute version most weeks, and the answer has never changed — not because I'm precious about my time, but because of what the time is actually for.\n\nFor the first hour you are performing. You're doing your photo face, apologising for your arms, asking me if this looks stupid. Everybody does it. Then somewhere after that hour your face goes quiet, and you forget the camera is in the room.\n\nThat's the part worth photographing. That's the entire job. And there is no price that lets you skip it.\n\nSo it's the full day here. Hair and makeup, three sets, lunch, and every finished image on a sixty-five-inch screen the same afternoon you shoot.\n\nSouth Bend studio. One woman a day. Link in bio.\n\n#southbendboudoir #michianaphotographer #boudoirphotography #mishawakaindiana #grangerindiana"
  },
  {
    "n": 2,
    "title": "That Word Is Worn Out",
    "cover": "covers/face-2.jpg",
    "format": "Unpopular Opinion",
    "script": "Every boudoir photographer on this app is going to tell you it's empowering. I don't think that word means anything any more.\nIt's been said so many times, by so many people selling so many things, that it's gone soft. It's marketing now. You hear it and you skip it.\nSo here's the honest version, and I'll warn you — it's much smaller than the marketing.\nIt's the only two hours this year when nobody needs anything from you.\nNobody's asking where their shoes are. Nobody needs feeding. Your phone is face down. No one wants a decision from you.\nYou sit down, somebody does your hair, and for two hours the only person anyone is thinking about is you.\nThat's it. That's the whole thing.\nIt doesn't sound like much written down. And then women get in the car afterwards and can't explain to their husband why they're crying.\nIt turns out that's enormous.",
    "caption": "Every boudoir photographer on this app will tell you it's empowering. I think that word is worn out.\n\nIt's been used by too many people selling too many things. You hear it and you skip straight past it.\n\nSo here's my honest version, and it is much smaller than the marketing: it is the only two hours this year when nobody needs anything from you.\n\nNobody asking where their shoes are. Nobody needing feeding. Phone face down. No decisions required from you about anything. You sit down, somebody does your hair, and for two hours the only person in the room anyone is thinking about is you.\n\nThat's it. That's the whole thing.\n\nIt doesn't sound like much typed out. Then women get in the car afterwards and can't explain to their husband why they're crying.\n\nTurns out that's enormous.\n\n#southbendboudoir #boudoirphotography #michianaphotographer #elkhartindiana #mishawakaindiana"
  },
  {
    "n": 3,
    "title": "The Room Nobody Sleeps In",
    "cover": "covers/face-3.jpg",
    "format": "The Waiting List",
    "script": "The last one's bedroom has been clean for four months now.\nYou've walked past that door maybe two hundred times. Every single time you've thought, I should really do something with that space.\nSo you did. You painted it. You put a chair in there that nobody sits in. Maybe it's an office now, technically.\nHere's what I actually want to say to you.\nYou just got about twenty years of your life handed back to you — and the first thing you did with it was redecorate a room nobody sleeps in.\nThere is nothing wrong with that. I mean it. It's a fine thing to do with a Saturday.\nIt's just not the only thing on the table. And you already know that, or you'd have scrolled past this by now.\nYou have been photographed at every stage of everybody else's life. Their graduations. Their weddings. Always slightly at the edge of the frame, always holding somebody's coat.\nThere's nobody's coat to hold now.\nThat's the part I'd think about, if I were you.",
    "caption": "The last one's bedroom has been clean for four months.\n\nYou've walked past that door two hundred times thinking you should really do something with the space. So you did — painted it, put a chair in there nobody sits in, called it an office.\n\nYou got roughly twenty years of your life handed back to you, and the first thing you did with it was redecorate a room nobody sleeps in.\n\nThere is nothing wrong with that. It's a perfectly good way to spend a Saturday. It's just not the only thing on the table, and I think you know that already.\n\nYou've been photographed at every stage of everyone else's life. Their graduations, their weddings — always slightly at the edge of the frame, always holding somebody's coat.\n\nThere's nobody's coat to hold now.\n\nThat's the part I'd think about.\n\n#southbendboudoir #michianaphotographer #emptynest #grangerindiana #boudoirphotography"
  },
  {
    "n": 4,
    "title": "She Booked The Exact Same Day Twice",
    "cover": "covers/face-4.jpg",
    "format": "Overheard in the Studio",
    "script": "She booked the exact same session again eleven months later. Same three sets, same lighting, same everything — she had the list from last time.\nI assumed she was unhappy. That's the only reason I could think of for wanting an identical day: something went wrong the first time and she wanted it fixed.\nSo I asked her, straight out, before we started. What didn't work last year?\nShe said everything worked. That wasn't it at all.\nShe said she'd had a hard year. And she wanted to know whether the woman from last August was still in there — or whether that had been a one-off, a good hair day, a trick of the lighting.\nAnd the only way to know for certain was to make the conditions identical. Same room. Same lights. Same three outfits. Change one variable: her.\nSo that's what we did.\nShe was still in there.\nShe's booked for next August.",
    "caption": "She rebooked the exact same session eleven months later. Same three sets, same lighting, same everything — she still had the list.\n\nI assumed something had gone wrong the first time. That's the only reason I could think of for wanting an identical day. So I asked her before we started: what didn't work last year?\n\nShe said everything worked. That wasn't it.\n\nShe'd had a hard year. And she wanted to know whether the woman from last August was still in there, or whether that had been a one-off — a good hair day, a trick of the light.\n\nThe only way to know for sure was to make everything identical. Same room, same lights, same three outfits. Change one variable: her.\n\nShe was still in there.\n\nShe's booked for next August.\n\n#southbendboudoir #boudoirphotography #michianaphotographer #mishawakaindiana #nilesmichigan"
  },
  {
    "n": 5,
    "title": "The Forty-Eight Hours After",
    "cover": "covers/reel-5.jpg",
    "format": "Prep List (BTS overlay)",
    "bts": true,
    "screenTrial": "Nobody warns you about the 48 hours AFTER a shoot like this. All four are in the description.",
    "screenGrid": "The mistake almost everyone makes in the first 24 hours after their session — it's in the description.",
    "caption": "Four things nobody tells you about the forty-eight hours after a shoot like this.\n\nOne. You'll come down. It is a lot of attention in one day, and the quiet afterwards can feel strange. That's normal — it isn't regret.\n\nTwo. Do not put the images to a vote. The group chat did not spend the day becoming this person.\n\nThree. Pick your favourite before you show a single soul, and write down why. One sentence is enough. You'll want it later.\n\nFour. The photo you're least sure about on day one is the one you'll want biggest on day thirty. Every single time.\n\nScreenshot this and send it to whoever's shooting next month.\n\n#southbendboudoir #boudoirphotography #michianaphotographer #grangerindiana #elkhartindiana"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body></html>
