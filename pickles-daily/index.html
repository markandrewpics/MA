<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Tuesday, August 25, 2026 \u2014 film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": 1,
    "title": "None Of It Is Binding",
    "cover": "covers/face-1.jpg",
    "format": "The Studio Rule — Ep. 34",
    "script": "You are allowed to change your mind halfway through.\n\nA questionnaire goes out a couple of days before your session — how much skin, how edgy, what you're actually comfortable with — and I want you to answer it honestly. And then I want you to know that none of it is binding.\n\nIf you get to the second set and you want it tamer, we go tamer. If you get to the second set and you want it bolder, we go bolder. You don't have to explain it, and I'm not going to ask you to.\n\nHere's why that rule exists. The woman filling out that form is sitting at her kitchen table in Granger at nine at night, guessing what a version of herself she has never met is going to want. She isn't wrong. She just hasn't met her yet.\n\nYou get to meet her at eleven in the morning. And then you get to decide.\n\nStudio rule.",
    "caption": "You are allowed to change your mind halfway through.\n\nThe comfort questionnaire goes out a couple of days before your session — how much skin, how edgy, where your line is. Answer it honestly. Then forget it, because it binds you to nothing. Tamer at the second set, we go tamer. Bolder, we go bolder. No explanation required and none requested.\n\nBecause the woman answering that form at her kitchen table at nine at night is guessing about somebody she hasn't met yet. She gets to show up at eleven in the morning and decide in the room.\n\nI think most of this industry has that backwards — they ask you to commit to a version of yourself before you've seen her. Tell me I'm wrong.\n\n#southbendboudoir #boudoirphotographer #michiana #grangerindiana #boudoirphotography"
  },
  {
    "n": 2,
    "title": "There's A Second Edit",
    "cover": "covers/face-2.jpg",
    "format": "The Unpopular Opinion",
    "script": "Unpopular opinion: the photographs you pick at your reveal are not the finished photographs.\n\nThey are finished enough to buy — that is the entire point of getting it right in the camera instead of fixing it for three weeks afterwards. You sit down at one o'clock, you see about a hundred and forty fully edited images on a sixty-five inch screen, and whatever you buy, you take home that afternoon.\n\nBut roughly a week later my retoucher sends them back polished. Backdrops extended. Light stands taken out of the corners. The one stray hair across your cheek that neither of us noticed at three in the afternoon, because we were both looking at your face.\n\nNobody in this industry mentions there's a second pass.\n\nI suspect that's because most of them are still stuck on the first one.",
    "caption": "The photographs you choose at your reveal are not the finished photographs.\n\nThey're finished enough to buy, and that is the whole point of shooting it print-ready instead of editing for three weeks. One o'clock, a hundred and forty images, a sixty-five inch screen, and you carry home whatever you buy that same afternoon.\n\nThen about a week later my retoucher sends them back polished. Backdrops extended past the frame. Light stands lifted out of the corners. The stray hair on your cheek that neither of us saw at three in the afternoon because we were both looking at your face.\n\nNobody advertises the second pass. My honest read is that most studios don't have one, because they're still finishing the first.\n\nAm I being unfair to them, or has anybody actually been told about a second edit? I'd genuinely like to know.\n\n#michianaboudoir #samedayreveal #boudoirphotographer #southbendindiana #boudoirphotography"
  },
  {
    "n": 3,
    "title": "She Asks Like It's A Favour",
    "cover": "covers/face-3.jpg",
    "format": "Overheard In The Studio",
    "script": "\"Can he be in it?\"\n\nShe always asks it like she's asking me for a favour. Quietly. Usually right at the end of the planning call, like she's been working up to it. As though there's a line item for him somewhere.\n\nThere isn't. Partners are photographed at no extra charge, and the rule in this building is about as simple as a rule gets: if you're in the picture, you're allowed to stay.\n\nSo he turns up in a shirt he ironed himself, and for about ten minutes he is genuinely terrible. Stiff shoulders. Asking me where his hands go. Making a joke every single time I lift the camera.\n\nAnd then somewhere in the second set he forgets I'm in the room. He stops posing. He just looks at her.\n\nThat's the frame she buys. Every time. Not the ones where they were both doing it properly — the one where neither of them was thinking about the camera at all.",
    "caption": "\"Can he be in it?\"\n\nAsked quietly, almost always at the end of the planning call, like it's a favour she's working up to. Like there's a line item for him.\n\nThere isn't one. Partners are photographed at no additional charge, and the studio rule is exactly one sentence long: if you're in the picture, you're allowed to stay.\n\nHe shows up in a shirt he ironed himself and he is dreadful for ten minutes — stiff shoulders, asking where his hands go, cracking a joke every time the camera comes up. Then somewhere in the second set he forgets I'm in the room, stops performing, and just looks at her.\n\nThat is the photograph she buys. Not the ones where they were both doing it correctly.\n\nWould you actually want him in the room for yours, or is this entirely your day? Both answers are right and I'm curious which way this lands.\n\n#southbendboudoir #couplesboudoir #michianaboudoir #mishawakaindiana #boudoirphotography"
  },
  {
    "n": 4,
    "title": "One Woman I Can't Help",
    "cover": "covers/face-4.jpg",
    "format": "The Waiting List",
    "script": "There is exactly one woman I can't photograph well, and it is not the one you're thinking of.\n\nIt isn't a size. I have photographed every size there is, and the pictures were good every time.\n\nIt isn't an age. The most nervous woman in this studio is almost never the oldest one in it.\n\nIt isn't the woman who tells me on the phone that she has no idea how to pose. That's nearly everybody who calls me. Posing is my job. It was never yours.\n\nIt's the woman who arrives determined to be right about herself. She decided a long time ago, and she came here hoping to have it confirmed.\n\nI can direct you. I can light you. I can hand you a hundred and forty photographs at three in the afternoon that argue the exact opposite.\n\nI cannot make you willing to look at them.\n\nThat's the only part of this that was ever yours.",
    "caption": "There is exactly one woman I can't photograph well, and she isn't the one you're picturing.\n\nNot a size — I've photographed every size there is and the pictures were good every time. Not an age; the most nervous woman in the room is almost never the oldest one in it. Not the woman who rings me and apologises for having no idea how to pose, because that's nearly every call I take, and posing was always my job.\n\nIt's the woman who walks in already determined to be right about herself. She decided years ago and she came here to have it confirmed.\n\nI can direct you. I can light you. I can hand you a hundred and forty photographs at three in the afternoon that argue the exact opposite of everything you believe.\n\nI can't make you willing to look at them. That part was always yours.\n\nWhat's the story you've decided is true about how you photograph? Say it here — I'll tell you honestly whether I've seen it hold up.\n\n#michianaboudoir #southbendphotographer #boudoirphotographer #elkhartindiana #boudoirphotography"
  },
  {
    "n": "★",
    "title": "Book The Whole Day Off",
    "cover": "covers/reel-5.jpg",
    "format": "The Prep List · BTS overlay",
    "bts": true,
    "screenTrial": "The women who never quite land in this all made the same calendar mistake before they arrived. I put the fix in the description.",
    "screenGrid": "There's one line on my prep list that has nothing to do with what you wear. It's the one nobody follows. I put it in the caption.",
    "caption": "Book the whole day off work. Not the morning — the day.\n\nHere's what you're actually booking. You arrive at nine. You're in hair and makeup until about half ten, and that hour and a half is the part every woman tells me she wasn't expecting to enjoy. Three sets, three looks, about ninety minutes in front of the camera. Then lunch, which you eat while I edit. And you sit down and see your finished photographs before four o'clock.\n\nI shoot Monday to Friday and I only book one woman a day, so there is no next appointment to move you along for. Nothing about this runs late, because nothing else is scheduled.\n\nThe women who try to wedge this between a school run and a two o'clock meeting are the ones who never quite land in it. They're still holding the day. You can't be photographed properly while you're holding a day.\n\nPut it in the calendar as a day off. Not an appointment.\n\nGenuinely asking: when did you last take a whole day off work for something that was only yours?\n\n#southbendboudoir #boudoirphotographer #michiana #nilesmichigan #boudoirphotography"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
