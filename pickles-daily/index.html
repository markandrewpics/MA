<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Friday, July 31, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": 1,
    "title": "I Don't Fix It Later",
    "cover": "covers/face-1.jpg",
    "format": "Studio Rule — Ep. 19",
    "script": "I don't fix it later.\nIf the light isn't right, we shoot it again while you're standing there — because there is no “later” in my studio.\nMost photographers shoot fast and sort it out in editing. That is exactly why you wait two to four weeks to see anything.\nI do it the other way around. I get it right in the camera, in the room, with you still in front of me.\nSo if a shadow is falling wrong across your collarbone, I move the light and we go again. It costs us ninety seconds.\nThat is not me being precious.\nThat is the only reason your finished images are ready by the time you get back from lunch.\nBetween one and three, you sit down and watch a hundred and thirty to a hundred and sixty finished photographs come up on a sixty-five inch screen. Same day. Yours.\nYou cannot do that if you are planning to fix it later.\nSo I don't. Studio rule.",
    "caption": "Two to four weeks is not a turnaround time. It is a symptom.\n\nIf a photographer plans to fix it in editing, editing is where your images go to sit. I shoot print-ready in the camera — which means if something is off, we fix it while you are standing right there, not three weeks later at a desk.\n\nThat is the whole mechanism behind the same-day reveal. You eat lunch, I finish your gallery, and between 1 and 3 you watch 130–160 finished images come up on a 65-inch screen.\n\nSouth Bend, Mishawaka, Granger, Elkhart — you drive home the same day having already seen everything.\n\n#southbendboudoir #michianaphotographer #boudoirphotography #samedayreveal #mishawakaindiana"
  },
  {
    "n": 2,
    "title": "Nobody Asks To Golf",
    "cover": "covers/face-2.jpg",
    "format": "Unpopular Opinion",
    "script": "“Allow” is a strange word for a grown woman to use.\nI hear it more than you would think. “I don't know if my husband would allow it.”\nAnd I have never once heard a man tell me he isn't sure his wife would allow him to golf on Saturday.\nSo here is my unpopular opinion. If the word “allow” is in the sentence, the photoshoot is not the conversation you need to be having.\nBecause it is almost never actually about the photographs. Nobody on earth is genuinely frightened of a picture.\nWhat I usually find underneath it is a woman who has spent fifteen years running every single thing she wants past somebody else first, and calling that being considerate.\nTell him. Absolutely tell him — that is a partnership, and I would expect nothing less.\nBut “I'm going to do this” and “is this okay” are two completely different sentences.\nOnly one of them belongs to a grown woman.\nYou're not asking for the car keys.",
    "caption": "“I don't know if my husband would allow it.”\n\nI have never had a man ask me whether his wife would allow him to golf.\n\nTelling your partner is a partnership. Asking permission is something else, and most of the women who say it out loud hear it for the first time in that moment. It usually is not about the photos at all — it is fifteen years of running everything past somebody else first and calling it being considerate.\n\nYou're not asking for the car keys.\n\n#southbendboudoir #boudoirphotographer #michiana #womenover40 #grangerindiana"
  },
  {
    "n": 3,
    "title": "One Sentence, Four Outfits",
    "cover": "covers/face-3.jpg",
    "format": "The Waiting List",
    "script": "Four sentences you have said this year.\n“Once the kids are back in school.”\n“Once I'm back to my normal weight.”\n“Once work slows down.”\n“Once I feel more like myself.”\nThose are not four reasons. That is one sentence wearing four different outfits, and the sentence is “not yet.”\nHere is the thing about “not yet.” It never expires on its own. Look at that list again — not one of them has a date attached. That is the entire design.\nThe kids go back, and then it's the holidays. Work slows down, and then it picks up.\nAnd feeling more like yourself is not something that arrives in the mail. It is usually something that happens on the other side of doing something like this, not before it.\nEight hundred and fifty women have sat down at my reveal.\nNot one of them has ever told me she wished she had waited longer.\nPick one of those four sentences. Put a date on it.\nThat is the only thing that has ever killed “not yet.”",
    "caption": "“Once the kids are back in school.”\n“Once I'm back to my normal weight.”\n“Once work slows down.”\n“Once I feel more like myself.”\n\nFour sentences, one meaning. Not one of them has a date attached — that's the design. “Not yet” never expires on its own.\n\n850 women have sat down at my reveal. Not one has ever told me she wished she'd waited longer.\n\nPick one of those sentences and put a date on it. That's the only thing that kills it.\n\n#southbendboudoir #michianaboudoir #boudoirphotography #womensconfidence #elkhartindiana"
  },
  {
    "n": 4,
    "title": "Eleven Years In A Drawer",
    "cover": "covers/face-4.jpg",
    "format": "Overheard in the Studio (STORY)",
    "script": "She brought her grandmother's necklace to the studio in a sandwich bag.\nZip-top. Folded over twice. She set it down on the makeup counter like it was evidence.\nSo I asked her how often she wears it.\nTwice. In eleven years.\n“I'm saving it for something worth it.”\nWe shot one full set with it on. Black backdrop, hard light, that necklace doing exactly what her grandmother's jewelry was built to do in the first place.\nAt the reveal she went through about a hundred and forty images and then stopped dead on that frame. Didn't say anything for a long moment.\nThen she said, “It's been in a drawer for eleven years waiting for something worth it.”\nAnd then, quieter — “so have I.”\nThat is the whole thing. It was never really about the necklace.\nThere is something in your house right now that you are saving. A dress. A room. A Saturday.\nNone of it is getting more worth it in there.",
    "caption": "She brought her grandmother's necklace in a sandwich bag. Zip-top, folded over twice.\n\nShe'd worn it twice in eleven years. “I'm saving it for something worth it.”\n\nWe shot a full set with it on. At the reveal she stopped on that frame and said, “It's been in a drawer for eleven years waiting for something worth it.” Then, quieter: “so have I.”\n\nThere's something in your house you're saving too. A dress. A room. A Saturday. It isn't getting more worth it in there.\n\n#southbendboudoir #michianaphotographer #boudoirphotography #womenover40 #nilesmichigan"
  },
  {
    "n": 5,
    "title": "Leave The Bag By The Door",
    "cover": "covers/reel-5.jpg",
    "format": "The Prep List (myth-bust)",
    "bts": true,
    "screenTrial": "There is one thing almost every woman does the night before her shoot that quietly works against her on camera. It is not what you'd guess — I put the whole list in the description.",
    "screenGrid": "There is a shopping bag by your front door that you bought specifically for this. Leave it there. Why — and what actually wins instead — is in the caption.",
    "caption": "Do not wear brand-new lingerie to your session.\n\nI know that sounds backwards. Here's what happens: a piece you've never worn pinches somewhere you didn't expect, gaps somewhere you can't see, and rides up the second you move. And every single one of those shows up on your face, not on the fabric. It reads as nerves on camera, and nerves are the one thing I can't retouch.\n\nThe outfit that wins reveals is almost always the one that already knows your body.\n\nSo: wear it around the house for an hour first. If it pinches, it's out. Bring the thing you already reach for. Fit beats new, every single time — and if you do buy something, buy it two weeks out, not two days.\n\nSouth Bend, Mishawaka, Granger, Elkhart, Niles.\n\n#southbendboudoir #boudoirprep #michianaboudoir #whattowear #grangerindiana"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body></html>
