<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Tuesday, September 2, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Ask Him What His Rules Are", cover:"covers/face-1.jpg", format:"Unpopular Opinion",
    script:`Unpopular opinion: you do not need a woman to photograph you.
I understand the instinct completely, and I would never argue with a woman who wants one. But the thing that makes a room safe isn't the photographer's gender. It's the rules.
Here's what safe actually looks like, written down. Nobody who isn't being photographed is in my studio. Your hair and makeup artist is here the entire day, start to finish. A questionnaire goes out before you ever arrive, and you can change your mind halfway through filling it out. Nothing goes online without your written consent, and it comes down the day you ask.
None of that has anything to do with who's holding the camera. All of it was decided before you got here.
So ask. Ask whoever you're considering what their rules are, and watch how many of them have to invent one on the spot.
Safety is a policy. It isn't a chromosome.`,
    caption:`I get asked constantly whether women should only book a female boudoir photographer, and my honest answer isn't the popular one. Gender isn't what makes a studio safe. Written rules are. Nobody in the room who isn't being photographed. Your artist here the whole day. A questionnaire you're allowed to change your mind inside of. Nothing published without written consent, and it comes down the day you ask. Every one of those exists in my studio in writing, and not one of them depends on who I am. If a photographer has to think before telling you their rules, that's your answer. So ask the ones you're considering — me included. The form's in my bio.

#southbendphotographer #boudoirphotography #michiana #boudoirsouthbend #womenover40`
  },
  {
    n:"2", title:"Your Hands Gave You Away", cover:"covers/face-2.jpg", format:"Overheard in the Studio",
    script:`"What am I supposed to do with my hands?"
Every woman asks it. Usually in the first five minutes, usually while she's holding them out in front of her like they belong to somebody else.
And it's a tell. It means the last time somebody photographed her, they raised a camera, said "just be natural," and left her standing there failing a test nobody ever taught her for.
Hands are where a person keeps their nerves. Watch anybody uncomfortable in a room — it shows up in the hands long before it shows up in the face.
So here's the actual answer. You don't have to know. Knowing is my entire job. I'll tell you where every finger goes, on every set, all day — where your weight sits, where your chin goes, what to do with the arm you're convinced looks wrong.
Nobody walks in knowing how to be photographed.
And if you've been photographed before and nobody told you, that wasn't you being bad at this.`,
    caption:`"What am I supposed to do with my hands?" I hear it in the first five minutes of nearly every session, and it always tells me the same thing — somebody once handed her a camera-shaped test and never taught her the material. Hands are where we keep our nerves. They go stiff long before the face does. You are not supposed to arrive knowing how to be photographed. That is the entire job you're hiring me for: every finger, every set, all day, out loud. So if you've been photographed before and walked away feeling like you were bad at it, I'd argue you were never the problem — your photographer just didn't do their half. The form's in my bio.

#boudoirphotography #michianaphotographer #southbendindiana #boudoirposing #firsttimeboudoir`
  },
  {
    n:"3", title:"Somebody Filmed Her Session", cover:"covers/face-3.jpg", format:"Studio Rule · Ep. 42",
    script:`Nobody films in my studio unless you said yes first. Studio rule, episode forty-two.
Every so often there's a behind-the-scenes creator on a shoot day. If you haven't been told about it and agreed to it before you arrive, they are not in the building. That isn't negotiable, and it is never a surprise.
And it isn't a form you skim at the door while you're already half-changed. You get asked on a call, days ahead, with time to think it over. No is a complete answer, and it costs you nothing — not the date, not the day, not one degree of how you get treated once you're here.
Half this industry runs on client sessions being content. Your afternoon is somebody's reel.
Yours is not my marketing.
Ask whoever you're considering what happens to the footage of you that you never see. If they have to think about it, you already have your answer.`,
    caption:`Studio rule forty-two: nobody films in my studio unless you said yes first — on a call, days ahead, with room to say no. Occasionally there's a behind-the-scenes creator on a shoot day, and if that hasn't been agreed before you arrive, they are not in the building. It's not a form you sign at the door while you're already half-changed. Saying no costs you nothing: not the date, not the day, not one degree of how you're treated once you're here. Half this industry quietly runs on client sessions being content. Yours is not my marketing. Ask any photographer you're considering what happens to the footage of you that you never get to see — I think their answer tells you more than their portfolio does. Form's in my bio.

#boudoirphotographer #southbendphotographer #michiana #grangerindiana #boudoirstudio`
  },
  {
    n:"4", title:"There Is No Quiet Year Coming", cover:"covers/face-4.jpg", format:"The Waiting List",
    script:`You will never be less busy than you are right now.
That isn't a motivational line. It's arithmetic. The calendar doesn't empty out — it only changes what's written on it.
"When things settle down" is a date that has never once arrived for any woman who told me she was waiting on it. Not one, and I've heard it hundreds of times in this room.
The kids get older and they get louder. Work gets bigger, not smaller. Your parents get older too, and that arrives with a calendar of its own.
There is no quiet year coming. There's no season up ahead where nobody needs anything, the house is finally clean, and you feel ready.
There's this one. Where you take the afternoon anyway.
You will not find the time. Nobody finds it. You take it out of something else — exactly the way you've taken it out of yourself, for everybody else, for fifteen years.`,
    caption:`"When things settle down." I've heard it from hundreds of women in this studio and I have never once met the one it actually happened for. The calendar doesn't empty out, it just changes what's written on it. Kids get louder. Work gets bigger. Parents get older, and that comes with a calendar of its own. There is no quiet year up ahead where nobody needs anything and you've finally earned an afternoon that's only yours. Nobody finds the time for this. You take it out of something else — the same way you've taken it out of yourself, for everyone else, for fifteen years. I'd call that overdue rather than selfish, and I know plenty of people would argue with me on it. When you're ready, the form's in my bio.

#boudoirphotography #southbendphotographer #michianamoms #womenover40 #mishawakaindiana`
  },
  {
    n:"5", title:"The Month Before", cover:"covers/reel-5.jpg", format:"The Prep List · BTS overlay", bts:true,
    screenTrial:`There's one thing women do in the month before a shoot that I can't fix in editing, and it's already too late by the time she walks in. I put the whole list in the description.`,
    screenGrid:`Three things on this list all do the same thing to your skin, and it lasts about four weeks. The full list is in the caption.`,
    caption:`Don't get a new tattoo in the month before your session. Not a small one, not a fine-line one. It's an open wound — raised, shiny, red at the edges — and it photographs as exactly that for about four weeks. Same story with a sunburn. Same with waxing the day before. Anything that leaves your skin healing turns up in every frame, on every set, all day, and it's the one thing I can't light or edit my way out of. If it's already done or already booked, tell me and we'll shoot around it — I'd just rather you knew before the needle than after. The tattoo will still be there in a month. The date might not. Form's in my bio.

#boudoirprep #boudoirphotography #southbendphotographer #michiana #boudoirtips`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
