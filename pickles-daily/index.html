<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Wednesday, August 12, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Nobody Has Ever Asked Me This", format:"The Studio Rule · Ep. 26", cover:"covers/face-1.jpg",
    script:`You are never alone in a room with me. Not for one minute of the day.
The artist who does your hair and makeup stays for the entire session. Every outfit change, every set, the whole nine hours. She is here at nine in the morning and she is still here at the reveal.
And once you are in front of the camera she is not my assistant anymore. She is yours. She fixes the strap you cannot see. She tells you the truth when you ask how you look. She is the second woman in the room and she is on your side.
Here is the part that matters. Nobody has ever asked me for that rule. Not one woman in eight hundred and fifty sessions has called and said, will there be somebody else there.
They think it. They just do not ask.
A rule you should not have to request is not a favor. It is the floor.
Studio rule.`,
    caption:`You are never alone in a room with me. The artist who does your hair and makeup stays the entire day — every outfit change, every set, right through to the reveal — and the second you are in front of the camera she stops being my assistant and becomes yours.

Nobody has ever called and asked me for that. Not once. Which is exactly why it exists: a rule you should have to ask for is not a rule, it is a favor.

The form is in my bio when you want the date.

#southbendphotographer #boudoirphotography #michiana #womenover40 #mishawakaindiana`
  },
  {
    n:"2", title:"Your Front Camera Has Been Lying", format:"The Unpopular Opinion", cover:"covers/face-2.jpg",
    script:`You do not hate your face. You hate a wide lens held twelve inches away from it.
Unpopular opinion, but every photograph you have taken of yourself for the last ten years was made with the single worst tool on earth for a human face. A front camera is wide. Wide lenses push whatever is closest to them forward and flatten everything behind, so your nose comes toward the camera and your cheekbones fall away.
And off the back of ten thousand of those, you decided you were not photogenic.
You were not judging your face. You were judging distortion.
I photograph you from eight feet back with a long lens. Everything sits where it actually sits. That is not flattery and it is not retouching — it is geometry, and it is the same geometry every woman on a magazine cover got.
Go take one selfie at arm's length, then one from across the room. Same face. Two different women.
Only one of them is you.`,
    caption:`You do not hate your face. You hate a wide lens twelve inches from it.

A front camera pushes whatever is closest to it forward and flattens everything behind. Ten years of that is the entire evidence file you built the words “I am not photogenic” out of. You were not judging your face. You were judging distortion.

I photograph from eight feet back with a long lens. Nothing is flattered and nothing is reshaped — things just sit where they actually sit.

Try it tonight: one selfie at arm's length, one from across the room. Same face. Tell me which one you have been believing.

#boudoirphotographer #southbendindiana #glamourphotography #michianaphotographer #selfconfidence`
  },
  {
    n:"3", title:"Three Days. That Is The List.", format:"The Prep List", cover:"covers/face-3.jpg",
    script:`Everything that actually matters before your session happens on exactly three days. The rest is noise.
Five days out. Wax, if you are waxing. Five days, not the day before — skin needs the time to calm down, and hard light finds irritation before it finds anything else in the frame.
The night before. Fresh razor if you are shaving. Wash your hair and let it dry all the way, actually all the way. And moisturize everywhere, properly, not the token bit on your arms.
The morning of. Clean face, dry hair, nothing else. No primer, no tinted moisturizer, no just-a-little mascara. I know it feels wrong to walk in bare in front of strangers. You are arriving as the raw material, and the artist cannot build a face on top of somebody else's start.
That is the whole list. Three days.
Nothing else on your calendar changes a single frame.
Screenshot this one.`,
    caption:`Everything that actually matters before your session happens on three days. Everything else you have been told is noise.

Five days out — wax, if you are waxing. Five days, not the day before. Skin needs time to settle and hard light finds irritation before it finds anything else.

The night before — fresh razor, hair washed and dried all the way, moisturize everywhere and properly.

The morning of — clean face, dry hair, nothing else. No primer, no tinted moisturizer, no just-a-little mascara. You are arriving as the raw material; the artist cannot build on somebody else's start.

Screenshot it. The form is in my bio when you are ready for the date.

#boudoirphotography #southbendphotographer #michiana #grangerindiana #photoshootprep`
  },
  {
    n:"4", title:"Your Camera Roll Is Not Evidence", format:"The Waiting List", cover:"covers/face-4.jpg",
    script:`Every photograph of you that exists was taken by somebody who was not really looking.
Your husband, one-handed, mid-sentence, because you asked him to — and he loves you, and he took it in about a second and a half.
A kid at knee height with your chin in the middle of the frame.
A stranger at a wedding who took one, checked nothing, and handed the phone straight back.
That is your entire photographic record. Twenty years of it. And you have been using it as evidence. About your face, about your body, about whether you are the kind of woman photographs work on.
It is not evidence. Nobody in a single one of those pictures was looking at you. They were pointing a phone in your direction while they thought about something else.
You have never once been photographed by somebody whose whole job that day was to look at you. Not glance. Look.
So you do not actually know what you look like yet.
You know what you look like to people in a hurry.`,
    caption:`Every photograph of you that exists was taken by somebody who was not really looking.

Your husband, one-handed, because you asked him to. A kid at knee height. A stranger at a wedding who took one and handed the phone straight back. Twenty years of that is your entire photographic record — and you have been treating it as evidence about your own face.

It is not evidence. Not one of those people was looking at you. They were pointing a phone in your direction while thinking about something else.

You have never been photographed by somebody whose whole job that day was to look at you. Not glance. Look.

The form is in my bio.

#michianaphotographer #boudoirphotography #southbendindiana #womenover40 #selfworth`
  },
  {
    n:"★", title:"Make Me Look Like Her", format:"BTS Overlay · Overheard in the Studio · text over you working", cover:"covers/reel-5.jpg", bts:true,
    screenTrial:`There is one sentence women say in my studio more than any other, and it is always about somebody else's photograph. What I tell them is in the description.`,
    screenGrid:`She pointed at the photo on my wall and said “can you make me look like her.” What I did not tell her that day is in the caption.`,
    caption:`“Can you make me look like her.”

Every woman who says that is pointing at a photograph of a woman who stood in this exact spot and pointed at a different photograph on the same wall.

Not one of them walked in here already believing it. The one on the wall did not either. She apologized for her face before she got through the door, same as everybody.

That is not a look you are born with and it is not a look I put on you in editing. That is just what a person looks like after somebody has spent a whole day paying attention to her.

Nine hours from now, somebody will point at yours.

The form is in my bio.

#boudoirphotographer #southbendphotographer #glamourphotography #michiana #nilesmichigan`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>

</body></html>
