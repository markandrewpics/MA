<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Monday, August 17, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"The Leg Opening Is The Whole Garment", cover:"covers/face-1.jpg", format:"The Prep List",
    script:`If you're bringing a bodysuit, the only thing that matters is where the leg is cut.
Not the colour. Not the lace. Not what size the tag says. The leg opening.
Cut low, straight across the top of your thigh, and it stops your leg dead at the widest point it will ever be. That's it. The line ends there.
Cut high — up over the hip bone — and the line runs from your foot all the way to your waist. Same body. Same piece. One seam's difference.
Nobody sells it to you that way, because "high cut" sounds like it's about how much you're showing. It isn't. It's about where the line stops.
Here's what to do tonight. Take whatever you've got out of the drawer, hold it up against yourself in a mirror, and look at where that seam crosses your leg.
If it crosses flat across the thigh, put it back.
That's the whole decision. Everything else about that garment is decoration.`,
    caption:`If you're bringing a bodysuit, there's exactly one thing that matters and it isn't the colour.

It's where the leg is cut.

Cut low, flat across the top of the thigh, and it stops your leg dead at its widest point. Cut high, up over the hip bone, and the line runs from your foot to your waist. Same body, same piece, one seam's difference.

"High cut" sounds like it's about how much you're showing. It's not. It's about where the line stops.

Do this tonight: hold it up against yourself and look at where that seam crosses. If it goes flat across the thigh, put it back.

Everything else about that garment is decoration. Form's in my bio.

#southbendphotographer #boudoirphotography #michiana #whattowear #mishawaka`
  },
  {
    n:"2", title:"Your Glasses Stay On", cover:"covers/face-2.jpg", format:"Studio Rule · Ep. 30",
    script:`If you wear glasses, they stay on for at least one full set. That's a studio rule.
Every woman takes them off for a photograph. Every single one. She's been doing it since she was fourteen, and she does it without thinking about it.
And then she hands her family a picture of a face they have genuinely never seen.
Think about that for a second. Your kids have never once looked at you without them. Not at breakfast. Not across the car. Not when you're telling them off.
The face they know has glasses on it.
So we shoot it both ways. One set with, one set without, and I don't argue with you about it in the moment.
But I'll tell you now what happens at the reveal, because it happens every time.
You pick the one with the glasses.
You weren't hiding behind them. You were wearing your face. Studio rule.`,
    caption:`Studio rule: if you wear glasses, they stay on for at least one full set.

Every woman takes them off for a photograph. She's been doing it since she was fourteen and she doesn't even think about it. Then she hands her family a picture of a face they've genuinely never seen.

Your kids have never once looked at you without them. Not at breakfast, not across the car, not when you're telling them off. The face they know has glasses on it.

So we shoot it both ways. And at the reveal — every time — you pick the one with the glasses.

You were never hiding behind them. You were wearing your face.

Form's in my bio.

#southbendphotographer #boudoir #michiana #studiorules #womenover40`
  },
  {
    n:"3", title:"Dark And Moody Is Where A Face Goes To Hide", cover:"covers/face-3.jpg", format:"Unpopular Opinion",
    script:`Unpopular opinion: dark and moody is where a face goes to hide.
It's the look of the year. Every feed in this industry is deep shadow, half a jaw, one eye lit and the rest of her gone into the black.
And it is also a very beautiful way to avoid having to light anybody. Drop the shadows, lose the side of her face, call it art. Nobody can tell you it's wrong, because you can't see enough of it to argue.
Here's my problem with it.
In thirty years your granddaughter is going to pull that picture out of a box. She is not going to admire the mood. She's going to want to see what you looked like.
Your jaw. Your eyes. The gap in your teeth you've hated since 1994 that she has too.
Shadow is easy. Light is hard, and light is the entire job.
I'll light your face. You can be moody about it afterwards.`,
    caption:`Unpopular opinion: "dark and moody" is where a face goes to hide.

It's the look of the year, and it's also a beautiful way to avoid having to light anybody. Drop the shadows, lose half the jaw, call it art. Nobody can tell you it's wrong — you can't see enough of it to argue.

Here's my problem. In thirty years your granddaughter pulls that picture out of a box. She isn't going to admire the mood. She's going to want to see what you looked like. Your jaw. Your eyes. The gap in your teeth you've hated since 1994 that she has too.

Shadow is easy. Light is hard, and light is the entire job.

Form's in my bio.

#southbendphotographer #boudoirphotography #michiana #glamourphotography #elkhart`
  },
  {
    n:"4", title:"The Group Photo Audit", cover:"covers/face-4.jpg", format:"The Waiting List",
    script:`Find the last group photo you're in. A wedding, a work thing, Christmas. Go and find it, I'll wait.
You already found yourself in it first. Everybody does that — that part is not the problem.
Here's the problem. You looked at exactly one thing. Your arm, or your chin, or what your dress was doing. And then you closed it.
You never saw the picture. You saw the audit.
You have been doing that for twenty years, in other people's photographs, at other people's events, and calling it modesty. It isn't modesty. Modesty is not thinking about yourself much. That is thinking about yourself constantly, just cruelly.
One afternoon where the picture is actually of you, on purpose, with someone whose whole job is to make you look like yourself — that isn't vanity either.
It might just be the first time the photograph was ever about you.
And you won't have to find yourself in it.`,
    caption:`Go and find the last group photo you're in. A wedding, a work thing, Christmas.

You found yourself in it first. Everybody does — that's not the problem.

The problem is you looked at exactly one thing. Your arm, or your chin, or what the dress was doing. And then you closed it. You never saw the picture. You saw the audit.

Twenty years of that, in other people's photographs, at other people's events, and we call it modesty. It isn't. Modesty is not thinking about yourself much. That's thinking about yourself constantly, just cruelly.

One afternoon where the picture is about you on purpose isn't vanity. It might be the first time it was ever about you at all.

And you won't have to find yourself in it. Form's in my bio.

#southbendphotographer #boudoir #michianamoms #selfworth #granger`
  },
  {
    n:"★", title:"The Night Shift", cover:"covers/reel-5.jpg", format:"BTS Overlay · Overheard in the Studio · text over you working", bts:true,
    screenTrial:`She came in off a twelve-hour shift and apologised for her face before the door had shut behind her. What she said four hours later, in the reveal room, is the reason I do this. It's all in the description.`,
    screenGrid:`She takes the only date she can get, which is always the day after nights. The sentence she said looking at the screen isn't in this video — I put it in the caption.`,
    caption:`She took the only date she could get, which for her meant the day after a run of nights.

She came in off a twelve-hour shift, still half in work mode, and apologised for her face before the door had shut behind her. Sorry, I've been up since — you know how it is.

Four hours later she's sitting in front of the screen watching her own images come up, and she goes quiet for a long time. Then:

"Nobody's looked at me like that in years. People look AT me all day. Nobody looks at me."

That's the gap. Being needed all day is not the same as being seen once.

If you've been putting this off until a week you aren't tired — that week isn't coming. Book the day after nights. I'll do the rest.

Form's in my bio.

#southbendphotographer #boudoir #michiana #nurselife #southbendindiana`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
