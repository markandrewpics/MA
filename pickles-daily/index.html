<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Tuesday, September 8, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1",
    title:"Babydolls Are The Devil",
    format:"Prep List",
    cover:"covers/face-1.jpg",
    script:`Babydolls are the devil, and I tell that to every woman who packs one.
I am here to show off your amazing body. A babydoll is cut to do the exact opposite. It skims past the narrowest part of you, then lands in a straight line at the widest part, and the camera reads that line as your shape.
Every woman who brings one brings it for the same reason. It feels safe. It feels like it hides the part she does not want in the picture.
Here is what actually happens. Fabric that touches nothing photographs like a tent, and now the softest thing in the frame is the thing you were trying to soften.
So if your middle is the reason you packed it, that is an argument for structure, not for fabric. Bring the thing with a waist in it. A corset. A bodysuit. Anything with a seam that knows where you are.
Structure flatters. Drape hides, and hiding always photographs bigger. Wardrobe walkthrough is on the form in my bio.`,
    caption:`Babydolls are the devil. I say it on every planning call and I mean it kindly.

The cut skims past the narrowest part of you and lands flat at the widest part, and a camera reads that straight line as your shape. Fabric that touches nothing photographs like a tent. It is the outfit women pack when they are nervous, and it is the outfit that makes the nervous part bigger.

If your middle is the reason you reached for it, that is an argument for structure, not for fabric. Corset. Bodysuit. Something with a seam that knows where your waist is. Bring three of those and I promise you will not miss the babydoll.

What is the one thing hanging in your closet you would never dare bring?

#boudoirwardrobe #whattowearboudoir #southbendboudoir #michianaphotographer #boudoirprep`
  },
  {
    n:"2",
    title:"Wanting One Is The Reason",
    format:"Waiting List",
    cover:"covers/face-2.jpg",
    script:`Every woman who books me opens with her reason, and not one of them has ever needed it.
I turned fifty. I finished treatment. The last one finally moved out. I lost the weight. I did not lose the weight. We are divorced now.
She hands me the reason before she hands me her name, because somewhere along the line she decided this is a thing you have to get cleared.
I have never once asked. Not in eight hundred and fifty sessions. The reason has never changed a single light, a single frame, or a single word I said to her at that reveal table.
You do not need a reason. Wanting one is the reason.
Nobody asks a man what the occasion is. He books the trip, he buys the truck, he joins the club, and the entire application was that he wanted it. No milestone. No permission slip. No waiting for a birthday round enough to justify it.
So stop drafting the justification. You are not applying for this. You are just deciding.`,
    caption:`She always leads with the reason. Fifty. Finished treatment. Last one moved out. Lost the weight, did not lose the weight, divorced now.

I have never asked a single woman why. Eight hundred and fifty sessions and the reason has never changed one light or one frame — because it was never the ticket in. It was the permission slip she wrote herself on the way here.

Nobody asks a man what the occasion is. He wanted it. That was the whole application.

You do not need a reason. Wanting one is the reason.

What reason have you been waiting to earn?

#boudoirphotography #southbendphotographer #michianawomen #womenover40 #grangerindiana`
  },
  {
    n:"3",
    title:"Ask What He Deleted",
    format:"Unpopular Opinion",
    cover:"covers/face-3.jpg",
    script:`Unpopular opinion. I have footage that would do numbers, and it will never see the internet.
A face somebody pulled between shots. A moment somebody would find funny at her expense. It sits on a drive in this building and it stays there.
The rule here is one sentence. If a client would be embarrassed to see it, it does not go up. That rule does not move for reach or for a trend, and it has cost me — I could name the clips.
Here is why that is your problem, not just mine. A woman takes her clothes off in a room with a man holding a camera. The only thing protecting her afterward is what that man decided he would not do on a day when nobody was watching.
So ask. Every photographer will tell you your photos are safe. Ask what he has deleted. The ones with a rule can answer you. The ones without one just have a hard drive. Everything I will and will not do is on the form in my bio.`,
    caption:`There is footage in this building that would do numbers. A face somebody pulled between shots, a moment somebody would find funny at her expense. It will never go up.

The rule is one sentence: if a client would be embarrassed to see it, it does not go up. Not for reach, not for a trend, not for a week where the numbers are bad. It has cost me and I can name the clips.

Here is why that is your problem too. You get undressed in a room with a man holding a camera, and the only thing protecting you afterward is what he decided he would not do on a day nobody was watching him decide it.

Every photographer will tell you your photos are safe. Ask him what he has deleted instead — and tell me, would you actually ask that out loud?

#boudoirphotographer #southbendindiana #mishawakaindiana #photographerethics #boudoirstudio`
  },
  {
    n:"4",
    title:"The Album Policy",
    format:"Studio Rule · Ep. 47",
    cover:"covers/face-4.jpg",
    script:`If your album turns up damaged I reprint it free, and if you just do not like it, I do not.
Studio rule. Here are all three answers before you spend a dollar.
Damaged in transit, damaged at the lab, damaged by me — I reprint it. Free. No conversation, no photographs of the box.
You change your mind about the cover material after it is already made — I reprint it at cost. You pay the lab, you do not pay me. That happens, and it is fine.
It arrives perfect and you simply decide you do not love it — all sales are final. That is the answer, and I would rather say it to your face at the reveal table than email it to you eight weeks later.
Nobody enjoys hearing the third one. But you are about to hand somebody real money for a thing that gets made once, with your face in it.
Ask every photographer you talk to for their three answers. Watch how long it takes them to find one.`,
    caption:`Three answers, before you spend a dollar anywhere.

Damaged in transit, damaged at the lab, damaged by me — I reprint it free. No conversation, no photographs of the box.

You change your mind about the cover material after it is made — I reprint it at cost. You pay the lab, you do not pay me.

It arrives perfect and you decide you do not love it — all sales are final. Nobody likes that one, and I would still rather say it to your face at the reveal table than email it to you eight weeks later.

You are handing somebody real money for a thing that gets made once, with your face in it. Ask every photographer for their three answers — has anyone ever given you theirs up front?

#boudoiralbum #luxuryboudoir #michianabusiness #elkhartindiana #printedphotos`
  },
  {
    n:"★",
    title:"Am I Too Old For This",
    format:"Overheard in the Studio · BTS overlay",
    cover:"covers/reel-5.jpg",
    bts:true,
    screenTrial:"There is a question I get about forty seconds into almost every phone call. She always whispers it, and she has already decided my answer is no. She is wrong, and the whole thing is in the description.",
    screenGrid:"The oldest woman I have ever photographed was seventy-one, and the reason she finally booked has nothing to do with being brave. I wrote the whole thing out in the caption.",
    caption:`The question is: am I too old for this?

Forty seconds into the phone call, always whispered, always by a woman who has already decided the answer is no and is just waiting for me to confirm it.

The oldest woman I have photographed was seventy-one. She was not brave and she was not an exception. She was the only one left in her family who had not been photographed properly since her wedding day, and she got tired of that being true.

There is no window. There was never a window. Somebody sold you a window and you have been standing outside it politely ever since.

If you had to guess, what age did you decide it was too late?

#boudoirover50 #notredamearea #nilesmichigan #glamourphotography #michianaboudoir`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
