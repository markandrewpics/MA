<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Thursday, September 10, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Wardrobe Malfunctions", cover:"covers/face-1.jpg", format:"Studio Rule \u2014 Ep. 48",
    script:`Wardrobe malfunctions are an occupational hazard in here, and you are not going to scare us.

A strap goes. A clasp gives up. Something rides somewhere it was never invited. And I want you to notice what happens in the room when it does, which is nothing. Nobody gasps. Nobody looks away to be polite. Aletheia hands you a safety pin and keeps telling you about her weekend.

We have seen it several hundred times and it has never once been the interesting part of anybody's day.

Here is why I'm telling you this before you book instead of after. Half the nerves women bring in here have nothing to do with the camera. They're about being embarrassed in front of a stranger. So let me take that one off the table right now.

The form's in my bio when you want the day. But there is no version of this where you shock us. We've seen it. We didn't flinch. Neither should you.`,
    caption:`A strap gave out mid-set last week and three of us kept talking.

That is genuinely the whole story. Nobody gasped, nobody made it a moment, Aletheia handed her a safety pin and finished her sentence about her weekend. Several hundred sessions in, a wardrobe malfunction has never once been the interesting part of the day.

I tell every woman this before she books, because half the nerves that walk into this studio have nothing to do with how she photographs. They're about being embarrassed in front of a stranger. So: your session, your rules, and you are not going to shock us.

What's the thing you're quietly most worried would go wrong on a day like this?

#southbendboudoir #michianaphotographer #boudoirstudio #studiorules #indianaboudoir`
  },
  {
    n:"2", title:"The Truck, The Boat, The Gear", cover:"covers/face-2.jpg", format:"The Waiting List",
    script:`He's got the truck, he's got the boat, and nobody made him justify either one.

Nobody sat him down and asked whether he really needed the gear he bought this year. Nobody worked out what it costs per use. He wanted it, he got it, and the household absorbed it the way households do.

And you are sitting at your kitchen table doing arithmetic on whether you're allowed one afternoon of photographs of yourself.

I want you to hear the difference, because it isn't really about money. You have spent this much on other people without blinking. The math only ever shows up when the money is pointed at you. That's not budgeting. That's a habit you picked up somewhere and never questioned.

You are not asking for a luxury here. You are asking for the same thing he already took without asking.

The boat didn't need a reason. Neither do you.`,
    caption:`Nobody asked him to justify the boat.

Not the truck either, or whatever the gear was this year. He wanted it, he got it, and the household absorbed it the way households do. Then you sit down and do arithmetic on one afternoon of photographs of yourself, and somehow that's the line item that needs defending.

It isn't about money. You've spent this much on other people without blinking. The math only appears when the money is pointed at you — and that's a habit, not a budget.

Payment plans exist here for exactly this reason, and I've never once had a woman tell me afterward that she'd overpaid.

What was the last thing you bought that was only for you?

#boudoirphotography #grangerindiana #michianawomen #boudoirforeverywoman #goshenindiana`
  },
  {
    n:"3", title:"We Don't Shoot Pinup", cover:"covers/face-3.jpg", format:"The Unpopular Opinion",
    script:`Unpopular opinion: a photographer who says yes to every style is quietly telling you he's mediocre at all of them.

We don't shoot pinup. It is a beautiful genre and it is not my genre, and if that's what you want I would rather hand you the name of somebody who is genuinely great at it than sell you a half-version of it with my name on the back.

That answer costs me work every single month. I'm fine with it.

Here's what I actually do. Old-Hollywood glamour. Bold light, painted backdrops, statement jewelry, fur — the kind of picture your granddaughter finds in thirty years and says look how good Grandma looked. That is the entire menu. One thing, done eight hundred and fifty times.

You are not booking a menu. You're booking a point of view, and if mine isn't yours, that is useful information for both of us. The form's in my bio if it is.

Say no to enough work and the yes starts to mean something.`,
    caption:`I turn work away every month and I'd do it again tomorrow.

We don't shoot pinup. It's a beautiful genre, it's just not mine, and I'd rather hand a woman the name of somebody who is genuinely great at it than sell her a half-version with my name on the back of it.

What we do is one thing: old-Hollywood glamour. Bold light, painted backdrops, statement jewelry, fur. The kind of picture your granddaughter finds in thirty years and says look how good Grandma looked. One style, eight hundred and fifty sessions deep.

A photographer who says yes to everything is telling you something about all of it.

Photographers — where do you land on this? Specialist, or is turning down paid work just ego?

#oldhollywoodglamour #mishawakaindiana #luxuryboudoir #glamourphotography #boudoirphotographer`
  },
  {
    n:"4", title:"One Tuesday, Nine To Four", cover:"covers/face-4.jpg", format:"The Prep List",
    script:`This is what a Tuesday actually looks like in my studio, start to finish.

Nine o'clock, you're here, and there's coffee, because nobody does this well on an empty stomach.

Nine fifteen, Aletheia starts hair and makeup. That chair is where most women stop being nervous, and it has nothing to do with me.

Eleven, we shoot. Three outfits, three sets, about ninety minutes. The middle set gets rebuilt twice because I changed my mind about the light, and that is my problem, not yours.

Twelve thirty, lunch. You eat. I finish your gallery, because I shot it right the first time and there is nothing left to fix.

One o'clock the television goes on and you watch a hundred and thirty images of yourself in 4K, the same afternoon, on a sixty-five inch screen.

Somewhere around three fifty-two, somebody is crying. It's usually you. It's occasionally me.

Four o'clock you drive home in the same body you drove in with.`,
    caption:`Nine to four, and the only part that surprises anybody is the last hour.

9:00 — you arrive, there's coffee.
9:15 — Aletheia starts hair and makeup. That chair is where most women stop being nervous, and it has nothing to do with me.
11:00 — three outfits, three sets, about ninety minutes. The middle set gets rebuilt twice because I changed my mind about the light.
12:30 — lunch. You eat, I finish your gallery. There's nothing to fix, because I shot it right the first time.
1:00 — the TV goes on. A hundred and thirty finished images of you, in 4K, the same afternoon.
3:52 — somebody's crying. Usually you. Occasionally me.
4:00 — you drive home in the same body you drove in with.

Which hour of that would you be most nervous about?

#samedayreveal #southbendindiana #boudoirbts #boudoirexperience #elkhartindiana`
  },
  {
    n:"5", title:"The Four Words She Apologizes With", cover:"covers/reel-5.jpg", format:"Overheard in the Studio (BTS overlay)", bts:true,
    screenTrial:`Almost every woman who books me says the same four words before she'll let herself enjoy the day, and she says them like she's confessing to something. Nobody has ever said them to me about golf clubs. The whole thing is in the description.`,
    screenGrid:`I have never once had a man apologize to me for buying the boat. I hear an apology for this every single week, in the same four words, in the same whisper — I put the rest in the caption.`,
    caption:`The four words are: "Doesn't this feel selfish?"

She whispers it. Almost always in the first ten minutes, almost always while she's still holding her coat, and always like she's confessing to something.

Nobody has ever asked me that about a set of golf clubs. Nobody apologizes for the boat. But she has spent eleven years buying everybody else the thing they wanted, and she has arrived at a point where spending one day on herself registers as a moral problem.

Here's the honest answer, and it took me a few hundred sessions to be able to say it plainly: it isn't selfish. It's unfamiliar. She has confused those two things for so long that she genuinely can't tell them apart anymore — and unfamiliar wears off in about an hour, usually somewhere in the makeup chair.

You are allowed to be the one being photographed. That's the whole permission slip.

When was the last time you did something that was only for you — and did you apologize for it?

#boudoirmichiana #nilesmichigan #boudoirconfidence #womenover40 #boudoirsession`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
