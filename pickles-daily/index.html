<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Sunday, September 6, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"Fifteen Minutes Ends The Day", format:"Studio Rule · Ep. 45",
    cover:"covers/face-1.jpg",
    script:"If you show up more than fifteen minutes late, I cancel your shoot and the retainer is gone. Studio rule forty-five.\n\nThat sounds brutal until you see what your day actually is. I book one shoot a day. You arrive at nine, you're finished before four, and every hour in between already belongs to you. Ninety minutes in the makeup chair. Three outfits, three sets. Lunch. Then a reveal where you sit down and look at your own edited images that same afternoon.\n\nThere is no padding in that. Nothing to borrow from.\n\nSo when we start twenty minutes behind, it doesn't come out of my day. It comes out of your third set, or your lunch, or the time you needed to actually look at your pictures instead of skimming them.\n\nI would rather protect the day you paid for than squeeze it and hand you a worse version of it.\n\nBe early. Bring coffee. That's the whole rule.\n\nThe form is on my site whenever you want the date.",
    caption:"Studio rule forty-five: more than fifteen minutes late and I cancel the shoot.\n\nPeople hear that and think I'm being precious. I book one shoot a day in South Bend. You arrive at nine and you're out before four, and every hour in between is already spoken for — ninety minutes of hair and makeup, three outfits across three sets, lunch, then your same-day reveal where you sit down and pick from images that are already edited.\n\nThere's no slack built into that. So a late start never costs me a set. It costs you one. Or it costs you the twenty unhurried minutes you needed at the reveal.\n\nI'd rather be the guy with the annoying rule than the guy who handed you a rushed version of the day you paid for.\n\nWould you rather a photographer bend the rules, or protect your day with them?\n\n#boudoirphotographer #southbendindiana #michiana #boudoirstudio #indianaboudoir"
  },
  {
    n:"2", title:"Ready Is Not A Feeling", format:"The Waiting List",
    cover:"covers/face-2.jpg",
    script:"You are not going to wake up one morning and feel ready. That is not a thing that happens.\n\nI have had eight hundred and fifty women in front of this camera and almost none of them arrived confident. That is not the exception, that is the room. The women who booked were not braver than you. They were exactly as scared, and they came anyway.\n\nHere is what I think you are actually waiting on. You are waiting for the fear to leave first, and then you will go.\n\nBut you cannot be courageous without a little bit of fear. The fear is the ingredient. It is not the roadblock. If this were easy it would not mean anything to you at three in the afternoon, when you are sitting in front of a sixty-five inch screen looking at yourself and you go completely quiet.\n\nNothing about your body is the holdup. The permission is.\n\nYou don't have to feel ready. You just have to pick a date.",
    caption:"Nobody walks into my studio confident. Almost nobody.\n\nEight hundred and fifty women, and the ones who booked weren't braver than the ones still waiting. They were exactly as scared. They just stopped waiting for the fear to leave first.\n\nThat's the trap. You've decided the feeling has to arrive before the decision does, so you're sitting on a couch in Mishawaka waiting to become a different woman, and she isn't coming. You can't be courageous without a little bit of fear — the fear is the ingredient, not the roadblock.\n\nI've watched what happens at three in the afternoon when a woman who almost didn't come sits down in front of her own images and goes completely silent. Her body didn't change. One afternoon did.\n\nYou don't have to feel ready. You have to pick a date.\n\nWhat are you actually waiting for — the weight, the timing, or somebody's permission?\n\n#boudoirphotography #mishawakaindiana #womenover40 #selfworth #southbendboudoir"
  },
  {
    n:"3", title:"Bring Nobody Who Almost Agrees", format:"Unpopular Opinion",
    cover:"covers/face-3.jpg",
    script:"Unpopular opinion. The person you most want to bring with you is usually the exact person you should leave at home.\n\nYou can bring a support person. She can sit with you the entire time you're in hair and makeup. But once we start shooting, anybody who isn't being photographed leaves. That one isn't negotiable.\n\nThe bigger filter happens before that, though, and nobody warns you about it. If there is even a small inkling that the person you're bringing doesn't actually agree with what you're doing, leave her home. The sister who's just being honest. The friend whose mouth says of course you should while her face is doing something else entirely.\n\nBecause this room only works if it is a safe place, and friction from the outside does not stay outside. It sits in your shoulders. I can see it in every single frame.\n\nBring the woman who is genuinely thrilled for you. Or bring nobody. Nobody is a completely great option.\n\nForm's in my bio if you're ready.",
    caption:"Unpopular opinion: the person you most want to bring is usually the one you should leave home.\n\nHere's the rule first. A support person is welcome, and she can stay through hair and makeup. Once we start shooting, anyone not being photographed steps out — that part isn't negotiable, and it's the reason women relax in the first ten minutes.\n\nThe part nobody warns you about is who you invited. If there's even a small inkling that she doesn't agree with what you're doing, leave her home. The sister who's \"just being honest.\" The friend whose mouth says go for it while her face says something else.\n\nThis room only works if it's safe, and friction doesn't stay outside. It sits in your shoulders and I photograph it.\n\nBring the woman who's genuinely thrilled for you. Or bring nobody — nobody is a great option.\n\nPhotographers: am I wrong to be this blunt about it?\n\n#boudoirshoot #grangerindiana #glamourphotography #boudoirtips #northernindiana"
  },
  {
    n:"4", title:"Wear Sweatpants To Your Shoot", format:"The Prep List",
    cover:"covers/face-4.jpg",
    script:"What you wear to my studio matters more than the first outfit you brought to shoot in. Nobody tells you that.\n\nYou are in the makeup chair for about ninety minutes before we photograph anything. So whatever you drove here in gets ninety minutes to press itself into your skin. Tight waistbands. Bra bands. The elastic on your socks. Those lines are still sitting there an hour later and they show up in your first set.\n\nSo, one. Sweats, athleisure, pajamas. Loose, boring and comfortable. Nobody is photographing that.\n\nTwo. Whatever is on top has to come off without going over your head. A button-down, or a wide neck. Pulling a t-shirt over finished hair and makeup undoes forty-five minutes of work in about four seconds.\n\nThree. Clean face, clean dry hair. If your hair runs oily, wash it the night before and blow it dry before bed.\n\nScreenshot that. It is the part nobody warns you about.",
    caption:"What you wear TO the studio matters more than the first outfit you brought to shoot in.\n\nYou're in the makeup chair about ninety minutes before we photograph anything, which means whatever you drove here in gets ninety minutes to press itself into your skin. Tight waistbands, bra bands, sock elastic — those lines are still there an hour later, and they turn up in your first set.\n\nSo here's the whole list.\n\nOne: sweats, athleisure, pajamas. Loose, boring, comfortable.\nTwo: whatever's on top has to come off without going over your head. Button-down or a wide neck — pulling a t-shirt over finished hair and makeup undoes forty-five minutes in four seconds.\nThree: clean face, clean dry hair. Oily hair, wash it the night before and blow it dry before bed.\n\nScreenshot it. It's the part nobody warns you about.\n\nWhat's the one prep detail you wish someone had told you before a shoot?\n\n#boudoirprep #elkhartindiana #whattoweartoyourshoot #photoshootprep #michianaphotographer"
  },
  {
    n:"5", title:"She Changed Her Own Rule", format:"Overheard in the Studio · BTS overlay", bts:true,
    cover:"covers/reel-5.jpg",
    screenTrial:"Two days before her shoot she wrote down exactly how far she was willing to go. By the third set she wanted to break her own rule. The rest is in the description.",
    screenGrid:"She apologized before she asked me to change the plan she had written herself. What I actually said back is in the caption.",
    caption:"A couple of days before every shoot, a questionnaire goes out. How much skin, how edgy, what's off the table. She fills it in honestly, from her kitchen table, days before she's met a single light in this room.\n\nThen set three happens. She's warm, she's seen a few frames on the back of the camera, and she wants something she'd already ruled out in writing. And almost every one of them apologizes before they ask.\n\nHere's what I said, and what I say every time: that form is a starting point, not a contract. You can go edgier or tamer, any direction, at any moment of the day, and nobody in this room is going to make a thing of it. Most women start more covered than they finish. A few go the other way, and that's just as fine.\n\nThe questionnaire exists so you never have to explain yourself on the spot. It was never there to hold you to anything.\n\nNothing gets shared without your written consent either — that stays yours too.\n\nWould you rather your photographer hold you to the plan, or let you change it?\n\n#boudoirexperience #nilesmichigan #bodypositivity #boudoirsession #southbendphotographer"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
