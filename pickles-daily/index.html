<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Reel Scripts — Pickles</title>
</head>
<body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Monday, August 31, 2026 — film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    n:"1", title:"I Don't Shoot Weekends", format:"Studio Rule · Ep. 40", cover:"covers/face-1.jpg",
    script:`I don't photograph anybody on a Saturday. Or a Sunday. That's a studio rule, and it has cost me money.
Here is why it's actually about you.
I shoot one woman a day, Monday through Friday. You arrive at nine, you're done before four, and for those seven hours you have me, the artist, and an empty building.
Weekends are when people try to squeeze this in. Between the game and the birthday party. Makeup at eight so she can be out the door by noon.
That isn't the day. That's an errand.
The women who get the most out of this are the ones who take a Tuesday off work, tell almost nobody where they're going, and drive home at four with a hundred and forty photographs of themselves.
A weekend session is something you fit around everybody else.
A weekday is the one day this year that isn't for anybody else.
That's the rule. Take the Tuesday.`,
    caption:`I don't shoot weekends, and it isn't about my calendar.
One woman a day, Monday through Friday. You're here at nine, you're done before four, and nobody else is booked in that building.
Weekends are when this gets squeezed between a game and a birthday party — makeup at eight so you can be out by noon. That's an errand, not a day.
The women who walk out of here different are the ones who took a Tuesday off work, told almost nobody, and drove home at four with a hundred and forty pictures of themselves.
Taking a weekday off for yourself feels indulgent right up until you do it. Tell me honestly — when did you last take a day off work that had nothing to do with anyone else?

#boudoirphotography #southbendphotographer #michianaboudoir #boudoirsouthbend #indianaboudoir`
  },
  {
    n:"2", title:"It's Not Included, On Purpose", format:"Unpopular Opinion", cover:"covers/face-2.jpg",
    script:`Unpopular opinion: your photographer should not be making a dime on your hair and makeup.
Mine doesn't. You book the artist directly, you pay her directly, I never touch the money and I don't take a cut.
Half this industry bundles it into a package, and that looks generous right up until you add up what the two things cost separately.
There's a second reason and it matters more than the money.
When the artist is working for me, she's mine. When you hire her, she's yours. She stays the whole day — touch-ups between sets, the strap you can't reach, the thing you'd only say out loud to another woman in the room.
I want her loyal to you. That's worth more to your photographs than any bundle I could sell you.
So no, it isn't included. It was never meant to be.
The best thing I can do with your hair and makeup is stay out of it.`,
    caption:`Your hair and makeup is not included in what you pay me, and I have no plans to change that.
You book the artist directly and you pay her directly. I don't mark it up, I don't take a cut, and I never touch the money.
Part of that is simple math — bundled looks generous until you price the two things separately.
The bigger part is whose corner she's in. When the artist works for me, she's mine. When you hire her, she's yours, all day: touch-ups between sets, the strap you can't reach, the thing you'd only say to another woman in the room.
Photographers, come argue with me on this one. Is bundling hair and makeup a convenience for her, or a margin for you?

#boudoirphotographer #southbendboudoir #michianaphotographer #hairandmakeup #boudoirphotography`
  },
  {
    n:"3", title:"Do You Need Me To Suck In?", format:"Overheard in the Studio", cover:"covers/face-3.jpg",
    script:`"Do you need me to suck in?" I get asked that in almost every session, about four minutes in, and she always asks it like she's offering to help.
The answer is no. Breathe out.
Here's what actually happens when you suck in. Your shoulders climb, your ribs lock, your neck shortens and your face tightens, and you hold all of that for a photograph that takes one two-hundredth of a second. I don't get a smaller waist out of it. I get a woman who looks like she's bracing for something.
Everything you are trying to do by holding your breath, I do with where you're standing, where the light lands and what your hands are doing. That's my job. That is the entire job.
So when I tell you to breathe out, I'm not being kind. The pose only works on the exhale.
Nobody has ever looked at a picture of herself and loved how hard she was holding her breath.`,
    caption:`"Do you need me to suck in?" — asked in almost every session, about four minutes in, always like she's offering to help.
No. Breathe out.
Sucking in climbs your shoulders, locks your ribs, shortens your neck and tightens your face, and you hold all of it for a photo that takes one two-hundredth of a second. It doesn't give me a smaller waist. It gives me a woman braced for impact.
Everything you're trying to fix by holding your breath is my job — where you stand, where the light lands, what your hands are doing.
Nobody has ever loved a photo of herself for how hard she was holding her breath. What's the thing you do the second a camera comes out that you'd swear is helping?

#boudoirphotography #posingtips #southbendphotographer #michianaboudoir #boudoirshoot`
  },
  {
    n:"4", title:"Nobody Photographed This Year", format:"The Waiting List", cover:"covers/face-4.jpg",
    script:`There is no photograph of the woman you are this year.
There's one from the wedding. A handful from Christmas, taken at arm's length by somebody who wasn't really looking. And whatever your phone caught by accident.
But there is nothing of you as you are right now. This hair. This face. This chapter, the one you're actually living in.
And you'll do what almost everybody does. You'll wait until after the weight, after the summer, after work calms down. Every one of those is a real thing. Not one of them is the year you're in.
Here is what I have watched happen hundreds of times. She books it for the woman she is going to become. She arrives as the woman she is. And the pictures she cries over are of that woman — the one she'd been apologising for the entire drive here.
This year ends either way.
The only question is whether anyone photographed it.`,
    caption:`There is no photograph of the woman you are this year.
One from the wedding. A few from Christmas, taken at arm's length by someone who wasn't really looking. Whatever your phone caught by accident. Nothing of you as you are right now — this hair, this face, this chapter.
So you wait. After the weight, after the summer, after work calms down. All real. None of them is the year you're in.
What I've watched happen hundreds of times: she books it for the woman she's going to become, she arrives as the woman she is, and the pictures she cries over are of the one she'd been apologising for the whole drive over.
This year ends either way. What year is the last good photograph of you from — and what were you waiting for back then?

#boudoirphotography #womenover40 #southbendindiana #michianaboudoir #selfworth`
  },
  {
    n:"★", title:"Try It On Before You Get Here", format:"BTS Overlay · The Prep List", cover:"covers/reel-5.jpg", bts:true,
    screenTrial:`The most expensive mistake happens in your bedroom the week before, not in my studio. I put the whole thing in the description.`,
    screenGrid:`I can tell in four seconds whether you tried it on before you got here — and there's a fix. It's all in the caption.`,
    caption:`Try every single thing on at home before you bring it.
Not held up against you in the bag. On, in front of a full-length mirror, with the lights up.
Then do the four things you'll actually do in front of my camera. Sit down in it. Raise both arms. Lie on your side. Walk across the room.
That's where a bodysuit rides, a cup gapes, a strap digs a line into your shoulder that stays there for an hour, or a garter belt turns out to be two inches too big. In your bedroom that's a five-minute fix. At ten-forty in my studio, with your hair and makeup finished, it costs you a whole set.
There's no client wardrobe here — no closet of lingerie to rescue an outfit with. I have robes, furs, and a wall of statement jewelry, and that's it. Everything you're photographed in, you brought.
So bring options. Twice what you think you need. Nobody has ever regretted the extra bag.
What's the thing you'd never have thought to check until somebody told you?

#boudoirprep #whattowear #southbendphotographer #michianaboudoir #boudoirphotography`
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>
</body>
</html>
