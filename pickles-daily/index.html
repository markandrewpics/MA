<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reel Scripts — Mark Andrew</title></head><body>
<style>
  :root{
    --navy:#0c1322; --navy2:#161d30; --card:#1a2340; --line:#2b3557;
    --gold:#ffbf8f; --gold-deep:#e0a878; --cream:#eef0f5; --muted:#94a0bb;
    --ok:#7fd1a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(178deg,#0c1322 0%,#161d30 60%,#131a2c 100%);
    color:var(--cream); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}
  .eyebrow{
    font-size:12px;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:8px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:34px;line-height:1.05;text-align:center;color:var(--cream);
    letter-spacing:.01em;text-wrap:balance;
  }
  .date{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}
  .howto{
    text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;
    margin:14px auto 26px;max-width:440px;
  }
  .howto b{color:var(--cream);font-weight:600}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px;margin-bottom:20px;
  }
  .card.bts{border-color:var(--gold-deep)}
  .rhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .rnum{
    font-family:Georgia,serif;font-size:26px;color:var(--gold);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .rtitle{font-family:Georgia,serif;font-size:21px;color:var(--cream);line-height:1.15}
  .chip{
    display:inline-block;margin:8px 0 16px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);
    border-radius:100px;padding:4px 11px;font-weight:600;
  }
  .lbl{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:2px 0 8px;
  }
  .text{
    background:#111834;border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;font-size:16px;line-height:1.62;color:#e7ebf6;
    white-space:pre-line;
  }
  .text.cap{color:#d2d9ec;font-size:15px}
  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:100%;min-height:54px;border-radius:13px;margin:11px 0 4px;
    font-size:16px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .2s ease,color .2s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#241608}
  .btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .btn.copied{background:var(--ok)!important;color:#0b2417!important;border-color:var(--ok)!important}
  .btn:focus-visible{outline:3px solid #6f8fe0;outline-offset:2px}
  .divider{height:1px;background:var(--line);border:none;margin:16px 0}
  img.cardcover{
    width:100%;max-width:250px;height:auto;display:block;margin:8px auto 0;
    border-radius:12px;border:1px solid var(--line);background:var(--navy);
  }
  .btn.save{background:#20304f;color:var(--gold);border:1.5px solid var(--gold-deep)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:30px}
  .foot b{color:var(--gold-deep)}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div class="wrap">
  <div class="eyebrow">Mark Andrew Photography</div>
  <h1>Daily Reel Scripts</h1>
  <div class="date" id="date"></div>
  <p class="howto">Tap <b>Copy Script</b> → paste into your teleprompter. Tap <b>Copy Caption</b> → paste into Instagram. No selecting, no fighting your phone.</p>
  <div id="cards"></div>
  <p class="foot">Refreshes every morning at <b>5:30</b>. Add this page to your home screen so it opens like an app.<br>— Pickles</p>
</div>

<script>
const DATE = "Monday, July 27, 2026 \u2014 film any 2";
// Each DATA item may carry an optional `cover:"data:image/png;base64,..."` that the routine fills daily;
// it renders as a tap-to-save image directly under that reel's caption.
const DATA = [
  {
    "n": "1",
    "title": "My Calendar Has One Name",
    "cover": "covers/face-1.jpg",
    "format": "Studio Rule · Ep. 16",
    "script": "One woman a day. That's my entire calendar, and I'm never changing it.\nYou will not pass another client in my hallway. You won't hear my next appointment arrive while you're standing there in a robe. Nobody is waiting on your slot.\nFrom nine in the morning until you walk out holding your images, this studio exists for exactly one person, and it's you.\nHere's why that matters more than it sounds. The second a woman thinks somebody else is coming, she starts hurrying. She skips the outfit change she actually wanted. She apologizes for taking too long. I've watched it happen, and hurried women don't get their best photographs.\nBooking two or three sessions a day would make me more money. It would also turn you into a slot instead of a person.\nSo I take one. You get the whole day, the whole studio, and my whole attention.\nYou're not on the schedule here. You're the reason there is one.",
    "caption": "One woman a day. That's the whole calendar, and it's the rule I get asked about the most.\nYou'll never pass another client in the hallway. You'll never hear the next appointment show up while you're still in a robe. From 9am until you walk out with your images, the studio belongs to exactly one person.\nTwo or three sessions a day would make me more money. It would also make you a slot instead of a person. Hard pass.\nIf that's the kind of day you've been waiting for, the form is in my bio.\n#southbendphotographer #michiana #womenover40 #luxuryportraits #mishawakaindiana"
  },
  {
    "n": "2",
    "title": "Beaten By A White Shirt",
    "cover": "covers/face-2.jpg",
    "format": "Unpopular Opinion",
    "script": "Unpopular opinion: the matching set you're about to buy will photograph worse than a plain white button-down.\nEight hundred and fifty sessions. Here's the ranking, worst to best.\nNumber four, the brand-new matching set with the tags still on. It fits the mannequin. It doesn't fit you yet, and the camera reads that as nerves every single time.\nNumber three, anything bought specifically to look sexy in. Costumes photograph like costumes.\nNumber two, the piece you already own and already love. Your body knows it, and that shows up in your shoulders before it shows up anywhere else.\nNumber one, and it beats all of them: an oversized white button-down and nothing else. It moves, it catches light, and it covers exactly as much as you decide it covers.\nThe best outfit I've ever photographed cost nothing. It was hanging in her husband's closet.\nStop shopping for permission. Pack what you already feel like yourself in.",
    "caption": "Ranked, worst to best, after 850 sessions.\n4. The brand-new matching set with the tags still on. It fits the mannequin, not you, and the camera reads that as nerves.\n3. Anything bought specifically to look sexy in. Costumes photograph like costumes.\n2. The piece you already own and already love. Your body knows it.\n1. An oversized white button-down. It moves, it catches light, and it covers exactly as much as you decide it covers.\nThe best outfit I've ever photographed cost nothing. It came out of her husband's closet. Tell me I'm wrong.\n#southbendphotographer #michiana #whattowear #womenover40 #grangerindiana"
  },
  {
    "n": "3",
    "title": "Nobody Is Coming To Say Yes",
    "cover": "covers/face-3.jpg",
    "format": "The Waiting List",
    "script": "Nobody is coming to give you permission. So I wrote it out, and I'm going to read it to you.\nPermission slip. For the woman who has signed twenty years of these for everybody else.\nYou are permitted to spend money on something that produces no dinner, no clean laundry, and no ride to practice.\nYou are permitted to be photographed at this weight, in this body, with this face, in this exact year.\nYou are permitted to do something for yourself with no occasion, no anniversary, and no reason attached to it.\nYou are permitted to stop asking whether you've earned it.\nHere's the part women miss. Nobody in your life is withholding this from you. It has genuinely never occurred to them that you were standing there waiting for somebody to say yes.\nThere's one line left on the slip. It's the signature line.\nIt only ever needed one name on it. Yours.",
    "caption": "A permission slip, for the woman who has signed twenty years of them for everybody else.\nYou're permitted to spend money on something that produces no dinner and no clean laundry. You're permitted to be photographed at this weight, in this body, in this exact year. You're permitted to stop asking whether you've earned it.\nNobody in your life is withholding this from you. It has never once occurred to them that you were waiting for permission.\nThere's one signature line left, and it only ever needed your name.\n#southbendphotographer #michiana #womenover40 #selfworth #elkhartindiana"
  },
  {
    "n": "4",
    "title": "She Wouldn't Say Why That Date",
    "cover": "covers/face-4.jpg",
    "format": "Overheard in the Studio",
    "script": "She booked one specific date and refused to tell me why until she was already in the makeup chair.\nI asked twice. She dodged twice. Then Aletheia was halfway through her eyes and she said it out loud, to the mirror, not to me.\nIt was five years to the day since her diagnosis.\nShe said, that date has belonged to a hospital for five years. Every year it shows up on the calendar and takes the whole day with it.\nThen she shot like she was taking something back. Not performing. Taking. I've photographed 850 women and I've seen maybe ten shoot like that.\nAt the reveal she didn't cry the way most women do. She went very quiet, looked at the whole wall of images, and said, now it belongs to me.\nSame date. Same body. Same woman.\nSome days on your calendar are just sitting there waiting for you to come get them back.",
    "caption": "She booked one specific date and wouldn't tell me why until she was already in the makeup chair.\nIt was five years to the day since her diagnosis. She said that date had belonged to a hospital for five years, and every year it showed up and took the whole day with it.\nShe shot like she was taking something back. At the reveal she went quiet, looked at the wall of images, and said, now it belongs to me.\nSame date. Same body. Same woman. Some days on your calendar are just waiting for you to come get them back.\n#southbendphotographer #michiana #womenover40 #survivorstrong #nilesmichigan"
  },
  {
    "n": "★",
    "title": "The Color That Erases You",
    "cover": "covers/reel-5.jpg",
    "format": "Prep List · BTS Overlay",
    "bts": true,
    "screenTrial": "Almost every woman packs the same color for her shoot, and on my set it is the one thing that makes her disappear. The full list of what to bring instead is in the description.",
    "screenGrid": "I can guess what's in your suitcase before you unzip it, and one thing in there is quietly costing you half your photos. I put the whole color list in the caption.",
    "caption": "It's black. Almost everyone packs black, because black is the safe choice everywhere else in life.\nMy sets are dark. Dark painted backdrops, old-Hollywood lighting, deep shadow on purpose. Put black on top of that and you don't read as elegant, you read as a floating face and a pair of hands. The garment vanishes and takes your shape with it.\nWhat separates you from the backdrop under studio light is color with weight in it. Jewel tones.\nEmerald. Burgundy. Sapphire. Deep plum. Anything with real saturation, and ideally with texture in the fabric so the light has something to grab.\nYou don't have to throw the black out. Bring it if you love it. Just don't let it be all three outfits. Bring one piece with real color and watch which frames you stop on at the reveal.\nScreenshot the color list before you pack.\n#southbendphotographer #michiana #whattowear #womenover40 #mishawakaindiana"
  }
];

function copy(text, btn, label){
  const done = () => {
    btn.classList.add("copied");
    const prev = btn.dataset.label;
    btn.textContent = "Copied ✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else { fallback(text,done); }
}
function fallback(text, done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
// Build a File synchronously from a data URI (no await — keeps iOS "user gesture" alive for share)
function b64ToFile(dataUri, filename){
  const c=dataUri.indexOf(","), meta=dataUri.slice(0,c), b64=dataUri.slice(c+1);
  const mime=(meta.match(/data:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], filename, {type:mime});
}
function saveImg(dataUri, name){
  const slug=(name||"reel").replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  let file=null;
  try{ file=b64ToFile(dataUri, slug+"-cover.jpg"); }catch(e){}
  // Primary: iOS share sheet → "Save Image" to Photos. Called synchronously in the tap.
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(err=>{ if(!err||err.name!=="AbortError") openFull(dataUri); });
    return;
  }
  openFull(dataUri);
}
// Fallback: blow the image up full-screen so a long-press gives Save to Photos
function openFull(dataUri){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:99;background:#0c1322;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
  const tip=document.createElement("div");
  tip.style.cssText="color:#eef0f5;font-size:15px;text-align:center;line-height:1.4";
  tip.innerHTML="Press &amp; hold the image → <b>Save to Photos</b>.<br>Tap the dark area to close.";
  const img=document.createElement("img"); img.src=dataUri;
  img.style.cssText="max-width:100%;max-height:80vh;border-radius:10px";
  ov.appendChild(tip); ov.appendChild(img);
  ov.addEventListener("click",e=>{ if(e.target===ov) document.body.removeChild(ov); });
  document.body.appendChild(ov);
}

document.getElementById("date").textContent = DATE;

const host = document.getElementById("cards");
DATA.forEach(d=>{
  const card=document.createElement("div");
  card.className="card"+(d.bts?" bts":"");
  card.innerHTML = `<div class="rhead"><span class="rnum">${d.n}</span><span class="rtitle">${d.title}</span></div><span class="chip">${d.format}</span>`;
  // BTS reels carry TWO on-screen texts (Trial + Grid); everything else is script + caption
  let blocks;
  if(d.bts && d.screenTrial && d.screenGrid){
    blocks=[
      {lbl:"On-screen text — TRIAL reel", txt:d.screenTrial, btn:"Copy Trial Text"},
      {lbl:"On-screen text — GRID post", txt:d.screenGrid, btn:"Copy Grid Text"},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  } else {
    blocks=[
      {lbl:(d.bts?"On-screen text":"Script"), txt:d.script, btn:(d.bts?"Copy On-Screen Text":"Copy Script")},
      {lbl:"Caption", txt:d.caption, btn:"Copy Caption", cap:true}
    ];
  }
  blocks.forEach((b,i)=>{
    if(i>0){ const hr=document.createElement("hr"); hr.className="divider"; card.appendChild(hr); }
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=b.lbl; card.appendChild(lbl);
    const txt=document.createElement("div"); txt.className="text"+(b.cap?" cap":""); txt.textContent=b.txt; card.appendChild(txt);
    const btn=document.createElement("button"); btn.className="btn "+(b.cap?"ghost":"primary");
    btn.dataset.label=b.btn; btn.textContent=b.btn;
    btn.addEventListener("click", ()=>copy(b.txt, btn));
    card.appendChild(btn);
  });
  if(d.cover){
    const cl=document.createElement("div"); cl.className="lbl"; cl.style.marginTop="16px";
    cl.innerHTML="Cover — press &amp; hold → Save to Photos"; card.appendChild(cl);
    const img=document.createElement("img"); img.className="cardcover"; img.src=d.cover; img.alt=d.title+" cover";
    card.appendChild(img);
  }
  host.appendChild(card);
});
</script>

</body></html>
