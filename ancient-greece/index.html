<script>
const DATA={"lessons": [{"title": "Mountains split. Boats connect.", "short": "Mountains & boats", "image": 0, "alt": "Illustration of two towns separated by mountains, with a trading boat connecting them by sea.", "big": "Mountains kept towns apart. The sea helped people travel and trade.", "facts": ["Each city-state had its own government.", "Rocky land made farming hard.", "Boats brought food and goods from other places."], "words": [{"term": "city-state (polis)", "meaning": "A city that rules itself and the land around it."}, {"term": "civilization", "meaning": "A developed society with its own way of life."}], "question": "Point to the mountains. Why did separate city-states grow?", "choices": ["Mountains made it hard to reach other towns.", "Every town shared the same king."], "answer": 0, "feedback": "Yes! Mountains separated communities. Each community made its own rules.", "detailTitle": "A little more from the reading", "details": ["About 80% of Greece is mountainous. Thin, rocky soil and little flat land made farming difficult. People also fished and traded for food.", "Greece is a peninsula: land with water on three sides. The Ionian Sea is west, the Aegean Sea east, and the Mediterranean Sea south.", "Growing communities needed more farmland. Greeks sailed to build colonies, or new settlements, around the Mediterranean and Black Seas. Their culture spread with them."]}, {"title": "Up for temples. Down for shopping.", "short": "Hilltop & market", "image": 1, "alt": "Illustration of a fortified temple high on a hill, with a busy marketplace below.", "big": "Two places. Two jobs. Look UP at the acropolis. Look DOWN at the agora.", "facts": ["Acropolis: a protected hilltop with temples.", "Agora: a public place to shop, meet and talk.", "Athens' Parthenon was a temple to Athena."], "words": [{"term": "acropolis", "meaning": "The fortified hilltop. Say: uh-KROP-uh-lis."}, {"term": "agora", "meaning": "The marketplace and meeting place. Say: AH-guh-ruh."}], "question": "You need a new clay pot. Where would you go?", "choices": ["The acropolis", "The agora"], "answer": 1, "feedback": "The agora! Look for the pottery stalls in the lower part of the picture.", "detailTitle": "What else happened here?", "details": ["During an attack, people could shelter on the fortified hilltop. Its temples showed the city's faith, pride and wealth.", "The agora also held discussions, speeches and community events. Government and court buildings stood around it. The Athenian Assembly met nearby."]}, {"title": "Same Greece. Very different school days.", "short": "Athens or Sparta?", "image": "compare", "alt": "Two illustrations: Athenian boys learning with a teacher, and Spartan boys training with shields.", "big": "Athens trained minds. Sparta trained soldiers.", "facts": ["Athens: learning, art, music and new ideas.", "Sparta: strength, discipline and obeying orders.", "Spartan boys left home for military training at seven."], "words": [{"term": "Athens", "meaning": "Remember: arts and arguments."}, {"term": "Sparta", "meaning": "Remember: soldiers and strength."}], "question": "Which child is more likely to practice public speaking and music?", "choices": ["An Athenian schoolboy", "A Spartan boy in military training"], "answer": 0, "feedback": "The Athenian schoolboy. Spartan training focused much more on military skills.", "detailTitle": "Girls, grown-ups and daily life", "details": ["Athens was near the sea and traded widely. Mostly wealthy boys went to school from about age seven. They learned reading, writing, math, music, exercise and speaking. Girls usually learned household skills at home.", "Sparta was in a valley away from the sea. Its tough training system was called the agoge. Boys practiced fighting skills, running and endurance with little comfort. They could be punished for getting caught stealing food.", "Spartan girls also exercised. Spartan women had more freedom than Athenian women: they managed households and land and could own or inherit property. Women in neither city could vote.", "Spartan men finished the agoge around age 20 and served as soldiers until 60. A phalanx was a close formation of soldiers with overlapping shields.", "Helots were enslaved workers forced to farm. Their work allowed Spartan citizens to train as soldiers. Helots outnumbered the citizens, who feared a rebellion."]}, {"title": "Who gets to decide?", "short": "Who rules?", "image": "government", "alt": "A simple decision-making diagram: many eligible citizens for democracy, a small group for oligarchy, and one ruler for tyranny.", "big": "Democracy: citizens decide. Oligarchy: a few people rule. Tyranny: one ruler takes power.", "facts": ["Athens: eligible male citizens voted directly.", "Sparta: a small group held the main power.", "Not everyone in Athens was allowed to vote."], "words": [{"term": "democracy", "meaning": "Citizens hold power."}, {"term": "oligarchy", "meaning": "A small powerful group rules."}, {"term": "citizen", "meaning": "A government-recognized person with rights and duties."}, {"term": "tyrant", "meaning": "A ruler who seized power and was not limited by law."}], "question": "Could every person living in Athens vote?", "choices": ["Yes, every resident could vote.", "No. Only eligible free Athenian male citizens."], "answer": 1, "feedback": "Right. Women, enslaved people and foreign residents could not vote. Athenian democracy had limits.", "detailTitle": "How their governments worked", "details": ["Direct democracy means citizens vote on issues themselves. In representative democracy, citizens choose people to decide for them.", "The class reading describes eligible citizens as free men born in Athens, with parents in the Athenian citizen class. Foreign residents were called metics.", "The Assembly debated laws, war and peace, and chose generals and officials. It could vote to banish someone for ten years. The Council of 500 was chosen by lottery each year and prepared the Assembly's work. Large juries decided court cases.", "In Sparta, two kings led the military. A council of 28 elders over 60 proposed laws and judged cases. Five officials called ephors oversaw the kings and daily affairs.", "For this quiz, remember the vocabulary slides' meaning of tyrant: someone who seized power and was not restricted by law. An ancient Greek tyrant was not always a cruel leader."]}, {"title": "Before science, stories gave answers.", "short": "Gods & stories", "image": 4, "alt": "Mythology illustration: Zeus with lightning, Poseidon with waves, and Pandora opening a jar with hope glowing inside.", "big": "Greek myths explained the world and taught lessons.", "facts": ["Thunder? A myth could connect it to Zeus.", "Stormy seas? A myth could connect them to Poseidon.", "Pandora's story explained troubles and hope."], "words": [{"term": "mythology", "meaning": "A culture's collection of traditional stories."}], "question": "In Pandora's story, what remained after troubles escaped?", "choices": ["A shield", "Hope"], "answer": 1, "feedback": "Hope. The story says it remained even after sickness, sorrow and other troubles escaped.", "detailTitle": "Pandora and the gods", "details": ["Many important Greek gods were believed to live on Mount Olympus. Myths explained natural events and explored feelings such as love, anger and jealousy. They taught lessons about pride, hospitality and choices.", "In the class story, Zeus had Hephaestus make Pandora. She married Epimetheus. Zeus gave her a box (a jar in some versions) and said not to open it. Curiosity won. Troubles escaped, but hope remained."]}, {"title": "Meet Pericles: Athens' Golden Age leader.", "short": "Meet Pericles", "image": 5, "alt": "Illustration of Pericles gesturing toward workers building the Parthenon.", "big": "Pericles helped Athens shine during its Golden Age.", "facts": ["He was an Athenian general and political leader.", "He supported citizens taking part in democracy.", "He backed great buildings, including the Parthenon."], "words": [{"term": "Pericles", "meaning": "Say PAIR-uh-kleez. Think: peak Athens."}], "question": "Which city did Pericles lead?", "choices": ["Athens", "Sparta"], "answer": 0, "feedback": "Athens! Pericles was a leader during its Golden Age.", "detailTitle": "The three-leader memory line", "details": ["Solon: around 594 BCE, ended debt slavery for Athenian citizens and let more people take part in government.", "Cleisthenes: around 508 BCE, weakened powerful families and strengthened the Assembly. He is called the Father of Athenian Democracy.", "Pericles: during the Golden Age, around 461-429 BCE, supported democracy and major building projects. Remember his name first: it is one of the ten quiz vocabulary words."]}], "vocabulary": [["civilization", "An organized society with arts, science, government and social structure.", "A whole society and its way of life.", 0], ["city-state (polis)", "An independent city with its own government and the land around it.", "A city that works like a small country.", 0], ["acropolis", "A fortified hilltop in a Greek city, often with temples and public buildings.", "UP for temples and protection.", 1], ["mythology", "A culture's traditional stories that explain beliefs about gods, nature and the world.", "Myths have meanings.", 4], ["agora", "A city-state's central public space for markets and meetings.", "GO to the agora to gather and shop.", 1], ["democracy", "Government where citizens hold power, directly or through elected representatives.", "Citizens decide.", "government"], ["oligarchy", "Government controlled by a small group of wealthy or powerful people.", "Only a few rule.", "government"], ["citizen", "A person recognized by the government as having rights and responsibilities.", "Rights AND duties.", "government"], ["tyrant", "In ancient Greece, a ruler who seized power and was not restricted by law.", "Took power; not always a bad leader.", "government"], ["Pericles", "An Athenian general and statesman who led Athens during its Golden Age.", "Pericles = peak Athens.", 5]], "gods": [["Zeus", "Sky and thunder; king of the gods"], ["Hera", "Marriage and childbirth; queen of the gods"], ["Poseidon", "Sea, earthquakes and horses"], ["Hades", "The Underworld"], ["Athena", "Wisdom, war strategy and crafts"], ["Apollo", "Sun, music, poetry, healing and archery"], ["Artemis", "Hunt, moon and wild animals"], ["Aphrodite", "Love, beauty and fertility"], ["Ares", "War and battle"], ["Hermes", "Messenger; travel and trade"], ["Hephaestus", "Blacksmith; tools and weapons"], ["Demeter", "Crops and harvest"]], "quiz": [["What is a civilization?", ["An organized, developed society", "One temple", "A kind of boat"], 0, "A civilization is a whole society with arts, science, government and social structure.", 0], ["A city rules itself and the land around it. What is it?", ["An agora", "A city-state (polis)", "A myth"], 1, "A polis is an independent city-state.", 0], ["Which word means the protected hilltop?", ["Agora", "Oligarchy", "Acropolis"], 2, "Acropolis = UP high, for temples and protection.", 1], ["What do we call a culture's collection of myths?", ["Mythology", "Democracy", "Geography"], 0, "Mythology is a collection of traditional stories.", 4], ["Where would people shop and meet friends?", ["The acropolis", "The agora", "The Underworld"], 1, "Agora = a public marketplace and meeting place.", 1], ["Citizens hold power in a...", ["tyranny", "myth", "democracy"], 2, "Democracy puts governing power with citizens.", "government"], ["A small powerful group rules in an...", ["oligarchy", "agora", "acropolis"], 0, "Oligarchy = only a few rule.", "government"], ["Who has rights and duties recognized by a government?", ["A myth", "A citizen", "A mountain"], 1, "A citizen has rights AND responsibilities.", "government"], ["A ruler seized power and was not limited by law. The quiz word is...", ["merchant", "citizen", "tyrant"], 2, "Tyrant describes how someone took and held power; not every ancient tyrant was cruel.", "government"], ["Who led Athens during its Golden Age?", ["Pericles", "Poseidon", "Zeus"], 0, "Pericles was an Athenian general and political leader.", 5], ["Why did separate Greek city-states grow?", ["The land was completely flat", "Mountains separated communities", "Every town followed one king"], 1, "Mountains made travel difficult. Communities developed their own governments.", 0], ["Why did the Greeks tell myths?", ["To set market prices", "To choose army uniforms", "To explain the world and teach lessons"], 2, "Myths explained events, taught values and explored feelings.", 4], ["Which city focused on military discipline?", ["Sparta", "Athens", "Both focused only on art"], 0, "Sparta trained soldiers. Athens emphasized learning, art and ideas.", 3], ["Who could vote in Athens, according to the reading?", ["Every resident", "Eligible free Athenian male citizens", "All women who owned land"], 1, "Women, enslaved people and foreign residents could not vote.", "government"], ["Which pair is right?", ["Acropolis = market; agora = hilltop", "Both were military schools", "Acropolis = hilltop temples; agora = markets and meetings"], 2, "Think UP for temples. DOWN for shopping.", 1]]};
const ATLAS='/ancient-greece/illustrations.png';
const root=document.getElementById('greece-study'),content=document.getElementById('content');

let mode='learn',lesson=0,word=0,flipped=false,qIndex=0,answers={},order=DATA.quiz.map((_,i)=>i),round='all';
try{const saved=JSON.parse(localStorage.getItem('greece-visual-study-v2')||'null');if(saved&&Number.isInteger(saved.lesson)&&saved.lesson>=0&&saved.lesson<6)lesson=saved.lesson;}catch(e){}

function art(n,alt='',cl=''){let xs=n%2===1?'-100%':'0',ys=n<2?0:n<4?414:808,ht=n<2?414:n<4?392:446;return `<div class="art ${cl}" style="aspect-ratio:627/${ht}"><img src="${ATLAS}" alt="${esc(alt||pictureAlt[n])}" style="left:${xs};transform:translateY(-${ys/1254*100}%)"></div>`;}
function people(n){return '<div class="people" aria-hidden="true">'+Array(n).fill('<span class="person"></span>').join('')+'</div>';}
function gov(){return `<div class="gov" role="img" aria-label="Democracy: eligible citizens decide. Oligarchy: a small group rules. Tyranny: one ruler seizes power. These figures illustrate the idea, not exact population counts."><div class="govrow"><h3>Democracy</h3>${people(8)}<p>Citizens decide.</p></div><div class="govrow"><h3>Oligarchy</h3>${people(3)}<p>A small powerful group rules.</p></div><div class="govrow"><h3>Tyranny</h3>${people(1)}<p>One ruler seizes power.</p></div></div>`;}
function visual(n,alt){if(n==='government')return gov();if(n==='compare')return `<div class="comparison"><div>${art(2)}<h3>Athens</h3><p>Learn. Speak. Create.</p></div><div>${art(3)}<h3>Sparta</h3><p>Train. Obey. Protect.</p></div></div>`;return art(n,alt);}
function setMode(m){mode=m;root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',b.dataset.mode===m)});render();content.scrollIntoView({block:'start',behavior:'auto'});}

function render(){if(mode==='learn')renderLesson();else if(mode==='words')renderWords();else if(mode==='quiz')renderQuiz();else renderParent();}
function renderLesson(){const l=DATA.lessons[lesson];content.innerHTML=`<div class="topline"><span class="kicker">Picture ${lesson+1} of 6</span><label class="picker">Jump to a lesson <select id="lesson-picker">${DATA.lessons.map((s,i)=>`<option value="${i}" ${i===lesson?'selected':''}>${i+1}. ${esc(s.short)}</option>`).join('')}</select></label></div><h1 class="lesson-title">${esc(l.title)}</h1><div class="scene-grid"><div>${visual(l.image,l.alt)}</div><div><p class="big-idea">${esc(l.big)}</p><div class="facts">${l.facts.map(f=>`<p class="fact">${esc(f)}</p>`).join('')}</div><div class="word-chips">${l.words.map((w,i)=>`<button data-word-tip="${i}" aria-expanded="false">${esc(w.term)} +</button>`).join('')}</div><p class="word-meaning" id="word-tip"></p><div class="callout"><h3>Quick check</h3><p>${esc(l.question)}</p><div class="choices">${l.choices.map((s,i)=>`<button data-check="${i}">${esc(s)}</button>`).join('')}</div><p class="feedback" id="lesson-feedback"></p><button class="reveal" id="lesson-reveal">Show me the answer</button></div></div></div><details class="learn-details"><summary>${esc(l.detailTitle)}</summary><div class="detail-copy">${l.details.map(d=>`<p>${esc(d)}</p>`).join('')}${lesson===4?`<div class="god-grid">${DATA.gods.map(g=>`<div><strong>${esc(g[0])}</strong><span>${esc(g[1])}</span></div>`).join('')}</div>`:''}</div></details><div class="lesson-nav"><button id="lesson-back" ${lesson===0?'disabled':''}>← Back</button><span class="dots">Look • say it • try it</span><button id="lesson-next" class="primary">${lesson===5?'Flip the words →':'Next picture →'}</button></div>`;
content.querySelector('#lesson-picker').onchange=e=>{lesson=Number(e.target.value);save();renderLesson();content.scrollIntoView({block:'start',behavior:'auto'});};
content.querySelector('#lesson-back').onclick=()=>{lesson--;save();renderLesson();content.scrollIntoView({block:'start',behavior:'auto'});};content.querySelector('#lesson-next').onclick=()=>{if(lesson===5)setMode('words');else{lesson++;save();renderLesson();content.scrollIntoView({block:'start',behavior:'auto'});}};
content.querySelectorAll('[data-word-tip]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.wordTip);content.querySelector('#word-tip').textContent=l.words[i].meaning;content.querySelectorAll('[data-word-tip]').forEach(x=>x.setAttribute('aria-expanded',x===b));});
const answer=(selected=null)=>{content.querySelectorAll('[data-check]').forEach(b=>{b.classList.toggle('correct',Number(b.dataset.check)===l.answer);b.classList.toggle('selected-wrong',selected!==null&&Number(b.dataset.check)===selected&&selected!==l.answer);});content.querySelector('#lesson-feedback').textContent=(selected===null||selected===l.answer?'':'Good try. ')+l.feedback;};content.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.check)));content.querySelector('#lesson-reveal').onclick=()=>answer();}
function renderWords(){const v=DATA.vocabulary[word];content.innerHTML=`<div class="topline"><span class="kicker">10 words • most of the quiz points</span><span class="status">Word ${word+1} of 10</span></div><h1 class="lesson-title">Know it? Say it. Then flip it.</h1><div class="word-layout"><div class="word-list">${DATA.vocabulary.map((w,i)=>`<button data-flash="${i}" class="${i===word?'active':''}" aria-pressed="${i===word}">${esc(w[0])}</button>`).join('')}</div><div class="flashcard">${visual(v[3])}<div class="big-word">${esc(v[0])}</div>${flipped?`<p class="definition">${esc(v[1])}</p><p class="clue">Memory clue: ${esc(v[2])}</p>`:'<p class="muted">What does this word mean?</p>'}<button id="flip" class="primary">${flipped?'Hide the meaning':'Flip: show the meaning'}</button><div class="lesson-nav"><button id="word-prev" ${word===0?'disabled':''}>← Previous</button><button id="word-next">${word===9?'Try the quiz →':'Next word →'}</button></div></div></div>`;content.querySelectorAll('[data-flash]').forEach(b=>b.onclick=()=>{word=Number(b.dataset.flash);flipped=false;renderWords();});content.querySelector('#flip').onclick=()=>{flipped=!flipped;renderWords();};content.querySelector('#word-prev').onclick=()=>{word--;flipped=false;renderWords();};content.querySelector('#word-next').onclick=()=>{if(word===9)setMode('quiz');else{word++;flipped=false;renderWords();}};}
function renderQuiz(){if(qIndex>=order.length){renderFinish();return;}const id=order[qIndex],q=DATA.quiz[id],a=answers[id],answered=a!==undefined;content.innerHTML=`<div class="topline"><span class="kicker">${round==='missed'?'Another try':'Practice • no timer'}</span><span class="status">Question ${qIndex+1} of ${order.length}</span></div><div class="quiz-layout"><div class="quiz-visual">${visual(q[4])}<p class="tiny">Use the picture as a clue.</p></div><div><h2 class="quiz-q">${esc(q[0])}</h2><div class="choices">${q[1].map((o,i)=>`<button data-answer="${i}" ${answered?'disabled':''} class="${answered&&i===q[2]?'correct':''} ${answered&&i===a&&i!==q[2]?'selected-wrong':''}">${esc(o)}</button>`).join('')}</div>${answered?`<p class="feedback">${a===q[2]?'You got it!':'Let’s learn this one.'} ${esc(q[3])}</p>`:''}<div class="quiz-counters"><button id="q-back" ${qIndex===0?'disabled':''}>← Back</button><button id="q-next" class="primary">${qIndex===order.length-1?'See my review →':'Next →'}</button></div><p class="tiny" style="margin-top:12px">You can skip a question and come back. These are practice questions, not the teacher's actual quiz.</p></div></div>`;content.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[id]=Number(b.dataset.answer);renderQuiz();});content.querySelector('#q-back').onclick=()=>{qIndex--;renderQuiz();};content.querySelector('#q-next').onclick=()=>{qIndex++;renderQuiz();};}
function renderFinish(){const missed=order.filter(i=>answers[i]!==DATA.quiz[i][2]),right=order.length-missed.length;content.innerHTML=`<div class="finish"><span class="kicker">Practice review</span><div class="big-score">${right} / ${order.length}</div><h2>${missed.length?'Here’s what to practice next.':'You explained every one!'}</h2><p>${missed.length?'Missed or skipped questions are a useful study list.':'Take a break. Try a few words again tomorrow.'}</p><div class="actions">${missed.length?'<button id="retry" class="primary">Try these again</button>':''}<button id="restart">Start a fresh quiz</button><button id="review-words">Review the words</button></div></div><div class="missed">${missed.map(i=>`<p><strong>${esc(DATA.quiz[i][0])}</strong><br>${esc(DATA.quiz[i][3])}</p>`).join('')}</div>`;if(missed.length)content.querySelector('#retry').onclick=()=>{order=missed;order.forEach(i=>delete answers[i]);qIndex=0;round='missed';renderQuiz();};content.querySelector('#restart').onclick=()=>{order=DATA.quiz.map((_,i)=>i);answers={};qIndex=0;round='all';renderQuiz();};content.querySelector('#review-words').onclick=()=>setMode('words');}
function renderParent(){content.innerHTML=`<span class="kicker">Keep it short. Keep it friendly.</span><h1 class="lesson-title" style="margin-top:10px">Two days. Small bites.</h1><div class="plan"><div class="day"><span class="kicker">Tonight • October 7</span><h3>15 minutes</h3><p>Look through the six picture lessons. Let Olivia-Kate explain what she sees. Try each quick check together.</p></div><div class="day"><span class="kicker">Tomorrow • October 8</span><h3>15 minutes + a break</h3><p>Flip the ten words. Take a break. Then try the quiz and revisit the words she misses.</p></div><div class="day"><span class="kicker">Friday • October 9</span><h3>5 minutes</h3><p>Ask: mountains or boats? Athens or Sparta? Acropolis or agora? Finish with her tricky vocabulary words.</p></div></div><div class="parent-text"><p><a href="/ancient-greece/picture-guide.pdf" target="_blank" rel="noopener"><strong>Download the printable picture guide (PDF)</strong></a></p><p><strong>The actual quiz:</strong> 15 multiple-choice questions: 10 vocabulary at 7.5 points each and five main ideas at five points each. This guide's practice is deliberately simpler, with three choices and one question at a time.</p><p><strong>Easy study loop:</strong> Look at a picture. Cover the words. Let her explain the idea. Give one hint if needed. Check together.</p><p><strong>Extra source details:</strong> Each picture lesson has an expandable section. These keep the teacher's linked reading details available without crowding the child’s first view. The mythology lesson includes the twelve gods from the reading.</p><p><strong>One school item:</strong> Review her completed “Main Ideas Exit Ticket: The Rise of Ancient Greece” in Canvas. The separate teacher-only document and answer key were not accessible.</p><p><strong>Teacher resources:</strong> <a href="https://sites.google.com/phm.k12.in.us/studysiteforsocialstudies/unit-2a-the-rise-of-ancient-greece" target="_blank" rel="noopener">Study site and all six readings</a> · <a href="https://docs.google.com/presentation/d/1_SYpiA_SZ79pHlypOtjIRETrm-8fzqMvvEgddXDwACQ/edit" target="_blank" rel="noopener">Vocabulary slides</a> · <a href="https://wayground.com/join?gc=53526364" target="_blank" rel="noopener">Wayground practice</a></p><p><strong>Source:</strong> Kristi Myers’ ParentSquare announcement and linked class study materials, read October 7, 2026. Simplified explanations and original practice activities. Generated scenes illustrate ideas; they are not evidence of exact buildings, clothing or appearances.</p><p><strong>On this device:</strong> The last picture lesson is remembered locally. Quiz answers stay only in the current open page. No accounts, messages or school submissions are involved.</p></div>`;}
render();
</script>
