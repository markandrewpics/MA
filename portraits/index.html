*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0c1322;color:#eef0f5;font-family:Jost,Arial,sans-serif}header{text-align:center;padding:30px 20px 24px}.name{margin:0;color:#f09a69;letter-spacing:.2em;font-size:12px;text-transform:uppercase}h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:42px;font-weight:400;line-height:1.1;margin:8px 0}.hint{font-size:12px;color:#bcc0c9;margin:10px 0 0}.gallery{max-width:1100px;padding:0 12px 20px;margin:auto;columns:2;column-gap:12px}.photo{display:block;break-inside:avoid;margin-bottom:12px;line-height:0;border-radius:3px;overflow:hidden;background:#141d2e}.photo img{display:block;width:100%;height:auto}.photo:focus-visible,button:focus-visible{outline:3px solid #f09a69;outline-offset:4px}footer{text-align:center;color:#bcc0c9;font-size:12px;padding:16px 20px 30px}dialog{border:0;padding:0;background:#080b12;color:#eef0f5;width:100%;height:100%;max-width:none;max-height:none;margin:0;overflow:hidden}dialog::backdrop{background:#080b12}.viewer{height:100%;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;min-height:60px}.count{font-size:13px;color:#c4c7cf}.controls{display:flex;gap:6px}button{color:#eef0f5;background:#1d2636;border:1px solid #485160;border-radius:4px;min-height:44px;min-width:48px;padding:8px 14px;font:inherit;cursor:pointer}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px 12px}.stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}.viewer-note{text-align:center;color:#c4c7cf;font-size:12px;margin:0;padding:0 12px 14px}@media(min-width:800px){header{padding:42px 20px 32px}h1{font-size:54px}.gallery{columns:3;column-gap:16px;padding:0 24px 20px}.photo{margin-bottom:16px}}@media(max-width:420px){.gallery{column-gap:8px;padding:0 8px 12px}.photo{margin-bottom:8px}}
</style></head><body><header><p class="name">Mark Andrew Photography</p><h1>Portraits</h1><p class="hint">Tap a photograph to view full screen</p></header><main class="gallery" aria-label="Portrait gallery"><a class="photo" href="images/01.webp" data-index="0" aria-label="View portrait 1: Dramatic studio portrait in a black high-neck gown"><img src="images/01.webp" width="1400" height="875" alt="Dramatic studio portrait in a black high-neck gown" loading="eager" decoding="async" fetchpriority=high></a>
<a class="photo" href="images/02.webp" data-index="1" aria-label="View portrait 2: Studio portrait in a pink suit and white blouse"><img src="images/02.webp" width="1200" height="1800" alt="Studio portrait in a pink suit and white blouse" loading="eager" decoding="async" ></a>
<a class="photo" href="images/03.webp" data-index="2" aria-label="View portrait 3: Outdoor portrait in a black suit with autumn trees"><img src="images/03.webp" width="1200" height="1800" alt="Outdoor portrait in a black suit with autumn trees" loading="lazy" decoding="async" ></a>
<a class="photo" href="images/04.webp" data-index="3" aria-label="View portrait 4: Seated portrait in a black outfit against a city backdrop"><img src="images/04.webp" width="1200" height="1800" alt="Seated portrait in a black outfit against a city backdrop" loading="lazy" decoding="async" ></a>
<a class="photo" href="images/05.webp" data-index="4" aria-label="View portrait 5: Smiling headshot in a blue blouse"><img src="images/05.webp" width="1400" height="933" alt="Smiling headshot in a blue blouse" loading="lazy" decoding="async" ></a>
<a class="photo" href="images/06.webp" data-index="5" aria-label="View portrait 6: Portrait in a burgundy suit beside a dressing-room mirror"><img src="images/06.webp" width="1400" height="933" alt="Portrait in a burgundy suit beside a dressing-room mirror" loading="lazy" decoding="async" ></a>
<a class="photo" href="images/07.webp" data-index="6" aria-label="View portrait 7: Outdoor seated portrait in a black suit"><img src="images/07.webp" width="1200" height="1800" alt="Outdoor seated portrait in a black suit" loading="lazy" decoding="async" ></a>
<a class="photo" href="images/08.webp" data-index="7" aria-label="View portrait 8: Portrait in a teal dress framed by greenery"><img src="images/08.webp" width="1400" height="933" alt="Portrait in a teal dress framed by greenery" loading="lazy" decoding="async" ></a>
<a class="photo" href="images/09.webp" data-index="8" aria-label="View portrait 9: Studio portrait in a white blouse and black trousers"><img src="images/09.webp" width="1400" height="933" alt="Studio portrait in a white blouse and black trousers" loading="lazy" decoding="async" ></a>
<a class="photo" href="images/10.webp" data-index="9" aria-label="View portrait 10: Backlit silhouette in a flowing black gown"><img src="images/10.webp" width="1200" height="1800" alt="Backlit silhouette in a flowing black gown" loading="lazy" decoding="async" ></a></main><footer>Photographs by Mark Andrew</footer><dialog aria-label="Full-screen portrait gallery"><div class="viewer"><div class="bar"><span class="count" aria-live="polite"></span><div class="controls"><button type="button" id="prev" aria-label="Previous portrait">&#8592;</button><button type="button" id="next" aria-label="Next portrait">&#8594;</button><button type="button" id="close" aria-label="Close full-screen gallery">Close</button></div></div><div class="stage"><img id="full" alt=""></div><p class="viewer-note">Swipe to browse</p></div></dialog><script>
const links=[...document.querySelectorAll('.photo')],dialog=document.querySelector('dialog'),full=document.querySelector('#full'),count=document.querySelector('.count');let index=0,opener=null,startX=0,startY=0;
function show(n){index=(n+links.length)%links.length;const img=links[index].querySelector('img');full.src=links[index].href;full.alt=img.alt;count.textContent=`${index+1} / ${links.length}`;const preload=new Image();preload.src=links[(index+1)%links.length].href;}
links.forEach((a,i)=>a.addEventListener('click',e=>{e.preventDefault();opener=a;show(i);dialog.showModal();document.body.style.overflow='hidden'}));
document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{document.body.style.overflow='';opener?.focus({preventScroll:true})});dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}});full.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});full.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)show(index+(dx<0?1:-1))},{passive:true});
</script></body></html>
