<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Photo Critique Review | Mark Andrew</title><link rel="stylesheet" href="/photo-critiques/style.css"><link rel="icon" href="/photo-critiques/logo.png"><script defer src="/photo-critiques/review/review.js"></script></head><body><header><img src="/photo-critiques/logo.png" alt="Mark Andrew Photography"><span>Private review area</span></header><main class="review"><h1>Photo critique submissions</h1><form id="login" class="panel"><h2>Sign in to review</h2><label for="code">Your private access code</label><input id="code" type="password" autocomplete="current-password" required><button style="margin-top:18px">Sign in</button></form><div id="message" class="notice" role="status"></div><section id="queue" hidden><div class="toolbar"><label for="filter">Show</label><select id="filter"><option>All</option><option>New</option><option>Selected</option><option>Reviewed</option><option>Archived</option></select><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Sign out</button><a href="/photo-critiques/">Submission page</a></div><p id="count" class="small"></p><div id="records"></div><button id="more" class="secondary" hidden>Load more submissions</button></section></main></body></html>
